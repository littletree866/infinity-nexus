<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blackjack</title>
    <link rel="icon" href="../../icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="blackjack.css">
</head>
<body>
<a href="../../mainpages/casino/casino.html" class="home-btn"><i class="fas fa-home"></i> Casino</a>
<div class="game-wrapper">
    <div class="game-panel">
        <div class="casino-header">
            <div class="title-section">
                <h1>Blackjack</h1>
            </div>
            <div class="stats-grid">
                <div class="stat"><div class="stat-label">Chips</div><div class="stat-value" id="balanceValue">1000</div></div>
                <div class="stat"><div class="stat-label">Bet</div><div class="stat-value" id="betAmount">0</div></div>
                <div class="stat"><div class="stat-label">Status</div><div class="stat-value" id="gameStateLabel">● Ready</div></div>
            </div>
        </div>

        
        <div class="betting-zone">
            <div class="bet-title">✦ Place your wager ✦</div>
            <div class="chips-container">
                <div class="chip" data-bet="1">$1</div>
                <div class="chip" data-bet="5">$5</div>
                <div class="chip" data-bet="10">$10</div>
                <div class="chip" data-bet="25">$25</div>
                <div class="chip" data-bet="50">$50</div>
                <div class="chip" data-bet="100">$100</div>
                <div class="chip" data-bet="500">$500</div>
                <div class="chip" data-bet="1000">$1000</div>
                
            </div>
            <div class="bet-actions">
                <button class="action-btn" id="clearBetBtn">⟳ Clear</button>
                <button class="action-btn primary" id="dealGameBtn">♠ Deal ♠</button>
            </div>
        </div>

        
        <div class="cards-arena">
            <div class="hand">
                <div class="hand-header">
                    <span class="hand-title">Dealer's hand</span>
                    <span class="score-badge" id="dealerScoreLabel"><span class="score-display" id="dealerScore">?</span><span class="card-count" id="dealerCardCount"></span></span>
                </div>
                <div class="cards-row" id="dealerHandContainer"></div>
            </div>

            <div class="hand">
                <div class="hand-header">
                    <span class="hand-title">Your hand</span>
                    <span class="score-badge" id="playerScoreLabel"><span class="score-display" id="playerScore">0</span><span class="card-count" id="playerCardCount"></span></span>
                </div>
                <div class="cards-row" id="playerHandContainer"></div>
            </div>
        </div>

        
        <div class="status-area" id="resultBox" class="result-space"></div>

        <div class="game-controls" id="actionButtons">
            <button class="action-btn" id="hitActionBtn" class="hidden-control">Hit</button>
            <button class="action-btn" id="standActionBtn" class="hidden-control"> Stand</button>
            <button class="action-btn primary" id="newRoundBtn" class="hidden-control">New round</button>
        </div>

        <div class="rules-footer">
            <span>Dealer stands on 17 | Ace = 1 or 11</span>
        </div>
    </div>
</div>
    <script src="blackjack.js" defer></script>
</body>
</html>
