<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cursed Dice</title>
    <link rel="icon" type="image/x-icon" href="../../icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="curseddice.css">
</head>
<body>
<a href="../../mainpages/casino/casino.html" class="home-btn"><i class="fas fa-home"></i> Casino</a>
<div class="game-portal">
    <div class="cursed-panel">
        <div class="occult-header">
            <h1>Cursed dice</h1>
            <div class="sub">where luck has a demonic price</div>
        </div>

        <div class="stat-row">
            <div class="stat-card"><div class="stat-label">Soul balance</div><div class="stat-number" id="balanceValue">500</div></div>
            <div class="stat-card"><div class="stat-label">Current wager</div><div class="stat-number" id="betAmount">0</div></div>
        </div>

        
        <div class="bet-ritual">
            <div class="bet-title">✦ Sacrifice your bet ✦</div>
            <div class="flex-bet">
                <input type="number" id="betInput" class="cursed-input" placeholder="enter amount" min="1" step="1">
                <button class="primary-btn" id="placeBetBtn">Bet</button>
            </div>
            <div class="quick-chips">
                <div class="chip-quick" data-quick="10">$10</div>
                <div class="chip-quick" data-quick="25">$25</div>
                <div class="chip-quick" data-quick="50">$50</div>
                <div class="chip-quick" data-quick="100">$100</div>
                <div class="chip-quick" data-quick="250">$250</div>
            </div>
        </div>

        
        <div class="dice-arena">
            <div class="dice-label">⟡ The cursed roll ⟡</div>
            <div class="dice-display" id="diceContainer">
                <div class="cursed-die" id="die1"><span class="die-value">🎲</span></div>
                <div class="cursed-die" id="die2"><span class="die-value">🎲</span></div>
            </div>
        </div>

        
        <div id="resultContainer"></div>

        
        <div class="action-group" id="actionFooter">
            <button class="secondary-btn" id="clearBetBtn" >OK</button>
            <button class="secondary-btn" id="newGameBtn" class="hidden-control">New game</button>
        </div>

        <div class="rules-tome">
            <div>Demonic rules:</div>
            <div><strong class="high-rule">13+ (High)</strong> → +150% win</div>
            <div><strong>10-12 (Mid)</strong> → +100%</div>
            <div><strong class="low-rule">7-9 (Low)</strong> → Lose bet</div>
            <div><strong class="curse-rule">2-6 (Curse)</strong> → Lose 150%</div>
            <div><strong class="snake-rule">Snake eyes (1)</strong> → Total annihilation!</div>
        </div>

    </div>
</div>
    <script src="curseddice.js" defer></script>
</body>
</html>
