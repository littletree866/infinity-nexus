<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Poker</title>
    <link rel="icon" href="../../icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="poker.css">
</head>
<body>
<a href="../../mainpages/casino/casino.html" class="home-btn"><i class="fas fa-home"></i> Casino</a>

<div class="poker-arena">
    <div class="stats-panel">
        <div class="stat-box"><div class="stat-label"><i class="fas fa-coins"></i> Chips</div><div class="stat-value" id="bankAmount">1000</div></div>
        <div class="stat-box"><div class="stat-label"><i class="fas fa-gem"></i> Pot</div><div class="stat-value" id="potAmount">0</div></div>
        <div class="stat-box"><div class="stat-label">🎲 Bet</div><div class="stat-value" id="currentBetDisplay">100</div></div>
        <div class="bet-selector" id="betOptions">
            <div class="bet-chip" data-bet="100">$100</div>
            <div class="bet-chip" data-bet="250">$250</div>
            <div class="bet-chip" data-bet="500">$500</div>
        </div>
    </div>

    <div class="felt">
        
        <div class="hand-section">
            <div class="hand-title"><span><i class="fas fa-robot"></i> Dealer</span> <span id="dealerStrengthLabel" class="strength-badge">?</span></div>
            <div class="cards" id="dealerCards"></div>
        </div>

        
        <div class="community-cards">
            <div class="cards" id="communityCards"></div>
        </div>

        
        <div class="hand-section">
            <div class="hand-title"><span><i class="fas fa-user-astronaut"></i> Your hand</span> <span id="playerStrengthLabel" class="strength-badge">?</span></div>
            <div class="cards" id="playerCards"></div>
        </div>

        <div class="stage-tracker" id="stageTracker">
            <div class="stage" data-stage="0">Pre-flop</div>
            <div class="stage" data-stage="1">Flop</div>
            <div class="stage" data-stage="2">Turn</div>
            <div class="stage" data-stage="3">River</div>
            <div class="stage" data-stage="4">Showdown</div>
        </div>

        <div class="action-bar" id="actionBar">
            <button class="poker-btn primary" id="betActionBtn"><i class="fas fa-money-bill"></i> Bet</button>
            <button class="poker-btn" id="callActionBtn" class="hidden-control"><i class="fas fa-handshake"></i> Call</button>
            <button class="poker-btn" id="raiseActionBtn" class="hidden-control"><i class="fas fa-arrow-up"></i> Raise</button>
            <button class="poker-btn" id="checkActionBtn"><i class="fas fa-check-circle"></i> Check</button>
            <button class="poker-btn warning" id="foldActionBtn"><i class="fas fa-flag"></i> Fold</button>
            <button class="poker-btn" id="newGameBtn" class="hidden-control"><i class="fas fa-redo-alt"></i> New game</button>
        </div>
        <div class="rules-hint">♠ ♥ ♣ ♦ | Use keyboard: B=Bet, C=Call, R=Raise, K=Check, F=Fold, 1/2/3 for quick bets</div>
    </div>
</div>

<div id="resultModal" class="result-overlay">
    <div class="result-card-modal">
        <h2 id="resultTitle" class="result-title">Result</h2>
        <p id="resultMessage" class="result-message">Details</p>
        <div class="hand-compare">
            <div><strong>Your Hand:</strong><br><span id="playerHandRank"></span></div>
            <div><strong>Dealer:</strong><br><span id="dealerHandRank"></span></div>
        </div>
        <button id="closeModalBtn" class="poker-btn primary" class="modal-close">Continue</button>
    </div>
</div>
    <script src="poker.js" defer></script>
</body>
</html>
