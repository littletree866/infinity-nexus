<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Impossible Game</title>
    <link rel="icon" href="../../icon.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="platformergame.css">
</head>
<body>
    <div id="homeScreen" class="active">
        <h1 class="home-title">The Impossible Game</h1>
        <canvas id="homeKnight" class="home-knight" width="24" height="28"></canvas>
        <div class="level-select-panel">
            <h3>Select a Level</h3>
            <div id="levelGrid" class="level-grid"></div>
        </div>
        <div class="home-footer">
            Beat a level to unlock the next<br>
            <span class="key">←</span> <span class="key">→</span> move &nbsp;·&nbsp;
            <span class="key">↑</span> / <span class="key">W</span> / <span class="key">Space</span> jump
        </div>
    </div>
    <div id="gameContainer">
        <canvas id="game"></canvas>
        <div id="ui">
            <div id="levelText"><span class="level-icon">🎯</span> Level: 1</div>
            <div id="scoreContainer"><span class="score-icon">⭐</span> Score: <span id="scoreText">0</span></div>
            <div id="healthContainer">
                <div id="heartsDisplay"></div>
            </div>
            
        </div>
        <div id="mobileControls">
            <div class="mobile-btn" id="leftBtn">←</div>
            <div class="mobile-btn" id="rightBtn">→</div>
            <div class="mobile-btn" id="jumpBtn">↑</div>
        </div>
        <button id="pauseBtn">⏸️ Pause</button>
        <button id="backBtn" class="back-button">🏠 Home</button>
        <div id="gameOverScreen" class="screen">
            <h2>Game Over</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Level: <span id="finalLevel">1</span></p>
            <button id="retryBtn" type="button">Try Again</button>
        </div>
        <div id="winScreen" class="screen">
            <h2>Victory! 🎉</h2>
            <p>Final Score: <span id="winScore">0</span></p>
            <button id="winHomeBtn" type="button">Home</button>
        </div>
    </div>
    <script src="platformergame.js" defer></script>
</body>
</html>
