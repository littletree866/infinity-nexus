            ctx.beginPath();
            ctx.ellipse(cx, ey + h + 2, w * 0.5, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            
            const legSwing = Math.sin(e.anim * 4) * 3;
            
            ctx.fillStyle = "#4a3a2a";
            ctx.fillRect(cx - 7, ey + h - 14 + legSwing, 6, 14);
            
            ctx.fillStyle = "#5a4a3a";
            ctx.fillRect(cx + 1, ey + h - 14 - legSwing, 6, 14);
            
            ctx.fillStyle = "#2a1a10";
            ctx.fillRect(cx - 8, ey + h - 4 + legSwing, 8, 4);
            ctx.fillRect(cx, ey + h - 4 - legSwing, 8, 4);
            
            ctx.fillStyle = "#4a3a2a";
            ctx.fillRect(cx - 8, ey + h - 4 + legSwing, 8, 1);
            ctx.fillRect(cx, ey + h - 4 - legSwing, 8, 1);

            
            
            ctx.fillStyle = "#6a4a2a";
            ctx.fillRect(cx - 9, ey + 20 + bob, 18, 14);
            ctx.fillStyle = "#7a5a3a";
            ctx.fillRect(cx - 8, ey + 21 + bob, 16, 12);
            
            ctx.fillStyle = "#3a2a1a";
            ctx.fillRect(cx - 9, ey + 30 + bob, 18, 3);
            ctx.fillStyle = "#c8a030";
            ctx.fillRect(cx - 2, ey + 30 + bob, 4, 3);
            
            ctx.fillStyle = "#4a3a2a";
            ctx.fillRect(cx - 12, ey + 19 + bob, 5, 6);
            ctx.fillRect(cx + 7, ey + 19 + bob, 5, 6);
            ctx.fillStyle = "#8a7a5a";
            ctx.fillRect(cx - 12, ey + 19 + bob, 5, 2);
            ctx.fillRect(cx + 7, ey + 19 + bob, 5, 2);
            
            ctx.fillStyle = "#c8b080";
            ctx.fillRect(cx - 11, ey + 23 + bob, 1, 1);
            ctx.fillRect(cx - 9, ey + 23 + bob, 1, 1);
            ctx.fillRect(cx + 8, ey + 23 + bob, 1, 1);
            ctx.fillRect(cx + 10, ey + 23 + bob, 1, 1);

            
            ctx.fillStyle = "#e8dcc8";
            ctx.fillRect(cx - 2, ey + 22 + bob, 4, 8);
            ctx.fillStyle = "#c8bca8";
            for (let i = 0; i < 3; i++) {
                ctx.fillRect(cx - 3, ey + 23 + i * 3 + bob, 6, 1);
            }

            
            const armSwing = Math.sin(e.anim * 4 + 1) * 2;
            
            ctx.fillStyle = "#5a4a3a";
            ctx.fillRect(cx - 13, ey + 22 + bob + armSwing, 5, 14);
            ctx.fillStyle = "#e8dcc8";
            ctx.fillRect(cx - 12, ey + 25 + bob + armSwing, 3, 8);
            
            ctx.fillStyle = "#c8bca8";
            ctx.fillRect(cx - 13, ey + 35 + bob + armSwing, 5, 3);

            
            const headY = ey + 4 + bob;

            
            ctx.fillStyle = "#8a8a9a";
            ctx.fillRect(cx - 10, headY - 4, 20, 6);
            ctx.fillStyle = "#b0b0c0";
            ctx.fillRect(cx - 9, headY - 3, 18, 3);
            ctx.fillStyle = "#6a6a7a";
            ctx.fillRect(cx - 10, headY - 1, 20, 1);
            
            ctx.fillStyle = "#3a3a4a";
            ctx.fillRect(cx - 11, headY + 2, 22, 2);

            
            ctx.fillStyle = "#e8dcc8";
            
            ctx.fillRect(cx - 11, headY - 8, 3, 6);
            ctx.fillRect(cx - 13, headY - 11, 3, 4);
            ctx.fillRect(cx - 14, headY - 14, 2, 3);
            ctx.fillStyle = "#c8bca8";
            ctx.fillRect(cx - 11, headY - 8, 1, 6);
            ctx.fillRect(cx - 13, headY - 11, 1, 4);
            
            ctx.fillStyle = "#e8dcc8";
            ctx.fillRect(cx + 8, headY - 8, 3, 6);
            ctx.fillRect(cx + 10, headY - 11, 3, 4);
            ctx.fillRect(cx + 12, headY - 14, 2, 3);
            ctx.fillStyle = "#c8bca8";
            ctx.fillRect(cx + 10, headY - 8, 1, 6);
            ctx.fillRect(cx + 12, headY - 11, 1, 4);

            
            ctx.fillStyle = "#8a1a10";
            ctx.fillRect(cx - 8, headY - 2, 16, 3);
            ctx.fillStyle = "#b02818";
            ctx.fillRect(cx - 7, headY - 1, 14, 2);
            ctx.fillStyle = "#d84028";
            ctx.fillRect(cx - 6, headY - 1, 4, 1);
            
            for (let i = 0; i < 5; i++) {
                const px = cx - 7 + i * 3;
                const ph = 3 + Math.sin(i * 1.7) * 2;
                ctx.fillStyle = "#b02818";
                ctx.fillRect(px, headY - 2 - ph, 2, ph);
                ctx.fillStyle = "#d84028";
                ctx.fillRect(px, headY - 2 - ph, 1, ph);
            }

            
            ctx.fillStyle = "#e8dcc8";
            ctx.fillRect(cx - 9, headY + 2, 18, 14);
            ctx.fillStyle = "#d0c4b0";
            ctx.fillRect(cx + 4, headY + 2, 5, 14);

            
            ctx.fillStyle = "#1a1008";
            ctx.fillRect(cx - 7, headY + 4, 5, 5);
            ctx.fillRect(cx + 2, headY + 4, 5, 5);

            
            ctx.fillStyle = "#44dd22";
            ctx.fillRect(cx - 6, headY + 5, 3, 3);
            ctx.fillRect(cx + 3, headY + 5, 3, 3);
            ctx.fillStyle = "#aaff88";
            ctx.fillRect(cx - 6, headY + 5, 2, 2);
            ctx.fillRect(cx + 3, headY + 5, 2, 2);
            
            ctx.fillStyle = "rgba(80, 255, 60, 0.3)";
            ctx.fillRect(cx - 7, headY + 4, 5, 5);
            ctx.fillRect(cx + 2, headY + 4, 5, 5);

            
            ctx.fillStyle = "#3a2a1a";
            ctx.fillRect(cx - 1, headY + 9, 2, 2);

            
            ctx.fillStyle = "#f0e8d8";
            
            ctx.fillRect(cx - 7, headY + 12, 14, 3);
            
            ctx.fillStyle = "#d0c4b0";
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(cx - 6 + i * 3, headY + 14, 2, 2);
            }
            
            ctx.fillStyle = "#f0e8d8";
            ctx.fillRect(cx - 9, headY + 11, 3, 5);
            ctx.fillRect(cx + 7, headY + 11, 3, 5);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(cx - 9, headY + 11, 1, 4);
            ctx.fillRect(cx + 7, headY + 11, 1, 4);

            
            const frontArmX = facing > 0 ? cx + 8 : cx - 13;
            ctx.fillStyle = "#6a4a2a";
            ctx.fillRect(frontArmX, ey + 22 + bob - armSwing, 5, 14);
            
            ctx.fillStyle = "#5a4a3a";
            ctx.fillRect(frontArmX, ey + 26 + bob - armSwing, 5, 2);
            ctx.fillRect(frontArmX, ey + 31 + bob - armSwing, 5, 2);
            
            ctx.fillStyle = "#e8dcc8";
            ctx.fillRect(frontArmX + 1, ey + 34 + bob - armSwing, 3, 3);

            
            const swordSwing = e.swordSwing || 0;
            
            const swordBaseX = facing > 0 ? frontArmX + 4 : frontArmX;
            const swordBaseY = ey + 34 + bob - armSwing;

            
            
            const bladeAngle = -0.5 + swordSwing * 2.2; 

            
            ctx.fillStyle = "#3a3020";
            ctx.fillRect(swordBaseX - 3, swordBaseY - 1, 6, 3);
            ctx.fillStyle = "#8a7a5a";
            ctx.fillRect(swordBaseX - 3, swordBaseY - 1, 6, 1);

            
            ctx.fillStyle = "#5a3a1a";
            ctx.fillRect(swordBaseX - facing * 3, swordBaseY, 2 * facing, 2);

            
            
            const bladeLen = 9;
            for (let i = 0; i < bladeLen; i++) {
                
                const curveOffset = Math.sin(i / bladeLen * Math.PI * 0.6) * 3;
                const bx = swordBaseX + facing * (i * 1.2 + curveOffset);
                const by = swordBaseY - (Math.cos(bladeAngle) * i) + Math.sin(bladeAngle) * 0.5 * i;

                
                ctx.fillStyle = "#b0b8c8";
                ctx.fillRect(bx, by, 2, 2);
                
                ctx.fillStyle = "#e8eef8";
                ctx.fillRect(bx, by, 1, 1);
            }

            
            for (let i = 1; i < bladeLen; i++) {
                const curveOffset = Math.sin(i / bladeLen * Math.PI * 0.6) * 3;
                const bx = swordBaseX + facing * (i * 1.2 + curveOffset) + facing;
                const by = swordBaseY - (Math.cos(bladeAngle) * i) + Math.sin(bladeAngle) * 0.5 * i + 1;
                ctx.fillStyle = "#88bbff";
                ctx.fillRect(bx, by, 1, 1);
            }

            
            if (e.swordActive) {
                const glowIntensity = Math.sin(swordSwing * Math.PI);
                ctx.fillStyle = `rgba(120, 220, 255, ${0.4 * glowIntensity})`;
                const glowX = swordBaseX + facing * 5;
                const glowY = swordBaseY - 4;
                ctx.beginPath();
                ctx.arc(glowX, glowY, 12, 0, Math.PI * 2);
                ctx.fill();
            }

            
            ctx.strokeStyle = "#2a1a10";
            ctx.lineWidth = 1;
            ctx.strokeRect(cx - 9, headY + 2, 18, 14); 
            ctx.strokeRect(cx - 9, ey + 20 + bob, 18, 14); 
        }

        
        
        
        function drawPlayer() {
            const px = player.x - camera.x;
            const py = player.y - camera.y;
            const vy = player.vy;
            const w = player.w;
            const h = player.h;

            
            const stretch = player.onGround ? 1.0 : Math.max(0.88, 1 - vy * 0.012);
            const squash = player.onGround ? 1.06 : Math.max(0.9, 1 + vy * 0.008);

            const bodyW = w * squash;
            const bodyH = h * stretch;
            const drawX = px + (w - bodyW) / 2;
            const drawY = py + (h - bodyH);
            const feetY = drawY + bodyH;
            const centerX = drawX + bodyW / 2;

            const alpha = player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0 ? 0.5 : 1;

            
            const walkSpeed = Math.abs(player.vx);
            const isWalking = walkSpeed > 0.5 && player.onGround;
            const walkCycle = isWalking ? Math.sin(gameTime * 0.02 * walkSpeed) : 0;
            const armCycle = isWalking ? Math.cos(gameTime * 0.02 * walkSpeed) : 0;

            
            ctx.fillStyle = `rgba(0,0,0,${0.3 * alpha})`;
            ctx.beginPath();
            ctx.ellipse(centerX, feetY + 2, 12, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            
            const legSwing = walkCycle * 2;
            ctx.fillStyle = "#3a2a4a";
            ctx.fillRect(centerX - 8, feetY - 8 + legSwing, 6, 8);
            ctx.fillRect(centerX + 2, feetY - 8 - legSwing, 6, 8);
            
            ctx.fillStyle = "#1a1a2a";
            ctx.fillRect(centerX - 9, feetY - 2 + legSwing, 8, 3);
            ctx.fillRect(centerX + 1, feetY - 2 - legSwing, 8, 3);
            
            ctx.fillStyle = "#4a4a6a";
            ctx.fillRect(centerX - 9, feetY - 2 + legSwing, 8, 1);
            ctx.fillRect(centerX + 1, feetY - 2 - legSwing, 8, 1);

            
            
            ctx.fillStyle = `rgba(30, 30, 60, ${alpha})`;
            ctx.fillRect(drawX - 1, drawY - 1, bodyW + 2, bodyH + 2);

            
            ctx.fillStyle = `rgba(200, 210, 240, ${alpha})`;
            ctx.fillRect(drawX, drawY, bodyW, bodyH);

            
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.fillRect(drawX + 2, drawY + 2, bodyW - 4, 6);

            
            ctx.fillStyle = `rgba(220, 228, 255, ${alpha})`;
            ctx.fillRect(drawX + 2, drawY + 8, bodyW - 4, bodyH - 16);

            
            ctx.fillStyle = `rgba(160, 170, 210, ${alpha})`;
            ctx.fillRect(drawX + bodyW - 6, drawY + 2, 4, bodyH - 4);

            
            ctx.fillStyle = `rgba(150, 160, 200, ${alpha})`;
            ctx.fillRect(drawX + 2, drawY + bodyH - 6, bodyW - 4, 4);

            
            ctx.fillStyle = `rgba(120, 140, 220, ${alpha})`;
            ctx.fillRect(centerX - 5, drawY + 10, 10, 14);
            ctx.fillStyle = `rgba(80, 100, 180, ${alpha})`;
            ctx.fillRect(centerX - 4, drawY + 11, 8, 12);

            
            ctx.fillStyle = `rgba(255, 220, 100, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(centerX, drawY + 14);
            ctx.lineTo(centerX + 3, drawY + 17);
            ctx.lineTo(centerX, drawY + 20);
            ctx.lineTo(centerX - 3, drawY + 17);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = `rgba(255, 255, 200, ${alpha})`;
            ctx.fillRect(centerX - 1, drawY + 16, 2, 2);

            
            ctx.fillStyle = `rgba(90, 90, 130, ${alpha})`;
            ctx.fillRect(drawX + 2, drawY + 2, 2, 2);
            ctx.fillRect(drawX + bodyW - 4, drawY + 2, 2, 2);
            ctx.fillRect(drawX + 2, drawY + bodyH - 4, 2, 2);
            ctx.fillRect(drawX + bodyW - 4, drawY + bodyH - 4, 2, 2);

            
            const eyeDir = player.facing;
            const eyeY = drawY + 8;

            
            ctx.fillStyle = `rgba(30, 30, 60, ${alpha})`;
            ctx.fillRect(centerX - 8 + eyeDir * 2, eyeY, 7, 7);
            ctx.fillRect(centerX + 1 + eyeDir * 2, eyeY, 7, 7);

            
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.fillRect(centerX - 7 + eyeDir * 2, eyeY + 1, 5, 5);
            ctx.fillRect(centerX + 2 + eyeDir * 2, eyeY + 1, 5, 5);

            
            ctx.fillStyle = `rgba(20, 20, 50, ${alpha})`;
            ctx.fillRect(centerX - 6 + eyeDir * 2 + eyeDir * 2, eyeY + 2, 3, 3);
            ctx.fillRect(centerX + 3 + eyeDir * 2 + eyeDir * 2, eyeY + 2, 3, 3);

            
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.fillRect(centerX - 6 + eyeDir * 2 + eyeDir * 2, eyeY + 2, 1, 1);
            ctx.fillRect(centerX + 3 + eyeDir * 2 + eyeDir * 2, eyeY + 2, 1, 1);

            
            ctx.fillStyle = `rgba(40, 40, 80, ${alpha})`;
            ctx.fillRect(centerX - 3 + eyeDir * 2, drawY + 18, 6, 2);
            
            ctx.fillRect(centerX - 4 + eyeDir * 2, drawY + 17, 1, 1);
            ctx.fillRect(centerX + 3 + eyeDir * 2, drawY + 17, 1, 1);

            
            const armSwing = armCycle * 2;

            
            ctx.fillStyle = `rgba(180, 190, 230, ${alpha})`;
            ctx.fillRect(drawX - 4, drawY + 12 + armSwing, 4, 10);
            ctx.fillStyle = `rgba(140, 150, 200, ${alpha})`;
            ctx.fillRect(drawX - 4, drawY + 12 + armSwing, 4, 3);
            
            ctx.fillStyle = `rgba(230, 200, 170, ${alpha})`;
            ctx.fillRect(drawX - 4, drawY + 22 + armSwing, 4, 3);

            
            ctx.fillStyle = `rgba(200, 210, 245, ${alpha})`;
            ctx.fillRect(drawX + bodyW, drawY + 12 - armSwing, 4, 10);
            ctx.fillStyle = `rgba(160, 170, 220, ${alpha})`;
            ctx.fillRect(drawX + bodyW, drawY + 12 - armSwing, 4, 3);
            
            ctx.fillStyle = `rgba(230, 200, 170, ${alpha})`;
            ctx.fillRect(drawX + bodyW, drawY + 22 - armSwing, 4, 3);

            
            const swordHandX = drawX + bodyW + 3;
            const swordHandY = drawY + 20 - armSwing;

            
            ctx.fillStyle = `rgba(120, 90, 50, ${alpha})`;
            ctx.fillRect(swordHandX - 2, swordHandY - 2, 4, 2);
            ctx.fillStyle = `rgba(200, 160, 60, ${alpha})`;
            ctx.fillRect(swordHandX - 2, swordHandY - 2, 4, 1);

            
            const bladeDir = player.facing;
            ctx.fillStyle = `rgba(200, 210, 230, ${alpha})`;
            for (let i = 0; i < 6; i++) {
                ctx.fillRect(swordHandX + i * bladeDir * 0.8, swordHandY - 3 - i * 1.5, 2, 2);
            }
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            for (let i = 1; i < 6; i++) {
                ctx.fillRect(swordHandX + i * bladeDir * 0.8, swordHandY - 3 - i * 1.5, 1, 1);
            }

            
            if (player.canDoubleJump && !player.onGround) {
                ctx.fillStyle = `rgba(0, 255, 255, ${alpha * 0.7})`;
                const s = Math.sin(gameTime * 0.02) * 2;
                ctx.fillRect(centerX - 4, drawY - 8 + s, 2, 2);
                ctx.fillRect(centerX + 2, drawY - 10 + s, 2, 2);
                ctx.fillRect(centerX + 6, drawY - 6 + s, 2, 2);
            }
        }

        function draw() {
            let shakeX = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
            let shakeY = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
            ctx.setTransform(1, 0, 0, 1, shakeX, shakeY);

            drawParallax();

            for (let p of platforms) drawPlatform(p);

            for (let fp of fakePlatforms) {
                let sx = fp.x - camera.x;
                let sy = fp.y - camera.y;
                if (sx + fp.w < 0 || sx > canvas.width || sy + fp.h < 0 || sy > canvas.height) continue;
                let alpha = 1;
                if (fp.triggered) {
                    const fadeTime = gameTime - fp.fadeStart;
                    if (fadeTime < 0.5) alpha = 1 - (fadeTime / 0.5);
                    else alpha = 0;
                }
                ctx.globalAlpha = alpha;
                ctx.fillStyle = "#aa6622";
                ctx.fillRect(sx, sy, fp.w, fp.h);
                ctx.fillStyle = "#dd9955";
                ctx.fillRect(sx + 2, sy + 2, fp.w - 4, fp.h - 4);
                ctx.fillStyle = "#ffcc88";
                ctx.fillRect(sx + 4, sy + 4, fp.w - 8, 4);
                ctx.strokeStyle = "#ffdd99";
                ctx.lineWidth = 2;
                ctx.strokeRect(sx + 1, sy + 1, fp.w - 2, fp.h - 2);
                ctx.globalAlpha = 1;
            }

            for (let e of enemies) drawEnemy(e);

            for (let cp of checkpoints) {
                let cpx = cp.x - camera.x;
                let cpy = cp.y - camera.y;
                const flagColor = cp.active ? "#00ff44" : "#ff2200";
                const baseColor = cp.active ? "#006622" : "#660000";
                const poleColor = "#aa8866";
                ctx.fillStyle = poleColor;
                ctx.fillRect(cpx + 17, cpy, 6, cp.h - 8);
                ctx.fillStyle = "#664422";
                ctx.fillRect(cpx + 17, cpy, 2, cp.h - 8);
                cp.anim += 0.08;
                let flagSway = Math.sin(cp.anim) * 7;
                ctx.fillStyle = flagColor;
                ctx.beginPath();
                ctx.moveTo(cpx + 23, cpy + 8);
                ctx.lineTo(cpx + 50 + flagSway, cpy + 18);
                ctx.lineTo(cpx + 23, cpy + 34);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = cp.active ? "#88ffaa" : "#ff8866";
                ctx.beginPath();
                ctx.moveTo(cpx + 23, cpy + 13);
                ctx.lineTo(cpx + 42 + flagSway, cpy + 18);
                ctx.lineTo(cpx + 23, cpy + 29);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = baseColor;
                ctx.fillRect(cpx, cpy + cp.h - 10, 44, 10);
                ctx.fillStyle = poleColor;
                ctx.fillRect(cpx, cpy + cp.h - 10, 44, 3);
            }

            for (let h of heartDrops) {
                if (!h.collected) {
                    let hx = h.x - camera.x;
                    let hy = h.y - camera.y + Math.sin(h.anim) * 3;
                    ctx.font = "24px serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("❤️", hx + h.w / 2, hy + h.h / 2);
                } else if (h.scale !== undefined) {
                    const hx = h.x - camera.x;
                    const hy = h.y - camera.y;
                    ctx.save();
                    ctx.translate(hx + h.w / 2, hy + h.h / 2);
                    ctx.scale(h.scale, h.scale);
                    ctx.font = "24px serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("❤️", 0, 0);
                    ctx.restore();
                }
            }

            for (let c of coins) {
                if (!c.collected) {
                    let cx = c.x - camera.x;
                    let cy = c.y - camera.y + Math.sin(c.anim) * 3;
                    ctx.font = "22px serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("🪙", cx + c.w / 2, cy + c.h / 2);
                }
            }

            for (let p of powerUps) {
                if (!p.collected) {
                    let px = p.x - camera.x;
                    let py = p.y - camera.y + Math.sin(p.anim) * 4;
                    if (p.type === 'doubleJump') {
                        ctx.fillStyle = "#006688";
                        ctx.fillRect(px, py, p.w, p.h);
                        ctx.fillStyle = "#00aadd";
                        ctx.fillRect(px + 2, py + 2, p.w - 4, p.h - 4);
                        ctx.fillStyle = "#00ddff";
                        ctx.fillRect(px + 3, py + 3, p.w - 6, p.h - 6);
                        ctx.fillStyle = "#88ffff";
                        ctx.fillRect(px + 4, py + 4, p.w - 8, 5);
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(px + 6, py + 8, 4, 4);
                        ctx.fillRect(px + p.w - 10, py + 8, 4, 4);
                        ctx.fillStyle = "#00aaff";
                        ctx.fillRect(px - 5, py + 8, 7, 14);
                        ctx.fillRect(px + p.w - 2, py + 8, 7, 14);
                    }
                }
            }

            if (goal) {
                let gx = goal.x - camera.x;
                let gy = goal.y - camera.y;
                ctx.fillStyle = "#886644";
                ctx.fillRect(gx + 20, gy, 6, goal.h);
                ctx.fillStyle = "#664422";
                ctx.fillRect(gx + 20, gy, 2, goal.h);
                goal.anim += 0.1;
                let sway = Math.sin(goal.anim) * 9;
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.moveTo(gx + 26, gy + 8);
                ctx.lineTo(gx + 56 + sway, gy + 20);
                ctx.lineTo(gx + 26, gy + 38);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#ffee66";
                ctx.beginPath();
                ctx.moveTo(gx + 26, gy + 13);
                ctx.lineTo(gx + 48 + sway, gy + 20);
                ctx.lineTo(gx + 26, gy + 33);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#444444";
                ctx.fillRect(gx, gy + goal.h, 50, 10);
                ctx.fillStyle = "#666666";
                ctx.fillRect(gx, gy + goal.h, 50, 3);
            }

            
            
            
            drawPlayer();

            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - camera.x - p.size / 2, p.y - camera.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        
        
        
        function loop(currentTime) {
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            update(deltaTime);
            draw();
            requestAnimationFrame(loop);
        }

        
        
        
        showHomeScreen();
        lastTime = performance.now();
        loop(lastTime);

        window.resetGame = resetGame;
        window.startGame = startGame;
        window.showHomeScreen = showHomeScreen;
    </script>
</body>
</html>
