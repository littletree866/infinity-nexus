<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Game</title>
  <link rel="icon" href="../../icon.jpg" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080c18;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 200, 255, 0.12);
      backdrop-filter: blur(4px);
      border: 1.5px solid #0af;
      color: #8cf;
      padding: 10px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      transition: 0.3s;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Grotesk', sans-serif;
      text-decoration: none;
    }
    .back-btn:hover { background: #0af3; transform: scale(1.05); box-shadow: 0 0 20px #0af6; }
    #gameContainer {
      position: relative;
      width: 900px;
      height: 640px;
      border-radius: 24px;
      box-shadow: 0 0 60px #0af4, 0 0 120px #0af2;
      border: 2px solid #2af8;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #0b1a2e, #03070f);
      cursor: none;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(4, 8, 20, 0.85);
      backdrop-filter: blur(6px);
      z-index: 20;
      transition: 0.25s;
      padding: 30px;
      text-align: center;
    }
    .overlay.hidden { display: none; }
    .overlay h1 {
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(135deg, #0af, #a0f);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px #0af6;
      letter-spacing: 6px;
      margin-bottom: 10px;
    }
    .overlay p { color: #b8d0e0; font-size: 18px; letter-spacing: 1px; max-width: 500px; line-height: 1.7; }
    .btn {
      background: transparent;
      border: 2px solid #0af;
      color: #0af;
      padding: 14px 44px;
      font-size: 22px;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.3s;
      margin: 12px 0;
      letter-spacing: 3px;
      box-shadow: 0 0 20px #0af3;
    }
    .btn:hover { background: #0af; color: #03070f; box-shadow: 0 0 40px #0af; transform: scale(1.03); }
    .btn-secondary { border-color: #f0a; color: #f0a; box-shadow: 0 0 20px #f0a3; }
    .btn-secondary:hover { background: #f0a; color: #03070f; }
    #hud {
      position: absolute;
      top: 16px; left: 20px;
      z-index: 10;
      display: flex;
      gap: 28px;
      align-items: center;
      background: rgba(0, 16, 32, 0.7);
      backdrop-filter: blur(5px);
      padding: 12px 24px;
      border-radius: 60px;
      border: 1px solid #2af6;
      font-size: 15px;
      color: #b8e4ff;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
    }
    #hud span { color: #fff; font-weight: 700; }
    .hud-score { color: #ffd866 !important; }
    .hud-lives { display: flex; gap: 4px; font-size: 18px; }
    #comboDisplay {
      position: absolute;
      top: 85px; left: 24px;
      font-size: 26px;
      font-weight: 900;
      color: #ffbb33;
      text-shadow: 0 0 30px #ffaa00, 0 0 60px #ff8800;
      z-index: 10;
      opacity: 0;
      transition: 0.2s;
      letter-spacing: 2px;
    }
    #comboDisplay.show { opacity: 1; }
    #messageCenter {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 38px;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 40px #0af, 0 0 80px #f0a;
      z-index: 15;
      pointer-events: none;
      text-align: center;
      opacity: 0;
      transition: 0.3s;
      background: rgba(0,0,0,0.3);
      padding: 16px 40px;
      border-radius: 40px;
      backdrop-filter: blur(3px);
      border: 1px solid #ffffff30;
    }
    #pauseScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(2, 6, 18, 0.88);
      backdrop-filter: blur(8px);
      z-index: 25;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #pauseScreen h1 { font-size: 52px; color: #f0a; text-shadow: 0 0 60px #f0a; }
    .key-hint { color: #6a8faa; font-size: 13px; margin-top: 20px; border-top: 1px solid #2af4; padding-top: 18px; }
    .key-hint kbd { background: #0a1a2a; padding: 6px 14px; border-radius: 30px; border: 1px solid #2af; color: #8cf; }
    @media (max-width: 920px) { #gameContainer { width: 98vw; height: 70vw; } #hud { font-size: 12px; padding: 8px 16px; gap: 12px; } .overlay h1 { font-size: 32px; } }
  </style>
</head>
<body>
  <a href="#" class="back-btn" onclick="window.location.href='../../index.html'">Home.</a>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="900" height="640"></canvas>

    <div id="hud">
      <div>✦ <span id="scoreDisplay" class="hud-score">0</span></div>
      <div>◈ Wave <span id="levelDisplay">1</span></div>
      <div class="hud-lives" id="livesDisplay">❤️❤️❤️❤️❤️</div>
      <div id="comboCounter" style="color:#ffbb33; display:none;">🔥 <span id="comboValue">0</span>x</div>
    </div>
    <div id="comboDisplay">⚡ Combo x<span id="comboBig">0</span></div>
    <div id="messageCenter"></div>

    
    <div id="startScreen" class="overlay">
      <h1>Space Game</h1>
      <button class="btn" id="startButton">▶ Play</button>
      <div style="margin-top:20px; color:#5a7f99; font-size:14px; letter-spacing:1px; line-height:1.8;">
        <kbd style="background:#0a1a2a; padding:4px 12px; border-radius:20px; border:1px solid #2af;">↑↓←→</kbd> move &nbsp;·&nbsp; <kbd style="background:#0a1a2a; padding:4px 12px; border-radius:20px; border:1px solid #2af;">Space</kbd> fire<br>
        <span style="color:#8cf;">Esc </span> to pause
      </div>
    </div>

    
    <div id="gameOver" class="overlay hidden">
      <h1 style="background:linear-gradient(135deg,#f44,#f0a);background-clip:text;-webkit-text-fill-color:transparent;">Game Over</h1>
      <p style="font-size:24px; color:#fff;">Score <span id="finalScore" style="color:#ffd866; font-size:36px;">0</span></p>
      <button class="btn" id="restartButton">⟳ Try Again</button>
    </div>

    
    <div id="pauseScreen">
      <h1>⏸ Paused</h1>
      <button class="btn" id="resumeButton" style="padding:10px 48px;">▶ Resume</button>
      <div class="key-hint"><kbd>Esc</kbd> to resume</div>
    </div>
  </div>

  <script>
    (function(){
      "use strict";

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const W = 900, H = 640;

      const scoreSpan = document.getElementById('scoreDisplay');
      const levelSpan = document.getElementById('levelDisplay');
      const livesSpan = document.getElementById('livesDisplay');
      const finalScoreSpan = document.getElementById('finalScore');
      const comboCounter = document.getElementById('comboCounter');
      const comboValue = document.getElementById('comboValue');
      const comboBig = document.getElementById('comboBig');
      const comboDisplay = document.getElementById('comboDisplay');
      const msgCenter = document.getElementById('messageCenter');

      const startScreen = document.getElementById('startScreen');
      const gameOverScreen = document.getElementById('gameOver');
      const pauseScreen = document.getElementById('pauseScreen');

      
      const state = {
        score: 0,
        lives: 5,
        maxLives: 5,
        wave: 0,          
        combo: 0,
        maxCombo: 0,
        running: false,
        paused: false,
        gameOver: false,
        powerups: [],
        explosions: [],
        healthPickups: [],
        enemies: [],
        bullets: [],
        stars: [],
        planets: [],
        bonusShips: [],
        enemiesSpawned: 0,
        enemiesPerWave: 8,
        healthCollected: 0,
        shieldActive: false,
        shieldEnd: 0,
        rapidFire: false,
        rapidEnd: 0,
        freezeActive: false,
        freezeEnd: 0,
        lastTime: 0,
        messageTimer: 0,
        messageText: '',
        
        isSwarm: false,
        swarmActive: false,    
        bossActive: false,
        boss: null,
        waveClearPending: false, 
        waveCount: 0,          
      };

      
      const player = {
        x: W/2, y: H-70,
        w: 24, h: 28,
        speed: 5.8,
        shootDelay: 280,
        lastShot: 0,
        color: '#0af',
        draw() {
          ctx.save(); ctx.translate(this.x, this.y);
          ctx.shadowColor = '#0af'; ctx.shadowBlur = 30;
          ctx.fillStyle = '#0af';
          ctx.beginPath();
          ctx.moveTo(0, -this.h/2 - 4);
          ctx.lineTo(-this.w/2, this.h/2 - 2);
          ctx.lineTo(-this.w/4, this.h/2 - 6);
          ctx.lineTo(0, this.h/2 + 2);
          ctx.lineTo(this.w/4, this.h/2 - 6);
          ctx.lineTo(this.w/2, this.h/2 - 2);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#8cf';
          ctx.beginPath();
          ctx.arc(0, -2, 7, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(2, -4, 3, 0, Math.PI*2);
          ctx.fill();
          if (keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight) {
            ctx.shadowColor = '#f80'; ctx.shadowBlur = 30;
            ctx.fillStyle = '#f80';
            ctx.beginPath();
            ctx.moveTo(-8, this.h/2-4);
            ctx.lineTo(0, this.h/2+14);
            ctx.lineTo(8, this.h/2-4);
            ctx.fill();
          }
          ctx.restore();
        }
      };

      
      const keys = { ArrowLeft:false, ArrowRight:false, ArrowUp:false, ArrowDown:false, ' ':false };
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape') { e.preventDefault(); togglePause(); return; }
        if (e.key === ' ') { e.preventDefault(); if (state.running && !state.paused && !state.gameOver) keys[' '] = true; }
        if (keys.hasOwnProperty(e.key)) { keys[e.key] = true; }
      });
      window.addEventListener('keyup', e => {
        if (e.key === ' ') { e.preventDefault(); keys[' '] = false; }
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
      });

      
      function rand(min,max) { return Math.random()*(max-min)+min; }
      function randInt(min,max) { return Math.floor(rand(min,max+1)); }
      function rectCollide(a,b) {
        return a.x - a.w/2 < b.x + b.w/2 && a.x + a.w/2 > b.x - b.w/2 &&
               a.y - a.h/2 < b.y + b.h/2 && a.y + a.h/2 > b.y - b.h/2;
      }

      
      function initStars() {
        state.stars = [];
        for (let i=0; i<280; i++) {
          state.stars.push({
            x: rand(0,W), y: rand(0,H),
            size: rand(0.8,2.8),
            speed: rand(0.5,3.5),
            bright: rand(0.3,1)
          });
        }
      }
      function updateStars(dt) {
        for (let s of state.stars) {
          s.y += s.speed * dt/16;
          if (s.y > H) { s.y = -2; s.x = rand(0,W); }
        }
      }
      function drawStars() {
        for (let s of state.stars) {
          ctx.globalAlpha = s.bright;
          ctx.fillStyle = '#cceeff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      
      function planetsOverlap(newPlanet) {
        for (let p of state.planets) {
          const dx = p.x - newPlanet.x;
          const dy = p.y - newPlanet.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < (p.size/2 + newPlanet.size/2 + 40)) return true;
        }
        return false;
      }

      function spawnPlanet() {
        let attempts = 0;
        let newPlanet;
        let placed = false;
        while (!placed && attempts < 20) {
          const size = rand(50,120);
          newPlanet = {
            x: rand(50,W-50),
            y: -size-20,
            size: size,
            speed: rand(0.3,1.2),
            color: `hsl(${randInt(200,260)}, 50%, ${randInt(15,35)}%)`,
            ring: Math.random() > 0.55,
            ringColor: `hsla(${randInt(180,280)}, 70%, 60%, 0.3)`
          };
          if (!planetsOverlap(newPlanet)) {
            placed = true;
          }
          attempts++;
        }
        if (placed) {
          state.planets.push(newPlanet);
        }
      }

      function updatePlanets(dt) {
        for (let p of state.planets) {
          p.y += p.speed * dt/16;
          if (p.y > H + p.size) {
            
            let attempts = 0;
            let placed = false;
            let newX = rand(50,W-50);
            while (!placed && attempts < 15) {
              newX = rand(50,W-50);
              let overlap = false;
              for (let other of state.planets) {
                if (other === p) continue;
                const dx = other.x - newX;
                const dy = other.y - (-p.size-20);
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < (other.size/2 + p.size/2 + 40)) { overlap = true; break; }
              }
              if (!overlap) placed = true;
              attempts++;
            }
            p.x = newX;
            p.y = -p.size-20;
          }
        }
      }

      function drawPlanets() {
        for (let p of state.planets) {
          ctx.shadowColor = '#0af3'; ctx.shadowBlur = 40;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2);
          ctx.fill();
          if (p.ring) {
            ctx.shadowBlur = 10;
            ctx.strokeStyle = p.ringColor;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size/2 + 10, 0, Math.PI*2);
            ctx.stroke();
          }
        }
        ctx.shadowBlur = 0;
      }

      
      function spawnEnemy() {
        if (!state.running || state.gameOver || state.paused) return;
        
        if (state.bossActive) return;

        const types = [
          { w:22, h:22, hp:1, pts:20, speed:1.2 },
          { w:30, h:30, hp:2, pts:40, speed:0.9 },
          { w:38, h:38, hp:3, pts:70, speed:0.7 }
        ];
        let t = types[randInt(0,2)];

        
        if (state.isSwarm) {
          t.hp = Math.ceil(t.hp * 1.25);
          t.pts = Math.ceil(t.pts * 1.3);
        }

        const hpBonus = Math.floor((state.wave-1)/2);
        const pattern = randInt(0,2);
        state.enemies.push({
          x: rand(t.w/2+10, W-t.w/2-10),
          y: -t.h,
          w: t.w, h: t.h,
          hp: t.hp + hpBonus,
          maxHp: t.hp + hpBonus,
          pts: t.pts,
          speed: t.speed * (1 + (state.wave-1)*0.04),
          pattern,
          step: rand(0,100),
          color: state.isSwarm ? `hsl(${randInt(280,320)}, 80%, 55%)` : `hsl(${randInt(0,40)}, 80%, 55%)`,
          shootTimer: 0,
          shootDelay: rand(1200, 2800),
          isSwarm: state.isSwarm
        });
        state.enemiesSpawned++;
      }

      
      function spawnBoss() {
        state.bossActive = true;
        state.boss = {
          x: W/2,
          y: 80,
          w: 70,
          h: 60,
          hp: 9,  
          maxHp: 9,
          speed: 1.8,
          pts: 500,
          color: '#ff2255',
          shootTimer: 0,
          shootDelay: 800,
          moveTimer: 0,
          moveDir: 1,
          phase: 0,
          minionTimer: 0,
          minionDelay: 2000,
        };
        showMessage('👾 BOSS APPROACHING!');
      }

      function updateBoss(dt) {
        if (!state.bossActive || !state.boss) return;
        const b = state.boss;

        
        b.moveTimer += dt;
        if (b.moveTimer > 2000) {
          b.moveDir *= -1;
          b.moveTimer = 0;
        }
        b.x += b.speed * b.moveDir * dt/16;
        b.x = Math.max(b.w/2 + 20, Math.min(W - b.w/2 - 20, b.x));

        
        b.y += Math.sin(b.moveTimer * 0.002) * 0.3;

        
        b.shootTimer += dt;
        if (b.shootTimer > b.shootDelay) {
          b.shootTimer = 0;
          
          for (let angle = -0.3; angle <= 0.3; angle += 0.15) {
            const dx = player.x - b.x;
            const dy = player.y - b.y;
            const d = Math.hypot(dx, dy) || 1;
            const speed = 3.2;
            state.bullets.push({
              x: b.x, y: b.y + b.h/2,
              w: 6, h: 12,
              vx: (dx/d) * speed + angle * 1.5,
              vy: (dy/d) * speed,
              enemy: true,
              color: '#ff4488'
            });
          }
        }

        
        b.minionTimer += dt;
        if (b.minionTimer > b.minionDelay) {
          b.minionTimer = 0;
          
          const side = Math.random() > 0.5 ? 1 : -1;
          state.enemies.push({
            x: b.x + side * 60,
            y: b.y + 30,
            w: 18,
            h: 18,
            hp: 1,
            maxHp: 1,
            pts: 15,
            speed: 1.5 + Math.random() * 0.5,
            pattern: 1,
            step: 0,
            color: '#ff6699',
            shootTimer: 0,
            shootDelay: 2000 + Math.random() * 1000,
            isSwarm: false,
            isMinion: true
          });
        }

        
        if (rectCollide(player, b)) {
          if (!state.shieldActive) {
            state.lives -= 2;
            if (state.lives <= 0) { gameOver(); return; }
          }
          createExplosion(b.x, b.y, 50);
          b.hp -= 2;
          if (b.hp <= 0) {
            bossDefeated();
          }
          updateHUD();
        }

        
        if (b.hp <= 0) {
          bossDefeated();
        }
      }

      function bossDefeated() {
        if (!state.boss) return;
        state.score += state.boss.pts;
        createExplosion(state.boss.x, state.boss.y, 80);
        
        for (let i=0; i<3; i++) {
          setTimeout(() => {
            if (Math.random() < 0.5) spawnPowerup(state.boss.x + rand(-40,40), state.boss.y + rand(-20,20));
            else spawnHealthPickup(state.boss.x + rand(-40,40), state.boss.y + rand(-20,20));
          }, i * 200);
        }
        state.bossActive = false;
        state.boss = null;
        state.isSwarm = false;
        state.swarmActive = false;
        showMessage('💥 BOSS DEFEATED!');
        
        setTimeout(() => {
          if (state.running) {
            startWave();
          }
        }, 1500);
      }

      function drawBoss() {
        if (!state.bossActive || !state.boss) return;
        const b = state.boss;
        ctx.shadowColor = '#f44'; ctx.shadowBlur = 50;
        ctx.fillStyle = b.color;
        
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - b.h/2);
        ctx.lineTo(b.x - b.w/2, b.y - b.h/4);
        ctx.lineTo(b.x - b.w/2 - 10, b.y + b.h/4);
        ctx.lineTo(b.x - b.w/3, b.y + b.h/2);
        ctx.lineTo(b.x, b.y + b.h/2 - 6);
        ctx.lineTo(b.x + b.w/3, b.y + b.h/2);
        ctx.lineTo(b.x + b.w/2 + 10, b.y + b.h/4);
        ctx.lineTo(b.x + b.w/2, b.y - b.h/4);
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowBlur = 5;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(b.x-12, b.y-6, 8, 0, Math.PI*2);
        ctx.arc(b.x+12, b.y-6, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#f00';
        ctx.beginPath();
        ctx.arc(b.x-14, b.y-8, 4, 0, Math.PI*2);
        ctx.arc(b.x+10, b.y-8, 4, 0, Math.PI*2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#333';
        ctx.fillRect(b.x-40, b.y-b.h/2-16, 80, 8);
        ctx.fillStyle = '#ff2255';
        ctx.fillRect(b.x-40, b.y-b.h/2-16, 80 * (b.hp/b.maxHp), 8);
        ctx.shadowBlur = 0;
      }

      
      function updateEnemies(dt) {
        for (let i=state.enemies.length-1; i>=0; i--) {
          const e = state.enemies[i];
          const spd = e.speed * dt/16;
          e.y += spd;
          if (e.pattern === 1) { e.x += Math.sin(e.step*0.04)*1.2; e.step++; }
          else if (e.pattern === 2) { e.x += Math.cos(e.step*0.05)*1.2; e.step++; }
          e.shootTimer += dt;
          if (e.shootTimer > e.shootDelay && e.y > 40 && e.y < H*0.7) {
            e.shootTimer = 0;
            state.bullets.push({
              x: e.x, y: e.y + e.h/2,
              w: 6, h: 14,
              vx: 0,
              vy: 3.8,
              enemy: true,
              color: '#ff6644'
            });
          }
          if (e.y > H + 30) { state.enemies.splice(i,1); continue; }
          if (rectCollide(player, e)) {
            if (!state.shieldActive) {
              
              state.lives -= state.isSwarm ? 2 : 1;
              if (state.lives <= 0) { gameOver(); return; }
            }
            createExplosion(e.x, e.y, 40);
            state.enemies.splice(i,1);
            updateHUD();
            continue;
          }
        }
      }

      function drawEnemies() {
        for (let e of state.enemies) {
          ctx.shadowColor = '#f44'; ctx.shadowBlur = 20;
          ctx.fillStyle = e.color;
          ctx.beginPath();
          const r = e.w/2;
          for (let j=0; j<6; j++) {
            const ang = j*Math.PI/3 - Math.PI/6;
            const px = e.x + r*Math.cos(ang), py = e.y + r*Math.sin(ang);
            j===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 5;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(e.x-4, e.y-2, 5, 0, Math.PI*2);
          ctx.arc(e.x+4, e.y-2, 5, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#222';
          ctx.beginPath();
          ctx.arc(e.x-5, e.y-4, 2.5, 0, Math.PI*2);
          ctx.arc(e.x+3, e.y-4, 2.5, 0, Math.PI*2);
          ctx.fill();
          if (e.hp < e.maxHp) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#333';
            ctx.fillRect(e.x-16, e.y-e.h/2-10, 32, 4);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(e.x-16, e.y-e.h/2-10, 32 * (e.hp/e.maxHp), 4);
          }
        }
        ctx.shadowBlur = 0;
      }

      
      function updateBullets(dt) {
        for (let i=state.bullets.length-1; i>=0; i--) {
          const b = state.bullets[i];
          b.x += b.vx * dt/16;
          b.y += b.vy * dt/16;
          if (b.y < -20 || b.y > H+20 || b.x < -20 || b.x > W+20) {
            state.bullets.splice(i,1);
            continue;
          }
          if (!b.enemy) {
            
            let hit = false;
            
            if (state.bossActive && state.boss && rectCollide(b, state.boss)) {
              state.boss.hp--;
              state.bullets.splice(i,1);
              if (state.boss.hp <= 0) {
                bossDefeated();
              }
              hit = true;
            }
            if (!hit) {
              for (let j=state.enemies.length-1; j>=0; j--) {
                const e = state.enemies[j];
                if (rectCollide(b, e)) {
                  e.hp--;
                  state.bullets.splice(i,1);
                  if (e.hp <= 0) {
                    state.score += e.pts;
                    state.combo++;
                    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
                    createExplosion(e.x, e.y, 30);
                    state.enemies.splice(j,1);
                    
                    const dropChance = state.isSwarm ? 0.6 : 0.28;
                    if (Math.random() < dropChance) {
                      if (Math.random() < 0.35 && state.lives < state.maxLives) spawnHealthPickup(e.x,e.y);
                      else spawnPowerup(e.x,e.y);
                    }
                    updateHUD();
                  }
                  hit = true;
                  break;
                }
              }
            }
          } else {
            
            if (rectCollide(player, b)) {
              if (!state.shieldActive) {
                state.lives -= state.isSwarm ? 2 : 1;
                if (state.lives <= 0) { gameOver(); return; }
              }
              state.bullets.splice(i,1);
              updateHUD();
              continue;
            }
          }
        }
      }

      function drawBullets() {
        for (let b of state.bullets) {
          ctx.shadowColor = b.enemy ? '#f44' : '#ffd866';
          ctx.shadowBlur = 20;
          ctx.fillStyle = b.color || (b.enemy ? '#ff6644' : '#ffd866');
          ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
        }
        ctx.shadowBlur = 0;
      }

      
      function spawnPowerup(x,y) {
        const types = ['shield','rapid','freeze','bomb'];
        const type = types[randInt(0,3)];
        const colors = { shield:'#2af', rapid:'#ffbb33', freeze:'#4df', bomb:'#f55' };
        const icons = { shield:'🛡️', rapid:'⚡', freeze:'❄️', bomb:'💥' };
        state.powerups.push({
          x, y, w:28, h:28,
          type, color: colors[type], icon: icons[type],
          vy: 1.8
        });
      }

      function updatePowerups(dt) {
        for (let i=state.powerups.length-1; i>=0; i--) {
          const p = state.powerups[i];
          p.y += p.vy * dt/16;
          if (p.y > H+30) { state.powerups.splice(i,1); continue; }
          if (rectCollide(player, p)) {
            applyPowerup(p);
            state.powerups.splice(i,1);
          }
        }
      }

      function drawPowerups() {
        for (let p of state.powerups) {
          ctx.shadowColor = p.color; ctx.shadowBlur = 30;
          ctx.fillStyle = p.color + '60';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.w/2+4, 0, Math.PI*2);
          ctx.fill();
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#fff';
          ctx.font = '22px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(p.icon, p.x, p.y+1);
        }
        ctx.shadowBlur = 0;
      }

      function applyPowerup(p) {
        const now = performance.now();
        switch(p.type) {
          case 'shield': state.shieldActive = true; state.shieldEnd = now + 4500; break;
          case 'rapid': state.rapidFire = true; state.rapidEnd = now + 4000; player.shootDelay = 120; break;
          case 'freeze': state.freezeActive = true; state.freezeEnd = now + 3500; break;
          case 'bomb':
            for (let e of state.enemies) { createExplosion(e.x,e.y,45); }
            state.enemies = [];
            if (state.bossActive && state.boss) {
              state.boss.hp -= 3;
              createExplosion(state.boss.x, state.boss.y, 60);
              if (state.boss.hp <= 0) bossDefeated();
            }
            break;
        }
        showMessage(`${p.icon} ${p.type.toUpperCase()}!`);
      }

      
      function spawnHealthPickup(x,y) {
        state.healthPickups.push({
          x, y, w:26, h:26,
          vy: 1.5,
          collected: false,
          icon: '❤️'
        });
      }

      function updateHealthPickups(dt) {
        for (let i=state.healthPickups.length-1; i>=0; i--) {
          const h = state.healthPickups[i];
          h.y += h.vy * dt/16;
          if (h.y > H+30) { state.healthPickups.splice(i,1); continue; }
          if (rectCollide(player, h)) {
            state.lives = Math.min(state.maxLives, state.lives+1);
            state.healthCollected++;
            showMessage('❤️ +1 life');
            state.healthPickups.splice(i,1);
            updateHUD();
          }
        }
      }

      function drawHealthPickups() {
        for (let h of state.healthPickups) {
          ctx.shadowColor = '#f44'; ctx.shadowBlur = 25;
          ctx.font = '26px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(h.icon, h.x, h.y);
        }
        ctx.shadowBlur = 0;
      }

      
      function createExplosion(x,y,size) {
        state.explosions.push({
          x, y, maxR: size,
          r: 4, life: 1,
          decay: 0.025 + rand(0.01,0.03)
        });
      }

      function updateExplosions(dt) {
        for (let i=state.explosions.length-1; i>=0; i--) {
          const e = state.explosions[i];
          e.life -= e.decay * dt/16;
          e.r += (e.maxR - e.r) * 0.12;
          if (e.life <= 0) { state.explosions.splice(i,1); }
        }
      }

      function drawExplosions() {
        for (let e of state.explosions) {
          ctx.globalAlpha = e.life * 0.9;
          ctx.shadowColor = '#f80'; ctx.shadowBlur = 50;
          ctx.fillStyle = `hsl(30, 100%, ${60+30*e.life}%)`;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = `hsl(60, 100%, 70%)`;
          ctx.beginPath();
          ctx.arc(e.x-6, e.y-6, e.r*0.5, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      }

      
      function spawnBonus() {
        if (!state.running || state.gameOver) return;
        state.bonusShips.push({
          x: rand(40,W-40), y: -30,
          w: 28, h: 28,
          speed: rand(1.2,2.2),
          pts: 150 + randInt(0,100),
          color: `hsl(${randInt(180,240)}, 90%, 65%)`
        });
        setTimeout(spawnBonus, rand(8000,16000));
      }

      function updateBonus(dt) {
        for (let i=state.bonusShips.length-1; i>=0; i--) {
          const b = state.bonusShips[i];
          b.y += b.speed * dt/16;
          if (b.y > H+30) { state.bonusShips.splice(i,1); continue; }
          if (rectCollide(player, b)) {
            state.score += b.pts;
            showMessage(`✦ +${b.pts} BONUS`);
            createExplosion(b.x,b.y,25);
            state.bonusShips.splice(i,1);
            updateHUD();
          }
        }
      }

      function drawBonus() {
        for (let b of state.bonusShips) {
          ctx.shadowColor = '#ffd866'; ctx.shadowBlur = 40;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.moveTo(b.x, b.y-b.h/2);
          ctx.lineTo(b.x-b.w/2, b.y+b.h/2);
          ctx.lineTo(b.x, b.y+b.h/3);
          ctx.lineTo(b.x+b.w/2, b.y+b.h/2);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('★', b.x, b.y-2);
        }
        ctx.shadowBlur = 0;
      }

      
      function startWave() {
        if (!state.running || state.gameOver) return;
        state.wave++;
        state.waveCount++;
        state.enemiesSpawned = 0;

        
        
        if (state.waveCount > 0 && state.waveCount % 3 === 0) {
          
          for (let e of state.enemies) {
            createExplosion(e.x, e.y, 30);
          }
          state.enemies = [];
          if (state.bossActive && state.boss) {
            createExplosion(state.boss.x, state.boss.y, 60);
            state.bossActive = false;
            state.boss = null;
          }
          showMessage('💥 ENEMIES CLEARED!');
          
          setTimeout(() => {
            if (state.running) {
              
              if (state.waveCount % 4 === 0) {
                startSwarmWave();
              } else {
                startNormalWave();
              }
            }
          }, 1200);
          return;
        }

        
        if (state.waveCount % 4 === 0) {
          startSwarmWave();
        } else {
          startNormalWave();
        }
      }

      function startNormalWave() {
        state.isSwarm = false;
        state.swarmActive = false;
        const count = state.enemiesPerWave + Math.floor((state.wave-1)*1.5);
        const delay = Math.max(180, 800 - state.wave*20);
        for (let i=0; i<count; i++) {
          setTimeout(() => spawnEnemy(), i * delay);
        }
        updateHUD();
        showMessage(`◈ WAVE ${state.wave}`);
      }

      function startSwarmWave() {
        state.isSwarm = true;
        state.swarmActive = true;
        const count = Math.floor((state.enemiesPerWave + Math.floor((state.wave-1)*1.5)) * 1.3);
        const delay = Math.max(120, 600 - state.wave*15);
        for (let i=0; i<count; i++) {
          setTimeout(() => spawnEnemy(), i * delay);
        }
        updateHUD();
        showMessage(`SWARM!`);

        
        const bossDelay = (count * delay) + 2000;
        setTimeout(() => {
          if (state.running && !state.gameOver) {
            spawnBoss();
          }
        }, bossDelay);
      }

      function checkWaveComplete() {
        
        if (state.bossActive || state.waveClearPending) return;

        if (state.enemies.length === 0 && state.enemiesSpawned > 0) {
          const totalExpected = state.enemiesPerWave + Math.floor((state.wave-2)*1.5);
          
          const expected = state.isSwarm ? Math.floor(totalExpected * 1.3) : totalExpected;
          if (state.enemiesSpawned >= expected) {
            
            state.waveClearPending = true;
            
            setTimeout(() => {
              state.waveClearPending = false;
              if (state.running && !state.gameOver && !state.bossActive) {
                startWave();
              }
            }, 800);
          }
        }
      }

      
      function updateHUD() {
        scoreSpan.textContent = state.score;
        levelSpan.textContent = state.wave || 1;
        let hearts = '';
        for (let i=0; i<state.maxLives; i++) hearts += i < state.lives ? '❤️' : '🩶';
        livesSpan.textContent = hearts;
        if (state.combo > 1) {
          comboCounter.style.display = 'inline';
          comboValue.textContent = state.combo;
          comboBig.textContent = state.combo;
          comboDisplay.classList.add('show');
        } else {
          comboCounter.style.display = 'none';
          comboDisplay.classList.remove('show');
        }
        
        if (state.isSwarm) {
          
        }
      }

      function showMessage(text) {
        state.messageText = text;
        state.messageTimer = 2200;
        msgCenter.textContent = text;
        msgCenter.style.opacity = 1;
      }

      function gameOver() {
        state.running = false;
        state.gameOver = true;
        finalScoreSpan.textContent = state.score;
        gameOverScreen.classList.remove('hidden');
      }

      function togglePause() {
        if (!state.running || state.gameOver) return;
        state.paused = !state.paused;
        pauseScreen.style.display = state.paused ? 'flex' : 'none';
        if (!state.paused) {
          state.lastTime = performance.now();
          requestAnimationFrame(gameLoop);
        }
      }

      
      function gameLoop(timestamp) {
        if (!state.running || state.paused || state.gameOver) {
          if (!state.gameOver && !state.paused) requestAnimationFrame(gameLoop);
          return;
        }
        const dt = Math.min(32, timestamp - (state.lastTime || timestamp));
        state.lastTime = timestamp;

        updateStars(dt);
        updatePlanets(dt);
        updateEnemies(dt);
        if (state.bossActive) {
          updateBoss(dt);
        }

        const spd = player.speed * dt/16;
        if (keys.ArrowLeft) player.x -= spd;
        if (keys.ArrowRight) player.x += spd;
        if (keys.ArrowUp) player.y -= spd;
        if (keys.ArrowDown) player.y += spd;
        player.x = Math.max(player.w/2, Math.min(W-player.w/2, player.x));
        player.y = Math.max(player.h/2, Math.min(H-player.h/2, player.y));

        if (keys[' ']) {
          const now = performance.now();
          if (now - player.lastShot > player.shootDelay) {
            player.lastShot = now;
            state.bullets.push({
              x: player.x, y: player.y - player.h/2 - 4,
              w: 4, h: 16,
              vx: 0, vy: -9,
              enemy: false,
              color: '#8cf'
            });
            if (state.rapidFire) {
              state.bullets.push({
                x: player.x-8, y: player.y - player.h/2,
                w: 3, h: 14,
                vx: -0.4, vy: -9,
                enemy: false,
                color: '#8cf'
              });
              state.bullets.push({
                x: player.x+8, y: player.y - player.h/2,
                w: 3, h: 14,
                vx: 0.4, vy: -9,
                enemy: false,
                color: '#8cf'
              });
            }
          }
        }

        updateBullets(dt);
        updatePowerups(dt);
        updateHealthPickups(dt);
        updateBonus(dt);
        updateExplosions(dt);

        const now2 = performance.now();
        if (state.shieldActive && now2 > state.shieldEnd) state.shieldActive = false;
        if (state.rapidFire && now2 > state.rapidEnd) { state.rapidFire = false; player.shootDelay = 280; }
        if (state.freezeActive && now2 > state.freezeEnd) state.freezeActive = false;
        if (state.freezeActive) {
          for (let e of state.enemies) e.speed = e.speed * 0.98;
        }

        checkWaveComplete();

        if (state.messageTimer > 0) {
          state.messageTimer -= dt;
          if (state.messageTimer <= 0) { msgCenter.style.opacity = 0; }
        }
        updateHUD();

        
        ctx.clearRect(0,0,W,H);
        drawStars();
        drawPlanets();
        drawEnemies();
        drawBoss();
        drawBullets();
        drawPowerups();
        drawHealthPickups();
        drawBonus();
        drawExplosions();
        player.draw();

        if (state.shieldActive) {
          ctx.strokeStyle = '#0af8'; ctx.lineWidth = 3;
          ctx.shadowColor = '#0af'; ctx.shadowBlur = 40;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.w*1.2, 0, Math.PI*2);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        if (state.isSwarm) {
          ctx.fillStyle = 'rgba(255, 0, 100, 0.08)';
          ctx.fillRect(0, 0, W, H);
        }

        requestAnimationFrame(gameLoop);
      }

      
      function resetGame() {
        state.score = 0;
        state.lives = state.maxLives;
        state.wave = 0;
        state.waveCount = 0;
        state.combo = 0;
        state.maxCombo = 0;
        state.healthCollected = 0;
        state.enemies = [];
        state.bullets = [];
        state.powerups = [];
        state.explosions = [];
        state.healthPickups = [];
        state.bonusShips = [];
        state.enemiesSpawned = 0;
        state.shieldActive = false;
        state.rapidFire = false;
        state.freezeActive = false;
        state.gameOver = false;
        state.paused = false;
        state.isSwarm = false;
        state.swarmActive = false;
        state.bossActive = false;
        state.boss = null;
        state.waveClearPending = false;
        state.running = true;

        player.x = W/2;
        player.y = H-70;
        player.shootDelay = 280;
        player.lastShot = 0;

        gameOverScreen.classList.add('hidden');
        pauseScreen.style.display = 'none';
        startScreen.classList.add('hidden');
        msgCenter.style.opacity = 0;
        state.lastTime = performance.now();

        initStars();
        state.planets = [];
        spawnPlanet();
        spawnPlanet();

        setTimeout(spawnBonus, 2000);

        
        setTimeout(() => {
          if (state.running) {
            startWave();
          }
        }, 400);

        updateHUD();
        requestAnimationFrame(gameLoop);
      }

      
      document.getElementById('startButton').addEventListener('click', resetGame);
      document.getElementById('restartButton').addEventListener('click', resetGame);
      document.getElementById('resumeButton').addEventListener('click', togglePause);

      startScreen.classList.remove('hidden');
      gameOverScreen.classList.add('hidden');
      initStars();

      function menuLoop() {
        if (state.running) return;
        ctx.clearRect(0,0,W,H);
        updateStars(16);
        drawStars();
        drawPlanets();
        requestAnimationFrame(menuLoop);
      }
      spawnPlanet();
      spawnPlanet();
      menuLoop();

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !state.running) {
          window.location.href = '../../index.html';
        }
      });

    })();
  </script>
</body>
</html>
