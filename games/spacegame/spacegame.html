<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Game</title>
  <link rel="icon" href="../../icon.jpg" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="spacegame.css">
</head>
<body>
  <a href="../../index.html" class="back-btn">Home</a>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="900" height="640"></canvas>

    <div id="hud">
      <div>✦ <span id="scoreDisplay" class="hud-score">0</span></div>
      <div>◈ Wave <span id="levelDisplay">1</span></div>
      <div class="hud-lives" id="livesDisplay">❤️❤️❤️❤️❤️</div>
      <div id="comboCounter" class="combo-counter">🔥 <span id="comboValue">0</span>x</div>
    </div>
    <div id="comboDisplay">⚡ Combo x<span id="comboBig">0</span></div>
    <div id="messageCenter"></div>

    
    <div id="startScreen" class="overlay">
      <h1>Space Game</h1>
      <button class="btn" id="startButton">▶ Play</button>
      <div class="controls-hint">
        <kbd class="key-hint-kbd">↑↓←→</kbd> move &nbsp;·&nbsp; <kbd class="key-hint-kbd">Space</kbd> fire<br>
        <span class="esc-hint">Esc</span> to pause
      </div>
    </div>

    
    <div id="gameOver" class="overlay hidden">
      <h1 class="game-over-title">Game Over</h1>
      <p class="game-over-score">Score <span id="finalScore" class="final-score">0</span></p>
      <button class="btn" id="restartButton">⟳ Try Again</button>
    </div>

    
    <div id="pauseScreen">
      <h1>⏸ Paused</h1>
      <button class="btn resume-btn" id="resumeButton">▶ Resume</button>
      <div class="key-hint"><kbd>Esc</kbd> to resume</div>
    </div>
  </div>
    <script src="spacegame.js" defer></script>
</body>
</html>
