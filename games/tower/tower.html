<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense</title>
  <link rel="icon" href="../../icon.jpg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #1a2a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f0e6d2;
      overflow: hidden;
    }
    /* ----- home screen ----- */
    #homeScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(145deg, #0f1a2b, #1d3349);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    .game-title {
      font-size: 5rem;
      color: #ffd966;
      text-shadow: 0 0 20px #ffb34755, 0 0 60px #ff8c0055;
      margin-bottom: 1.5rem;
      letter-spacing: 6px;
      animation: pulse-glow 2.4s infinite alternate;
    }
    @keyframes pulse-glow {
      0% { text-shadow: 0 0 10px #ffb34766, 0 0 30px #ff8c0044; }
      100% { text-shadow: 0 0 25px #ffd966cc, 0 0 70px #ff8c0088; }
    }
    .home-button {
      background: linear-gradient(145deg, #3b9e8c, #2a7a6b);
      border: none;
      padding: 18px 48px;
      margin: 12px;
      border-radius: 60px;
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f1a1a;
      box-shadow: 0 8px 0 #1a4f44, 0 10px 25px #00000055;
      cursor: pointer;
      transition: all 0.1s ease;
      min-width: 240px;
      letter-spacing: 1px;
    }
    .home-button:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #1a4f44, 0 18px 35px #00000077; }
    .home-button:active { transform: translateY(6px); box-shadow: 0 2px 0 #1a4f44; }
    /* ----- map selection ----- */
    #mapSelection {
      position: fixed;
      inset: 0;
      background: #0f1a2be0;
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2500;
    }
    .map-selection-title {
      font-size: 3rem;
      color: #ffd966;
      margin-bottom: 2rem;
      text-shadow: 0 4px 10px #00000077;
    }
    .maps-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .map-option {
      width: 180px;
      height: 140px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      border: 4px solid transparent;
      transition: 0.2s;
      box-shadow: 0 10px 20px #00000066;
      background: #2a3f4f;
    }
    .map-option:hover { transform: scale(1.04); border-color: #ffd966; }
    .map-option.active { border-color: #7ae9d6; box-shadow: 0 0 30px #7ae9d6aa; }
    .map-preview {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }
    .map-name { text-align: center; margin-top: 8px; font-size: 1.2rem; font-weight: 600; color: #f0e6d2; }
    /* ----- game container + ui ----- */
    #gameContainer {
      display: none;
      position: relative;
      margin: 10px;
      border-radius: 24px;
      box-shadow: 0 20px 40px #00000099;
    }
    #gameCanvas {
      display: block;
      width: 1200px;
      height: 700px;
      border-radius: 24px 0 0 24px;
      background: #1f3a2a;
      image-rendering: crisp-edges;
    }
    #ui {
      display: none;
      width: 380px;
      background: #1c2633;
      padding: 20px 16px;
      border-radius: 0 24px 24px 0;
      box-shadow: inset 0 0 30px #00000066;
      overflow-y: auto;
      height: 700px;
      scrollbar-width: thin;
      scrollbar-color: #5a6a7a #1c2633;
    }
    #ui::-webkit-scrollbar { width: 6px; }
    #ui::-webkit-scrollbar-track { background: #1c2633; }
    #ui::-webkit-scrollbar-thumb { background: #5a6a7a; border-radius: 10px; }
    h2 {
      font-size: 1.4rem;
      color: #ffd966;
      text-align: center;
      margin: 0 0 12px 0;
      border-bottom: 2px solid #3a4a5a;
      padding-bottom: 8px;
    }
    .panel {
      background: #232e3d;
      border-radius: 18px;
      padding: 16px 14px;
      margin-bottom: 16px;
      box-shadow: inset 0 2px 6px #00000055, 0 6px 12px #00000033;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #9aaec0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .value {
      background: #141c26;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffd966;
      border: 1px solid #3a4a5a;
      box-shadow: inset 0 2px 6px #00000066;
    }
    #healthDisp { color: #ff7b7b; }
    #moneyDisp { color: #7ae9d6; }
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 6px;
    }
    .actionButton {
      padding: 12px 8px;
      border-radius: 40px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 0 #00000055;
      background: #3a4a5a;
      color: #f0e6d2;
    }
    .actionButton:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .actionButton:active { transform: translateY(4px); box-shadow: 0 1px 0 #00000055; }
    #startWaveBtn { background: #3b9e8c; color: #0f1a1a; }
    #pauseBtn { background: #bf8f4a; color: #1c140a; }
    .wave-info { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #b0c4d0;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .checkbox-label input { accent-color: #7ae9d6; width: 18px; height: 18px; }
    /* tower buttons */
    .towerButton {
      width: 100%;
      padding: 12px 14px;
      background: #283544;
      border: 2px solid #3a4a5a;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 600;
      margin: 6px 0;
      cursor: pointer;
      color: #e8f0f0;
      transition: 0.1s;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .towerButton:hover { background: #334455; border-color: #7a8a9a; transform: translateX(4px); }
    .towerButton.tower-button-active { background: #3b6b5a; border-color: #7ae9d6; box-shadow: 0 0 20px #7ae9d666; }
    .tower-cost {
      background: #141c26;
      padding: 4px 12px;
      border-radius: 30px;
      color: #ffd966;
      font-weight: 700;
    }
    .back-button {
      background: #6a4a4a;
      border: none;
      color: #f0e6d2;
      padding: 12px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: 0.15s;
      box-shadow: 0 4px 0 #3a2a2a;
    }
    .back-button:hover { background: #7a5a5a; transform: translateY(-2px); }
    .back-button:active { transform: translateY(4px); box-shadow: 0 1px 0 #3a2a2a; }
    /* overlays */
    .game-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #141c26f0;
      backdrop-filter: blur(8px);
      padding: 32px 40px;
      border-radius: 40px;
      border: 3px solid #ffd966;
      text-align: center;
      display: none;
      z-index: 2000;
      min-width: 320px;
    }
    .game-overlay h2 { color: #ffd966; font-size: 2.2rem; margin-bottom: 16px; }
    .restart-btn {
      background: #3b9e8c;
      border: none;
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f1a1a;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 6px 0 #1a4f44;
      transition: 0.1s;
    }
    .restart-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #1a4f44; }
    .restart-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #1a4f44; }
    #tileInfo {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: #141c26ee;
      padding: 10px 18px;
      border-radius: 40px;
      font-size: 0.9rem;
      border: 1px solid #ffd96655;
      color: #d0dce0;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    #instructions {
      position: absolute;
      top: 18px;
      right: 18px;
      background: #141c26dd;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid #ffd96644;
      max-width: 230px;
      backdrop-filter: blur(4px);
      color: #c8d8e0;
    }
    .tooltip { position: relative; display: inline-block; margin-left: 4px; }
    .tooltip .tooltip-text {
      visibility: hidden;
      width: 200px;
      background: #1c2633;
      color: #d0dce0;
      border-radius: 16px;
      padding: 12px;
      position: absolute;
      bottom: 140%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: 0.2s;
      font-size: 0.8rem;
      border: 1px solid #3a4a5a;
      pointer-events: none;
    }
    .tooltip:hover .tooltip-text { visibility: visible; opacity: 1; }
  </style>
</head>
<body>

  <!-- HOME -->
  <div id="homeScreen">
    <h1 class="game-title">Tower Defense</h1>
    <button class="home-button" onclick="showMapSelection()">▶ Play</button>
    <button class="home-button" onclick="showInstructions()">Info</button>
  </div>

  <!-- MAP SELECTION -->
  <div id="mapSelection">
    <h2 class="map-selection-title">Select A Map</h2>
    <div class="maps-container">
      <div class="map-option active" onclick="selectMap('forest', event)">
        <div class="map-preview" style="background: linear-gradient(145deg, #1f4a2a, #2f6a3f, #4a8a5a);"></div>
        <div class="map-name">Forest</div>
      </div>
      <div class="map-option" onclick="selectMap('desert', event)">
        <div class="map-preview" style="background: linear-gradient(145deg, #c9a86a, #ddc08a, #f0dbb0);"></div>
        <div class="map-name">Desert</div>
      </div>
      <div class="map-option" onclick="selectMap('arctic', event)">
        <div class="map-preview" style="background: linear-gradient(145deg, #5a8a9a, #7ab0c0, #a0d0e0);"></div>
        <div class="map-name">Arctic</div>
      </div>
      <div class="map-option" onclick="selectMap('volcano', event)">
        <div class="map-preview" style="background: linear-gradient(145deg, #6a1a1a, #9a2a2a, #cc3a3a);"></div>
        <div class="map-name">Volcano</div>
      </div>
    </div>
    <button class="home-button" onclick="startGameWithMap()" style="min-width:200px;">Start Game</button>
  </div>

  <!-- GAME -->
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1200" height="700"></canvas>
    <div id="tileInfo">Tile (0,0) | Selected: none</div>
    <div id="instructions">1-6 towers · P pause · ESC cancel</div>

    <div id="gameOver" class="game-overlay">
      <h2>Game Over</h2>
      <p id="finalScore">Wave: 0</p>
      <p>Enemies defeated: <span id="finalEnemies">0</span></p>
      <p>Money: <span id="finalMoney">0</span></p>
      <button class="restart-btn" onclick="showHomeScreen()">Back</button>
    </div>
    <div id="victoryScreen" class="game-overlay">
      <h2>You Win!</h2>
      <p>All waves cleared!</p>
      <p>Score: <span id="finalScoreVictory">0</span></p>
      <button class="restart-btn" onclick="showHomeScreen()">Back</button>
    </div>
  </div>

  <!-- UI -->
  <div id="ui">
    <h2><span id="currentMapName">Forest</span></h2>
    <div class="panel">
      <div class="stats-grid">
        <div class="stat"><div class="label">Wave</div><div class="value" id="waveDisp">1</div></div>
        <div class="stat"><div class="label">Enemies</div><div class="value" id="enemyDisp">0</div></div>
        <div class="stat"><div class="label">Health</div><div class="value" id="healthDisp">20</div></div>
        <div class="stat"><div class="label">Money</div><div class="value" id="moneyDisp">$100</div></div>
      </div>
      <div class="button-group">
        <button id="startWaveBtn" class="actionButton" onclick="startWave()">Start Wave</button>
        <button id="pauseBtn" class="actionButton" onclick="togglePause()">Pause Game</button>
      </div>
      <div class="wave-info">
        <label class="checkbox-label"><input id="autoNext" type="checkbox"> ▶ Auto-start</label>
      </div>
    </div>

    <div class="panel">
      <h3>Towers</h3>
      <button class="towerButton" onclick="selectTower('basic')" id="towerBtn-basic">Basic <span class="tower-cost">$30</span></button>
      <button class="towerButton" onclick="selectTower('sniper')" id="towerBtn-sniper">Sniper <span class="tower-cost">$70</span></button>
      <button class="towerButton" onclick="selectTower('frost')" id="towerBtn-frost">Frost <span class="tower-cost">$70</span></button>
      <button class="towerButton" onclick="selectTower('bomb')" id="towerBtn-bomb">Bomb <span class="tower-cost">$125</span></button>
      <button class="towerButton" onclick="selectTower('flame')" id="towerBtn-flame">Flame <span class="tower-cost">$160</span></button>
      <button class="towerButton" onclick="selectTower('tesla')" id="towerBtn-tesla">Tesla <span class="tower-cost">$200</span></button>
    </div>
    <button class="back-button" onclick="showHomeScreen()">Quit</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const TILE = 40;
    const COLS = Math.floor(canvas.width / TILE);
    const ROWS = Math.floor(canvas.height / TILE);

    // paths (two lanes)
    const pathTiles1 = [
      {x:0,y:2},{x:1,y:2},{x:2,y:2},{x:3,y:2},{x:4,y:2},{x:5,y:2},{x:6,y:2},{x:7,y:2},{x:8,y:2},{x:9,y:2},
      {x:9,y:3},{x:10,y:3},{x:11,y:3},{x:12,y:3},{x:13,y:3},{x:14,y:3},{x:15,y:3},{x:16,y:3},{x:17,y:3},
      {x:17,y:4},{x:17,y:5},{x:17,y:6},{x:17,y:7},
      {x:18,y:7},{x:19,y:7},{x:20,y:7},{x:21,y:7},{x:22,y:7},{x:23,y:7},{x:24,y:7},{x:25,y:7},{x:26,y:7},{x:27,y:7},
      {x:27,y:6},{x:27,y:5},{x:27,y:4},{x:27,y:3},
      {x:28,y:3},{x:29,y:3},{x:30,y:3}
    ];
    const pathTiles2 = [
      {x:0,y:11},{x:1,y:11},{x:2,y:11},{x:3,y:11},{x:4,y:11},{x:5,y:11},{x:6,y:11},{x:7,y:11},{x:8,y:11},{x:9,y:11},
      {x:9,y:10},{x:10,y:10},{x:11,y:10},{x:12,y:10},{x:13,y:10},{x:14,y:10},{x:15,y:10},{x:16,y:10},{x:17,y:10},
      {x:17,y:9},{x:17,y:8},{x:17,y:7},
      {x:18,y:7},{x:19,y:7},{x:20,y:7},{x:21,y:7},{x:22,y:7},{x:23,y:7},{x:24,y:7},{x:25,y:7},{x:26,y:7},{x:27,y:7},
      {x:27,y:8},{x:27,y:9},{x:27,y:10},
      {x:28,y:10},{x:29,y:10},{x:30,y:10}
    ];
    const path1 = pathTiles1.map(t => ({x:t.x*TILE+TILE/2, y:t.y*TILE+TILE/2}));
    const path2 = pathTiles2.map(t => ({x:t.x*TILE+TILE/2, y:t.y*TILE+TILE/2}));

    const game = {
      wave:1, money:100, health:20, enemies:[], towers:[], projectiles:[], particles:[],
      placing:null, selectedTower:null, toSpawn:0, spawnTimer:0, waveInProgress:false,
      paused:false, autoNext:false, spawnInterval:1.0, totalWaves:50,
      gameOver:false, victory:false, placingPos:{x:0,y:0},
      enemiesDefeated:0, totalMoneyEarned:0, currentMap:'forest',
      mapStyles: {
        forest: { grassPatterns:[['#3a7a4a','#4a8a5a','#5a9a6a'],['#2a6a3a','#3a7a4a','#4a8a5a']], pathPatterns:['#7a6a4a','#8a7a5a','#9a8a6a','#aa9a7a'], bgColor:'#1a3a2a', tileBorder:'#2a4a3a44', pathOutline:'#6a5a3a66' },
        desert: { grassPatterns:[['#c9a86a','#ddc08a','#f0dbb0'],['#b8985a','#c9a86a','#ddc08a']], pathPatterns:['#b8a080','#c8b090','#d8c0a0','#e8d0b0'], bgColor:'#eddcb7', tileBorder:'#b0886066', pathOutline:'#a0806066' },
        arctic: { grassPatterns:[['#7ab0c0','#9ac8d8','#bae0f0'],['#6a9aaa','#7ab0c0','#9ac8d8']], pathPatterns:['#b0c8d8','#c0d8e8','#d0e8f0','#e0f0f8'], bgColor:'#d6f3fb', tileBorder:'#8ab0c066', pathOutline:'#7aa0b066' },
        volcano: { grassPatterns:[['#6a1a1a','#8a2a2a','#aa3a3a'],['#4a0a0a','#6a1a1a','#8a2a2a']], pathPatterns:['#6a4a3a','#7a5a4a','#8a6a5a','#9a7a6a'], bgColor:'#3a1a1a', tileBorder:'#8a3a3a66', pathOutline:'#7a3a2a66' }
      }
    };

    let tileMap = [];
    function initTileMap() {
      tileMap = Array.from({length:ROWS}, (_,y) => Array.from({length:COLS}, (_,x) => ({type:'grass', walkable:true, decoration:null, grassVariant: (x+y)%4 })));
      [...pathTiles1, ...pathTiles2].forEach(t => { if(tileMap[t.y]?.[t.x]) tileMap[t.y][t.x] = {type:'path', walkable:false}; });
    }
    initTileMap();

    // ============================================================
    //  TOWER STATS (level 0 only, upgrade-ready)
    // ============================================================
    const TOWER_STATS = {
      basic: [{ range:140, dmg:12, firerate:1.0, cost:30, color:'#b0c4de' }],
      sniper: [{ range:280, dmg:45, firerate:0.7, cost:70, color:'#8a9aaa' }],
      frost: [{ range:160, dmg:9, firerate:1.2, slow:0.45, cost:70, color:'#b0e8f0' }],
      bomb: [{ range:130, dmg:28, firerate:1.0, aoe:75, cost:125, color:'#ffd966' }],
      flame: [{ range:135, dmg:11, firerate:1.4, dot:6, dotDuration:3.0, cost:160, color:'#ff6a3a' }],
      tesla: [{ range:145, dmg:12, firerate:1.8, chain:4, chainRange:80, cost:200, color:'#b080d0' }]
    };

    // ============================================================
    //  CLASSES
    // ============================================================
    class Enemy {
      constructor(type, pathIdx=0) {
        const base = { normal:{hp:40,speed:80,gold:5,color:'#8B6B4A',size:16},
                       runner:{hp:35,speed:150,gold:8,color:'#DC4A4A',size:13},
                       tank:{hp:120,speed:50,gold:10,color:'#3A5A5A',size:18},
                       healer:{hp:60,speed:55,gold:15,color:'#4AC84A',size:16,heal:10,healRange:90},
                       boss:{hp:550,speed:90,gold:35,color:'#8A1A1A',size:20},
                       flyer:{hp:55,speed:175,gold:20,color:'#b080d0',size:13,airborne:true} };
        const st = {...base[type]};
        const w = game.wave;
        if(type==='normal'){ st.hp += w*1.5; st.gold += Math.floor(w/3); }
        else if(type==='runner'){ st.hp += w*1.2; st.gold += Math.floor(w/3); }
        else if(type==='tank'){ st.hp += w*5; st.gold += Math.floor(w/2); }
        else if(type==='healer'){ st.hp += w*1.3; st.gold += Math.floor(w/2); st.heal += Math.floor(w/5); }
        else if(type==='boss'){ st.hp += w*20; st.gold += w*2; }
        else if(type==='flyer'){ st.hp += w*1.4; st.gold += Math.floor(w/2); }
        this.type=type; this.pathIndex=pathIdx;
        const p = pathIdx===0 ? path1 : path2;
        this.x=p[0].x; this.y=p[0].y;
        this.hp=st.hp; this.maxHp=st.hp; this.baseSpeed=st.speed; this.speed=st.speed;
        this.index=0; this.dead=false; this.reachedEnd=false; this.gold=st.gold;
        this.color=st.color; this.size=st.size; this.healAmount=st.heal||0; this.healRange=st.healRange||0;
        this.airborne=st.airborne||false; this.slowEffects=[]; this.animation=0; this.rotation=0;
        this.path=p; this._dots=[];
      }
      update(dt) {
        if(this.dead) return;
        this.animation += dt;
        if(this.type==='healer') this.healNearby();
        let mult=1;
        for(let i=this.slowEffects.length-1;i>=0;i--){ const s=this.slowEffects[i]; s.time-=dt; if(s.time<=0) this.slowEffects.splice(i,1); else mult*=(1-s.mult); }
        this.speed = this.baseSpeed * mult;
        const next = this.path[this.index+1];
        if(!next){ this.reachedEnd=true; this.dead=true; game.health = Math.max(0, game.health - (this.type==='boss'?5:1)); spawnParticles(this.x,this.y,'#ff9e88',12); return; }
        const dx=next.x-this.x, dy=next.y-this.y, dist=Math.hypot(dx,dy);
        this.rotation=Math.atan2(dy,dx);
        if(dist<4){ this.index++; return; }
        this.x += (dx/dist)*this.speed*dt; this.y += (dy/dist)*this.speed*dt;
        if(this.hp<=0){ this.dead=true; spawnParticles(this.x,this.y,'#ffef9e',14); game.money += this.gold; game.totalMoneyEarned += this.gold; game.enemiesDefeated++; }
        // dots
        for(let i=this._dots.length-1;i>=0;i--){ const d=this._dots[i]; d.tickTimer-=dt; d.time-=dt; if(d.tickTimer<=0){ this.hp-=d.amt; d.tickTimer=d.tickInterval; spawnParticles(this.x,this.y-8,'#ff8f66',2); } if(d.time<=0) this._dots.splice(i,1); }
      }
      healNearby(){
        for(const e of game.enemies){
          if(e===this || e.dead) continue;
          if(Math.hypot(e.x-this.x, e.y-this.y) < this.healRange){ e.hp = Math.min(e.maxHp, e.hp + this.healAmount*0.05); if(Math.random()<0.2) spawnParticles(e.x,e.y-6,'#a6f7c5',1); }
        }
      }
      progressScore(){ const n=this.path[this.index+1]||this.path[this.path.length-1]; return this.index*10000 - Math.hypot(n.x-this.x, n.y-this.y); }
      draw(){
        ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rotation);
        ctx.fillStyle=this.color;
        if(this.type==='runner'){ ctx.beginPath(); ctx.moveTo(this.size,0); ctx.lineTo(-this.size,-this.size/1.5); ctx.lineTo(-this.size,this.size/1.5); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ff4500'; ctx.fillRect(-this.size/2,-2,this.size/2,4); }
        else if(this.type==='tank'){ ctx.fillRect(-this.size,-this.size/1.5,this.size*2,this.size); ctx.fillStyle='#1c1c1c'; ctx.fillRect(-this.size/3,-this.size*1.5,this.size*2/3,this.size); }
        else if(this.type==='healer'){ ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillRect(-this.size/4,-this.size,this.size/2,this.size*2); ctx.fillRect(-this.size,-this.size/4,this.size*2,this.size/2); }
        else if(this.type==='boss'){ ctx.beginPath(); ctx.arc(0,0,this.size+8,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(-this.size/2,-this.size/2,this.size/4,0,Math.PI*2); ctx.arc(this.size/2,-this.size/2,this.size/4,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#8a1a1a'; ctx.beginPath(); ctx.moveTo(-this.size,-this.size); ctx.lineTo(-this.size*1.5,-this.size*2); ctx.lineTo(-this.size/2,-this.size); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(this.size,-this.size); ctx.lineTo(this.size*1.5,-this.size*2); ctx.lineTo(this.size/2,-this.size); ctx.closePath(); ctx.fill(); }
        else if(this.type==='flyer'){ const wy=Math.sin(this.animation*8)*3; ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#dda0dd'; ctx.fillRect(-this.size*1.5,wy,this.size*3,4); }
        else { ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#a0522d'; ctx.beginPath(); ctx.arc(0,0,this.size/2,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
        const bw=36, bh=6, by=this.y-this.size-12;
        ctx.fillStyle='#000'; ctx.fillRect(this.x-bw/2-1, by-1, bw+2, bh+2);
        const hp = this.hp/this.maxHp;
        ctx.fillStyle = hp>0.5?'#4caf50':hp>0.25?'#ffb300':'#e53935';
        ctx.fillRect(this.x-bw/2, by, bw*hp, bh);
        if(this.type==='boss'){ ctx.fillStyle='#fff'; ctx.font='bold 12px Inter'; ctx.textAlign='center'; ctx.fillText(`BOSS ${Math.ceil(this.hp)}`, this.x, by-6); }
      }
    }

    class Tower {
      constructor(x,y,type){ this.x=x; this.y=y; this.type=type; this.level=0; this.totalSpent=TOWER_STATS[type][0].cost; this.applyStats(); this.cooldown=0; this.deleted=false; this.animation=0; this.lastShot=0; }
      applyStats(){ const s=TOWER_STATS[this.type][this.level]; this.range=s.range; this.dmg=s.dmg; this.firerate=s.firerate; this.slow=s.slow||0; this.aoe=s.aoe||0; this.dot=s.dot||0; this.dotDuration=s.dotDuration||0; this.chain=s.chain||0; this.chainRange=s.chainRange||0; this.cost=s.cost; this.color=s.color; }
      update(dt){
        this.animation+=dt; this.lastShot+=dt;
        if(this.cooldown>0){ this.cooldown-=dt; return; }
        let best=null, bestScore=-Infinity;
        for(const e of game.enemies){
          if(e.dead||e.reachedEnd) continue;
          const d=Math.hypot(e.x-this.x, e.y-this.y);
          if(d<=this.range){ const sc=e.progressScore(); if(sc>bestScore){ bestScore=sc; best=e; } }
        }
        if(!best) return;
        if(this.cooldown<=0){ game.projectiles.push(new Projectile(this,best)); this.cooldown=1/this.firerate; this.lastShot=0; }
      }
      draw(){
        ctx.save(); ctx.translate(this.x,this.y);
        ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#4a3a2a'; ctx.fillRect(-14,4,28,6);
        ctx.fillStyle=this.color;
        const off=Math.sin(this.animation*3)*2;
        if(this.type==='basic'){ ctx.fillRect(-12,-24,24,28); ctx.fillStyle='#7a6a4a'; ctx.fillRect(-8,-32,16,8); ctx.fillStyle='#2f4f4f'; ctx.fillRect(0,-20,20+off,8); }
        else if(this.type==='sniper'){ ctx.fillRect(-8,-36,16,32); ctx.fillStyle='#36454f'; ctx.fillRect(-4,-42,8,6); ctx.fillStyle='#1c1c1c'; ctx.beginPath(); ctx.arc(0,-28,6,0,Math.PI*2); ctx.fill(); }
        else if(this.type==='frost'){ ctx.beginPath(); ctx.moveTo(0,-28); for(let i=0;i<6;i++){ const a=i*Math.PI*2/6+this.animation*2; ctx.lineTo(Math.cos(a)*15, -20+Math.sin(a)*8); } ctx.closePath(); ctx.fill(); ctx.fillStyle='#e0f8ff'; ctx.beginPath(); ctx.moveTo(0,-32); ctx.lineTo(6,-24); ctx.lineTo(-6,-24); ctx.closePath(); ctx.fill(); }
        else if(this.type==='bomb'){ ctx.beginPath(); ctx.arc(0,-20,16,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#6a3a1a'; ctx.fillRect(0,-36,4,16); if(this.lastShot<0.1){ ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(2,-38+off*2,3,0,Math.PI*2); ctx.fill(); } }
        else if(this.type==='flame'){ ctx.fillRect(-14,-24,28,20); ctx.fillStyle='#6a3a1a'; ctx.fillRect(-6,-32,12,8); ctx.fillStyle='#ff8c00'; ctx.beginPath(); ctx.ellipse(0,-28,10,6,0,0,Math.PI*2); ctx.fill(); }
        else if(this.type==='tesla'){ ctx.fillRect(-10,-30,20,26); ctx.fillStyle='#4a0082'; ctx.fillRect(-6,-36,12,6); ctx.strokeStyle='#b080d0'; ctx.lineWidth=3; ctx.beginPath(); for(let i=-2;i<=2;i++){ ctx.moveTo(-8,-20+i*6); ctx.lineTo(8,-20+i*6); } ctx.stroke(); }
        ctx.restore();
        if(game.selectedTower===this){ ctx.beginPath(); ctx.strokeStyle='#ffd96666'; ctx.lineWidth=3; ctx.arc(this.x,this.y,this.range,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.strokeStyle='#ffd96633'; ctx.lineWidth=1; ctx.arc(this.x,this.y,this.range,0,Math.PI*2); ctx.stroke(); }
        ctx.fillStyle='#ffd966'; ctx.font='bold 11px Inter'; ctx.textAlign='center'; ctx.fillText(`L${this.level+1}`, this.x, this.y+32);
      }
    }

    class Projectile {
      constructor(tower,target){
        this.x=tower.x; this.y=tower.y; this.target=target; this.tower=tower;
        this.dmg=tower.dmg; this.slow=tower.slow; this.aoe=tower.aoe; this.dot=tower.dot; this.dotDuration=tower.dotDuration;
        this.chain=tower.chain; this.chainRange=tower.chainRange; this.speed=480; this.dead=false;
        this.color=this.aoe?'#ffd700':this.slow?'#87ceeb':this.dot?'#ff6a3a':this.chain?'#b080d0':'#fff';
        this.size=this.aoe?8:this.chain?6:5; this.trail=[];
      }
      update(dt){
        this.trail.push({x:this.x,y:this.y}); if(this.trail.length>5) this.trail.shift();
        if(this.target.dead||this.target.reachedEnd){ this.dead=true; return; }
        const dx=this.target.x-this.x, dy=this.target.y-this.y, dist=Math.hypot(dx,dy);
        if(dist<10){ this.hit(); this.dead=true; return; }
        this.x += (dx/dist)*this.speed*dt; this.y += (dy/dist)*this.speed*dt;
      }
      hit(){
        if(this.aoe>0){
          for(const e of game.enemies){
            if(e.dead||e.reachedEnd) continue;
            if(Math.hypot(e.x-this.x, e.y-this.y)<this.aoe){ e.hp-=this.dmg; if(this.dot) applyDot(e,this.dot,this.dotDuration); }
          }
          spawnParticles(this.x,this.y,'#ffd700',20);
        } else if(this.chain>0){
          let current=this.target, left=this.chain, chained=new Set([current]);
          while(left>0 && current){
            if(current && !current.dead&&!current.reachedEnd){ current.hp-=this.dmg; if(left===this.chain) drawLightningFromTower(this.tower,current); }
            let next=null, close=Infinity;
            for(const e of game.enemies){
              if(!chained.has(e)&&!e.dead&&!e.reachedEnd){
                const d=current?Math.hypot(e.x-current.x,e.y-current.y):Infinity;
                if(d<this.chainRange && d<close){ close=d; next=e; }
              }
            }
            if(next){ if(current && next) drawLightning(current,next); chained.add(next); current=next; left--; } else break;
          }
          spawnParticles(this.x,this.y,'#b080d0',8);
        } else {
          if(this.target && !this.target.dead&&!this.target.reachedEnd){
            this.target.hp-=this.dmg;
            if(this.slow>0) this.target.slowEffects.push({mult:this.slow, time:1.5});
            if(this.dot) applyDot(this.target,this.dot,this.dotDuration);
            spawnParticles(this.target.x,this.target.y,this.color,6);
          }
        }
        // damage numbers
        showDamageNumber(this.x, this.y-16, this.dmg);
      }
      draw(){
        for(let i=0;i<this.trail.length;i++){ const p=this.trail[i]; ctx.fillStyle=`rgba(255,255,255,${i/this.trail.length*0.4})`; ctx.beginPath(); ctx.arc(p.x,p.y,this.size*(i/this.trail.length),0,Math.PI*2); ctx.fill(); }
        ctx.fillStyle=this.color; ctx.shadowColor=this.color; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      }
    }

    // helpers
    function applyDot(enemy, amt, dur){ enemy._dots.push({amt, time:dur, tickInterval:0.3, tickTimer:0}); }
    function drawLightningFromTower(tower, target){ if(!tower||!target) return; const pts=[{x:tower.x,y:tower.y}]; for(let i=1;i<6;i++){ const t=i/6; pts.push({x:tower.x+(target.x-tower.x)*t+(Math.random()-0.5)*8, y:tower.y+(target.y-tower.y)*t+(Math.random()-0.5)*8}); } pts.push({x:target.x,y:target.y}); ctx.strokeStyle='#b080d0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); }
    function drawLightning(a,b){ const pts=[{x:a.x,y:a.y}]; for(let i=1;i<6;i++){ const t=i/6; pts.push({x:a.x+(b.x-a.x)*t+(Math.random()-0.5)*10, y:a.y+(b.y-a.y)*t+(Math.random()-0.5)*10}); } pts.push({x:b.x,y:b.y}); ctx.strokeStyle='#b080d0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); }

    // damage numbers
    const damageNumbers=[];
    function showDamageNumber(x,y,amount,color=null){ damageNumbers.push({x,y,value:amount,life:1.2,velocity:{x:(Math.random()-0.5)*40,y:-50},color:color||(amount>40?'#ff4444':amount>20?'#ffaa44':'#ffffff')}); }
    function updateDamageNumbers(dt){ for(let i=damageNumbers.length-1;i>=0;i--){ const n=damageNumbers[i]; n.x+=n.velocity.x*dt; n.y+=n.velocity.y*dt; n.life-=dt; n.velocity.y+=80*dt; if(n.life<=0) damageNumbers.splice(i,1); } }
    function drawDamageNumbers(){ for(const n of damageNumbers){ ctx.save(); ctx.globalAlpha=n.life; ctx.fillStyle=n.color; ctx.font=`bold ${16+(1-n.life)*6}px Inter`; ctx.textAlign='center'; ctx.fillText(`-${Math.round(n.value)}`, n.x, n.y); ctx.restore(); } }

    function spawnParticles(x,y,color,count=8){ for(let i=0;i<count;i++){ const a=Math.random()*Math.PI*2, sp=2+Math.random()*6; game.particles.push({x,y,dx:Math.cos(a)*sp,dy:Math.sin(a)*sp,life:0.3+Math.random()*0.7,color,size:3+Math.random()*4,rotation:Math.random()*Math.PI*2,rotationSpeed:(Math.random()-0.5)*10}); } }
    function updateParticles(dt){ for(const p of game.particles){ p.x+=p.dx; p.y+=p.dy; p.life-=dt; p.rotation+=p.rotationSpeed*dt; p.dy+=98*dt; } game.particles=game.particles.filter(p=>p.life>0); }
    function drawParticles(){ for(const p of game.particles){ ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.translate(p.x,p.y); ctx.rotate(p.rotation); ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore(); } ctx.globalAlpha=1; }

    // ============================================================
    //  MAP & UI
    // ============================================================
    function getCurrentMapStyle(){ return game.mapStyles[game.currentMap] || game.mapStyles.forest; }
    function drawTiles(){
      const style=getCurrentMapStyle();
      ctx.fillStyle=style.bgColor; ctx.fillRect(0,0,canvas.width,canvas.height);
      for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
        const tile=tileMap[y][x], xp=x*TILE, yp=y*TILE;
        if(tile.type==='grass'){ const v=tile.grassVariant||0; ctx.fillStyle=style.grassPatterns[v%2][(x+y)%3]; } else ctx.fillStyle=style.pathPatterns[(x+y)%4];
        ctx.fillRect(xp,yp,TILE,TILE);
        if(tile.type==='grass'){ ctx.fillStyle='rgba(255,255,255,0.04)'; for(let i=0;i<3;i++){ const tx=xp+Math.sin(x+y+i)*8+Math.random()*4, ty=yp+Math.cos(x+y+i)*8+Math.random()*4; ctx.fillRect(tx,ty,3,3); } }
        else { ctx.fillStyle='rgba(0,0,0,0.08)'; for(let sy=0;sy<TILE;sy+=8) for(let sx=0;sx<TILE;sx+=8) if((x+y+Math.floor(sx/8)+Math.floor(sy/8))%2===0) ctx.fillRect(xp+sx+1,yp+sy+1,6,6); }
        ctx.strokeStyle=style.tileBorder; ctx.lineWidth=0.5; ctx.strokeRect(xp,yp,TILE,TILE);
      }
      ctx.strokeStyle=style.pathOutline; ctx.lineWidth=1.5;
      [pathTiles1,pathTiles2].forEach(path=>{ path.forEach(t=>{ const xp=t.x*TILE, yp=t.y*TILE; ctx.strokeRect(xp,yp,TILE,TILE); }); });
    }

    // ============================================================
    //  GAME LOGIC
    // ============================================================
    function startWave(){
      if(game.waveInProgress||game.gameOver||game.victory) return;
      let base=8+Math.floor(game.wave*0.8);
      game.toSpawn=Math.min(base,40); game.spawnTimer=0; game.waveInProgress=true;
    }
    function spawnEnemy(){
      let type='normal'; const r=Math.random(), w=game.wave;
      if(w>=15 && r<0.05) type='boss';
      else if(w>=12 && r<0.15) type='flyer';
      else if(w>=8 && r<0.30) type='healer';
      else if(w>=4 && r<0.50) type='tank';
      else if(r<0.70) type='runner';
      const pathIdx=Math.random()<0.5?0:1;
      game.enemies.push(new Enemy(type,pathIdx));
    }

    function togglePause(){ if(game.gameOver||game.victory) return; game.paused=!game.paused; document.getElementById('pauseBtn').textContent=game.paused?'▶ Resume':'Pause'; }

    function showHomeScreen(){
      document.getElementById('homeScreen').style.display='flex';
      document.getElementById('mapSelection').style.display='none';
      document.getElementById('gameContainer').style.display='none';
      document.getElementById('ui').style.display='none';
      restartGame();
    }
    function showMapSelection(){
      document.getElementById('homeScreen').style.display='none';
      document.getElementById('mapSelection').style.display='flex';
      document.getElementById('gameContainer').style.display='none';
      document.getElementById('ui').style.display='none';
    }
    function selectMap(name, ev){
      game.currentMap=name;
      document.querySelectorAll('.map-option').forEach(o=>o.classList.remove('active'));
      if(ev?.currentTarget) ev.currentTarget.classList.add('active');
      document.getElementById('currentMapName').textContent=name.charAt(0).toUpperCase()+name.slice(1);
    }
    function startGameWithMap(){
      document.getElementById('homeScreen').style.display='none';
      document.getElementById('mapSelection').style.display='none';
      document.getElementById('gameContainer').style.display='inline-block';
      document.getElementById('ui').style.display='block';
      const name=game.currentMap;
      document.getElementById('currentMapName').textContent=name.charAt(0).toUpperCase()+name.slice(1);
      initTileMap();
      restartGame();
    }
    function showInstructions(){ alert("Tower Defense\n\n 1. Click a tower → click grass to build\n 2. P to pause, ESC to cancel\n 3. Start waves manually or auto\n 4. Earn money, upgrade via selection\n 5. 50 waves of increasing difficulty"); }

    function restartGame(){
      game.wave=1; game.money=100; game.health=20; game.enemies=[]; game.towers=[]; game.projectiles=[]; game.particles=[]; game.placing=null; game.selectedTower=null; game.toSpawn=0; game.waveInProgress=false; game.paused=false; game.gameOver=false; game.victory=false; game.enemiesDefeated=0; game.totalMoneyEarned=0;
      initTileMap();
      damageNumbers.length=0;
      document.getElementById('gameOver').style.display='none';
      document.getElementById('victoryScreen').style.display='none';
      updateTowerButtons();
      document.getElementById('pauseBtn').textContent='Pause';
    }

    function selectTower(type){ game.placing=type; game.selectedTower=null; updateTowerButtons(); }
    function updateTowerButtons(){
      document.querySelectorAll('.towerButton').forEach(b=>b.classList.remove('tower-button-active'));
      if(game.placing){ const b=document.getElementById(`towerBtn-${game.placing}`); if(b) b.classList.add('tower-button-active'); }
    }

    // canvas interactions
    canvas.addEventListener('click', e=>{
      if(game.gameOver||game.victory) return;
      const rect=canvas.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top;
      if(game.placing){ placeTower(x,y); return; }
      // select existing
      for(const t of game.towers){ if(Math.hypot(x-t.x,y-t.y)<24){ game.selectedTower=t; game.placing=null; updateTowerButtons(); return; } }
      game.selectedTower=null;
    });
    canvas.addEventListener('mousemove', e=>{
      const rect=canvas.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top;
      game.placingPos={x,y};
      const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
      const sel=game.selectedTower?` | Selected: ${game.selectedTower.type} L${game.selectedTower.level+1}`:'';
      document.getElementById('tileInfo').textContent=` (${tx},${ty})${sel}`;
    });

    function placeTower(x,y){
      const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
      if(ty>=ROWS||tx>=COLS||ty<0||tx<0){ spawnParticles(x,y,'#ff6666',8); return; }
      const tile=tileMap[ty]?.[tx];
      if(!tile || tile.type!=='grass' || !tile.walkable){ spawnParticles(x,y,'#ff6666',8); return; }
      const baseCost=TOWER_STATS[game.placing][0].cost;
      if(game.money<baseCost){ game.placing=null; updateTowerButtons(); spawnParticles(x,y,'#ff6666',4); return; }
      const px=tx*TILE+TILE/2, py=ty*TILE+TILE/2;
      const t=new Tower(px,py,game.placing);
      game.towers.push(t); game.money-=baseCost; t.totalSpent=baseCost; game.placing=null; updateTowerButtons();
      tile.walkable=false; tile.type='tower';
      spawnParticles(px,py,'#7ae9d6',14);
    }

    let lastTime=performance.now();
    function loop(now){
      const dt=Math.min((now-lastTime)/1000, 0.033); lastTime=now;
      if(!game.paused && !game.gameOver && !game.victory){
        // spawn
        if(game.toSpawn>0){ game.spawnTimer-=dt; if(game.spawnTimer<=0){ game.spawnTimer=game.spawnInterval; spawnEnemy(); game.toSpawn--; } }
        // update
        for(const e of game.enemies) e.update(dt);
        game.enemies=game.enemies.filter(e=>!e.dead&&!e.reachedEnd);
        for(const t of game.towers) t.update(dt);
        game.towers=game.towers.filter(t=>!t.deleted);
        for(const p of game.projectiles) p.update(dt);
        game.projectiles=game.projectiles.filter(p=>!p.dead);
        updateParticles(dt); updateDamageNumbers(dt);
        // wave complete
        if(game.waveInProgress && game.enemies.length===0 && game.toSpawn===0){
          game.waveInProgress=false;
          const bonus=30+game.wave*5;
          game.money+=bonus; game.totalMoneyEarned+=bonus; game.wave++;
          showDamageNumber(canvas.width/2, canvas.height/2-40, `+$${bonus}`, '#7ae9d6');
          if(game.autoNext && game.wave<=game.totalWaves) setTimeout(()=>startWave(), 1200);
        }
        // health / gameover
        if(game.health<=0 && !game.gameOver){ game.gameOver=true; document.getElementById('finalScore').textContent=`Wave ${game.wave}`; document.getElementById('finalEnemies').textContent=game.enemiesDefeated; document.getElementById('finalMoney').textContent=game.totalMoneyEarned; document.getElementById('gameOver').style.display='block'; }
        if(game.wave>game.totalWaves && !game.victory){ game.victory=true; const score=game.wave*100+game.enemiesDefeated+game.totalMoneyEarned; document.getElementById('finalScoreVictory').textContent=score; document.getElementById('victoryScreen').style.display='block'; }
      }
      // draw
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawTiles();
      for(const t of game.towers) t.draw();
      for(const p of game.projectiles) p.draw();
      for(const e of game.enemies) e.draw();
      drawParticles(); drawDamageNumbers();

      // placement preview
      if(game.placing){
        const pos=game.placingPos, tx=Math.floor(pos.x/TILE), ty=Math.floor(pos.y/TILE);
        const valid=ty<ROWS&&tx<COLS&&tileMap[ty]?.[tx]?.type==='grass'&&tileMap[ty][tx].walkable;
        ctx.globalAlpha=0.6;
        ctx.fillStyle=valid?'rgba(100,255,140,0.35)':'rgba(255,80,80,0.35)';
        ctx.beginPath(); ctx.arc(tx*TILE+TILE/2, ty*TILE+TILE/2, 18, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.strokeStyle=valid?'rgba(100,255,140,0.25)':'rgba(255,80,80,0.25)'; ctx.lineWidth=2;
        ctx.arc(tx*TILE+TILE/2, ty*TILE+TILE/2, TOWER_STATS[game.placing][0].range, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha=1;
      }

      // UI
      document.getElementById('waveDisp').textContent=game.wave;
      document.getElementById('enemyDisp').textContent=`${game.enemies.length} +${game.toSpawn}`;
      document.getElementById('moneyDisp').textContent=`$${game.money}`;
      document.getElementById('healthDisp').textContent=game.health;

      requestAnimationFrame(loop);
    }

    // keyboard shortcuts
    document.addEventListener('keydown', e=>{
      if(e.key==='p'||e.key==='P') togglePause();
      if(e.key==='Escape'){ game.placing=null; game.selectedTower=null; updateTowerButtons(); }
      const map={1:'basic',2:'sniper',3:'frost',4:'bomb',5:'flame',6:'tesla'};
      if(e.key>='1'&&e.key<='6'){ const t=map[e.key]; if(t) selectTower(t); }
    });
    document.getElementById('autoNext').addEventListener('change', e=>game.autoNext=e.target.checked);

    // start
    selectMap('forest', {currentTarget:document.querySelector('.map-option')});
    loop(performance.now());
  </script>
</body>
</html>
