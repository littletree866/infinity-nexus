<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Pixel Tower Defense</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1a2a;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8f0f0;
    }
    .menu-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1f2f;
      z-index: 5000;
      padding: 20px;
    }
    .menu-screen.hidden { display: none; }
    .menu-title {
      font-size: 4.2rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #f7d44a;
      text-shadow: 0 6px 0 #7a5a1a, 0 12px 20px #00000088;
      margin-bottom: 24px;
    }
    .menu-sub {
      font-size: 1.2rem;
      color: #9ab0c0;
      margin-bottom: 30px;
    }
    .menu-btn {
      background: #2d4a5a;
      border: 4px solid #4a6a7a;
      padding: 16px 48px;
      margin: 10px;
      border-radius: 0;
      font-size: 1.6rem;
      font-weight: 700;
      color: #f0f8fa;
      cursor: pointer;
      box-shadow: 0 6px 0 #1a2a3a;
      transition: 0.08s linear;
      text-transform: uppercase;
      letter-spacing: 2px;
      min-width: 220px;
    }
    .menu-btn:hover { background: #3a5a6a; transform: translateY(-2px); box-shadow: 0 8px 0 #1a2a3a; }
    .menu-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 #1a2a3a; }
    .menu-btn.green { background: #3a7a5a; border-color: #5a9a7a; box-shadow: 0 6px 0 #1a4a3a; }
    .menu-btn.green:hover { background: #4a8a6a; }
    .menu-btn.orange { background: #b07a3a; border-color: #d09a5a; box-shadow: 0 6px 0 #6a4a1a; }
    .menu-btn.orange:hover { background: #c08a4a; }

    .diff-row {
      display: flex;
      gap: 16px;
      margin: 18px 0 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .diff-btn {
      background: #1f3340;
      border: 3px solid #3a5a6a;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #b0c8d0;
      cursor: pointer;
      transition: 0.08s;
      box-shadow: 0 4px 0 #0f1f2a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .diff-btn.active { background: #4a7a6a; border-color: #7ac0a0; color: #fff; box-shadow: 0 4px 0 #1a4a3a; }
    .diff-btn:hover { background: #2a4a5a; }

    .map-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 12px 0 28px;
    }
    .map-card {
      width: 140px;
      height: 110px;
      border: 4px solid #2a4a5a;
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a2f3f;
      box-shadow: 0 6px 0 #0f1f2a;
    }
    .map-card.active { border-color: #f7d44a; box-shadow: 0 0 0 2px #f7d44a, 0 6px 0 #0f1f2a; }
    .map-card:hover { transform: scale(1.02); }
    .map-preview {
      width: 100%;
      height: 70px;
      background-size: cover;
      background-position: center;
    }
    .map-label { font-weight: 600; font-size: 0.9rem; margin-top: 4px; color: #c0d8e0; }

    #gameContainer {
      display: none;
      position: relative;
      margin: 8px;
      border: 6px solid #2a3a4a;
      box-shadow: 0 20px 40px #000000aa;
    }
    #gameCanvas {
      display: block;
      width: 1200px;
      height: 700px;
      background: #1a2f3a;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      cursor: crosshair;
    }
    #ui {
      display: none;
      width: 360px;
      background: #14232f;
      padding: 18px 16px;
      border-left: 6px solid #2a4a5a;
      height: 700px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #3a5a6a #14232f;
    }
    #ui::-webkit-scrollbar { width: 6px; }
    #ui::-webkit-scrollbar-track { background: #14232f; }
    #ui::-webkit-scrollbar-thumb { background: #3a5a6a; border-radius: 0; }
    .ui-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f7d44a;
      text-align: center;
      border-bottom: 4px solid #2a4a5a;
      padding-bottom: 8px;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    .panel {
      background: #1a2f3f;
      padding: 14px 12px;
      margin-bottom: 16px;
      border: 3px solid #2a4a5a;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat .label { font-size: 0.7rem; color: #8aa8b8; text-transform: uppercase; letter-spacing: 1px; }
    .stat .value {
      background: #0b1a2a;
      padding: 6px 10px;
      font-size: 1.4rem;
      font-weight: 700;
      border: 2px solid #2a4a5a;
      color: #f7d44a;
    }
    #healthDisp { color: #ff7a7a; }
    #moneyDisp { color: #7ae0c0; }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0 6px;
    }
    .action-btn {
      background: #2a4a5a;
      border: none;
      padding: 12px 8px;
      font-weight: 700;
      font-size: 0.9rem;
      color: #e8f0f0;
      cursor: pointer;
      border-bottom: 4px solid #0f2a3a;
      transition: 0.06s linear;
      text-transform: uppercase;
    }
    .action-btn:hover { background: #3a5a6a; }
    .action-btn:active { transform: translateY(4px); border-bottom-width: 1px; }
    .action-btn.green { background: #3a7a5a; border-bottom-color: #1a4a3a; }
    .action-btn.orange { background: #b07a3a; border-bottom-color: #6a4a1a; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .tower-btn {
      width: 100%;
      padding: 10px 12px;
      background: #1a2f3f;
      border: 3px solid #2a4a5a;
      margin: 5px 0;
      font-weight: 600;
      color: #d0e0e8;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.06s;
      font-size: 0.9rem;
    }
    .tower-btn.active { border-color: #f7d44a; background: #2a4a5a; }
    .tower-btn:hover { background: #2a4a5a; }
    .tower-cost { background: #0b1a2a; padding: 2px 12px; color: #f7d44a; font-weight: 700; }

    .back-btn {
      background: #6a3a3a;
      border: none;
      padding: 14px;
      font-weight: 700;
      color: #f0e8e8;
      width: 100%;
      margin-top: 12px;
      border-bottom: 4px solid #3a1a1a;
      cursor: pointer;
      text-transform: uppercase;
    }
    .back-btn:hover { background: #7a4a4a; }
    .back-btn:active { transform: translateY(4px); border-bottom-width: 1px; }

    #tileInfo {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: #0b1a2acc;
      padding: 6px 16px;
      border: 2px solid #f7d44a66;
      font-size: 0.9rem;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }
    #instructions {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #0b1a2acc;
      padding: 8px 14px;
      border: 2px solid #f7d44a44;
      font-size: 0.75rem;
      max-width: 200px;
      backdrop-filter: blur(2px);
    }
    .overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #0b1a2af0;
      padding: 30px 40px;
      border: 6px solid #f7d44a;
      text-align: center;
      display: none;
      z-index: 2000;
      min-width: 300px;
      backdrop-filter: blur(6px);
    }
    .overlay h2 { font-size: 2.4rem; color: #f7d44a; margin-bottom: 12px; }
    .overlay .restart-btn {
      background: #3a7a5a;
      border: none;
      padding: 14px 32px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      margin-top: 20px;
      cursor: pointer;
      border-bottom: 4px solid #1a4a3a;
    }
    .overlay .restart-btn:hover { background: #4a8a6a; }
  </style>
</head>
<body>
  <!-- MAIN MENU -->
  <div id="mainMenu" class="menu-screen">
    <div class="menu-title">⚡ PIXEL TD</div>
    <div class="menu-sub">⬛ 6 towers · 2 lanes · 65 waves</div>
    <button class="menu-btn green" onclick="showMapSelection()">▶ PLAY</button>
    <button class="menu-btn" onclick="alert('Build towers, stop enemies! P to pause.')">📖 INSTRUCTIONS</button>
    <div style="margin-top:18px; color:#6a8a9a; font-size:0.9rem;">choose difficulty before map</div>
  </div>

  <!-- MAP SELECTION -->
  <div id="mapScreen" class="menu-screen hidden">
    <div class="menu-title" style="font-size:2.8rem;">🗺️ SELECT MAP</div>
    <div class="diff-row">
      <button class="diff-btn" data-diff="easy" onclick="setDifficulty('easy',this)">🍃 Easy</button>
      <button class="diff-btn active" data-diff="normal" onclick="setDifficulty('normal',this)">⚔️ Normal</button>
      <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard',this)">🔥 Hard</button>
      <button class="diff-btn" data-diff="nightmare" onclick="setDifficulty('nightmare',this)">💀 Nightmare</button>
    </div>
    <div class="map-grid">
      <div class="map-card active" data-map="forest" onclick="pickMap('forest',this)">
        <div class="map-preview" style="background: linear-gradient(145deg, #1a4a2a, #2a6a3a, #3a8a4a);"></div>
        <div class="map-label">🌲 Forest</div>
      </div>
      <div class="map-card" data-map="desert" onclick="pickMap('desert',this)">
        <div class="map-preview" style="background: linear-gradient(145deg, #b08a4a, #d0aa6a, #e0c08a);"></div>
        <div class="map-label">🏜️ Desert</div>
      </div>
      <div class="map-card" data-map="arctic" onclick="pickMap('arctic',this)">
        <div class="map-preview" style="background: linear-gradient(145deg, #5a8a9a, #7ab0c0, #a0d0e0);"></div>
        <div class="map-label">❄️ Arctic</div>
      </div>
      <div class="map-card" data-map="volcano" onclick="pickMap('volcano',this)">
        <div class="map-preview" style="background: linear-gradient(145deg, #6a1a1a, #9a2a2a, #cc3a3a);"></div>
        <div class="map-label">🌋 Volcano</div>
      </div>
    </div>
    <button class="menu-btn green" onclick="startGame()">⚡ START GAME</button>
    <button class="menu-btn" style="font-size:1rem; padding:12px 32px; min-width:160px;" onclick="backToMain()">← BACK</button>
  </div>

  <!-- GAME -->
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1200" height="700"></canvas>
    <div id="tileInfo">📍 (0,0) | none</div>
    <div id="instructions">⌨️ 1-6 towers · P pause · ESC cancel</div>
    <div id="gameOver" class="overlay"><h2>💀 DEFEAT</h2><p id="finalScore">Wave 0</p><p>Enemies: <span id="finalEnemies">0</span></p><p>💰 <span id="finalMoney">0</span></p><button class="restart-btn" onclick="backToMain()">🏠 MENU</button></div>
    <div id="victoryScreen" class="overlay"><h2>🏆 VICTORY</h2><p>Score: <span id="finalScoreVictory">0</span></p><button class="restart-btn" onclick="backToMain()">🏠 MENU</button></div>
  </div>
  <div id="ui">
    <div class="ui-title">⚡ <span id="currentMapName">Forest</span></div>
    <div class="panel">
      <div class="stats-grid">
        <div class="stat"><span class="label">🌊 Wave</span><span class="value" id="waveDisp">1</span></div>
        <div class="stat"><span class="label">👾 Enemies</span><span class="value" id="enemyDisp">0</span></div>
        <div class="stat"><span class="label">❤️ Health</span><span class="value" id="healthDisp">20</span></div>
        <div class="stat"><span class="label">💰 Money</span><span class="value" id="moneyDisp">$100</span></div>
      </div>
      <div class="btn-row">
        <button class="action-btn green" id="startWaveBtn" onclick="startWave()">⚡ Start Wave</button>
        <button class="action-btn orange" id="pauseBtn" onclick="togglePause()">⏸️ Pause</button>
      </div>
      <label style="display:flex; align-items:center; gap:10px; margin-top:8px; font-size:0.9rem; color:#8aa8b8;">
        <input id="autoNext" type="checkbox"> Auto-start
      </label>
    </div>
    <div class="panel">
      <div style="font-weight:700; color:#b0c8d0; margin-bottom:6px;">🏗️ TOWERS</div>
      <button class="tower-btn" data-tower="basic" onclick="pickTower('basic')">🔰 Basic <span class="tower-cost">$30</span></button>
      <button class="tower-btn" data-tower="sniper" onclick="pickTower('sniper')">🎯 Sniper <span class="tower-cost">$70</span></button>
      <button class="tower-btn" data-tower="frost" onclick="pickTower('frost')">❄️ Frost <span class="tower-cost">$90</span></button>
      <button class="tower-btn" data-tower="bomb" onclick="pickTower('bomb')">💥 Bomb <span class="tower-cost">$155</span></button>
      <button class="tower-btn" data-tower="flame" onclick="pickTower('flame')">🔥 Flame <span class="tower-cost">$180</span></button>
      <button class="tower-btn" data-tower="electric" onclick="pickTower('electric')">⚡ Electric <span class="tower-cost">$250</span></button>
    </div>
    <button class="back-btn" onclick="backToMain()">🚪 QUIT</button>
  </div>

  <script>
    // ============================================================
    //  CONFIG, DIFFICULTY, MAP
    // ============================================================
    const DIFFICULTY = {
      easy:   { label:'Easy',   enemyScale:0.7, moneyMult:1.3, towerCostMult:0.8, health:25, startMoney:140, spawnInterval:1.2 },
      normal: { label:'Normal', enemyScale:1.0, moneyMult:1.0, towerCostMult:1.0, health:20, startMoney:100, spawnInterval:1.0 },
      hard:   { label:'Hard',   enemyScale:1.4, moneyMult:0.8, towerCostMult:1.2, health:15, startMoney:80, spawnInterval:0.8 },
      nightmare:{label:'Nightmare', enemyScale:2.0, moneyMult:0.6, towerCostMult:1.5, health:12, startMoney:60, spawnInterval:0.6 }
    };
    let currentDifficulty = 'normal';
    let currentMap = 'forest';
    let game = {};

    function setDifficulty(diff, btn) {
      currentDifficulty = diff;
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function pickMap(map, el) {
      currentMap = map;
      document.querySelectorAll('.map-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }
    function showMapSelection() {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('mapScreen').classList.remove('hidden');
    }
    function backToMain() {
      document.getElementById('mainMenu').classList.remove('hidden');
      document.getElementById('mapScreen').classList.add('hidden');
      document.getElementById('gameContainer').style.display = 'none';
      document.getElementById('ui').style.display = 'none';
      if (game.restart) game.restart();
    }
    function startGame() {
      document.getElementById('mapScreen').classList.add('hidden');
      document.getElementById('gameContainer').style.display = 'inline-block';
      document.getElementById('ui').style.display = 'block';
      const nameEl = document.getElementById('currentMapName');
      if (nameEl) nameEl.textContent = currentMap.charAt(0).toUpperCase() + currentMap.slice(1);
      initGame();
    }

    // ============================================================
    //  CANVAS SETUP
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const TILE = 40;
    const COLS = 30, ROWS = 17;

    const pathTiles1 = [{x:0,y:2},{x:1,y:2},{x:2,y:2},{x:3,y:2},{x:4,y:2},{x:5,y:2},{x:6,y:2},{x:7,y:2},{x:8,y:2},{x:9,y:2},{x:9,y:3},{x:10,y:3},{x:11,y:3},{x:12,y:3},{x:13,y:3},{x:14,y:3},{x:15,y:3},{x:16,y:3},{x:17,y:3},{x:17,y:4},{x:17,y:5},{x:17,y:6},{x:17,y:7},{x:18,y:7},{x:19,y:7},{x:20,y:7},{x:21,y:7},{x:22,y:7},{x:23,y:7},{x:24,y:7},{x:25,y:7},{x:26,y:7},{x:27,y:7},{x:27,y:6},{x:27,y:5},{x:27,y:4},{x:27,y:3},{x:28,y:3},{x:29,y:3},{x:30,y:3}];
    const pathTiles2 = [{x:0,y:11},{x:1,y:11},{x:2,y:11},{x:3,y:11},{x:4,y:11},{x:5,y:11},{x:6,y:11},{x:7,y:11},{x:8,y:11},{x:9,y:11},{x:9,y:10},{x:10,y:10},{x:11,y:10},{x:12,y:10},{x:13,y:10},{x:14,y:10},{x:15,y:10},{x:16,y:10},{x:17,y:10},{x:17,y:9},{x:17,y:8},{x:17,y:7},{x:18,y:7},{x:19,y:7},{x:20,y:7},{x:21,y:7},{x:22,y:7},{x:23,y:7},{x:24,y:7},{x:25,y:7},{x:26,y:7},{x:27,y:7},{x:27,y:8},{x:27,y:9},{x:27,y:10},{x:28,y:10},{x:29,y:10},{x:30,y:10}];
    const path1 = pathTiles1.map(t => ({x:t.x*TILE+TILE/2, y:t.y*TILE+TILE/2}));
    const path2 = pathTiles2.map(t => ({x:t.x*TILE+TILE/2, y:t.y*TILE+TILE/2}));

    let tileMap = [];

    function buildTileMap() {
      tileMap = Array.from({length:ROWS}, (_,y) => Array.from({length:COLS}, (_,x) => ({type:'grass', walkable:true, variant:(x+y)%4})));
      [...pathTiles1, ...pathTiles2].forEach(t => { if(tileMap[t.y]?.[t.x]) tileMap[t.y][t.x] = {type:'path', walkable:false}; });
    }
    buildTileMap();

    const MAP_STYLES = {
      forest: { grass: [['#2a6a3a','#3a7a4a','#4a8a5a'],['#1a5a2a','#2a6a3a','#3a7a4a']], path:['#6a5a4a','#7a6a5a','#8a7a6a','#9a8a7a'], bg:'#1a3a2a' },
      desert: { grass: [['#c9a86a','#ddc08a','#f0dbb0'],['#b8985a','#c9a86a','#ddc08a']], path:['#b8a080','#c8b090','#d8c0a0','#e8d0b0'], bg:'#eddcb7' },
      arctic: { grass: [['#7ab0c0','#9ac8d8','#bae0f0'],['#6a9aaa','#7ab0c0','#9ac8d8']], path:['#b0c8d8','#c0d8e8','#d0e8f0','#e0f0f8'], bg:'#d6f3fb' },
      volcano:{ grass: [['#6a1a1a','#8a2a2a','#aa3a3a'],['#4a0a0a','#6a1a1a','#8a2a2a']], path:['#6a4a3a','#7a5a4a','#8a6a5a','#9a7a6a'], bg:'#3a1a1a' }
    };

    // ============================================================
    //  TOWER & ENEMY STATS
    // ============================================================
    const BASE_TOWER_STATS = {
      basic:   { range:130, dmg:15, firerate:1.3, cost:30, color:'#b0c4de' },
      sniper:  { range:300, dmg:55, firerate:0.55, cost:70, color:'#8a9aaa' },
      frost:   { range:150, dmg:15, firerate:1.2, slow:0.45, cost:90, color:'#b0e8f0' },
      bomb:    { range:125, dmg:30, firerate:1.2, aoe:70, cost:155, color:'#ffd966' },
      flame:   { range:135, dmg:18, firerate:1.3, dot:5, dotDuration:3.0, cost:180, color:'#ff6a3a' },
      electric:{ range:150, dmg:18, firerate:1.8, chain:4, chainRange:80, cost:250, color:'#b080d0' }
    };

    function getTowerStats(type) {
      const base = BASE_TOWER_STATS[type];
      const diff = DIFFICULTY[currentDifficulty];
      const cost = Math.round(base.cost * diff.towerCostMult);
      return { ...base, cost };
    }

    function getEnemyBase(type) {
      const b = {
        normal:{hp:55,speed:90,gold:10,color:'#8B6B4A',size:16},
        runner:{hp:50,speed:155,gold:10,color:'#DC4A4A',size:16},
        tank:{hp:160,speed:65,gold:15,color:'#3A5A5A',size:18},
        healer:{hp:80,speed:70,gold:10,color:'#4AC84A',size:16,heal:15,healRange:100},
        boss:{hp:750,speed:110,gold:30,color:'#8A1A1A',size:20},
        flyer:{hp:80,speed:190,gold:17,color:'#b080d0',size:14,airborne:true}
      };
      return b[type];
    }

    function getEnemyStats(type, wave) {
      const base = getEnemyBase(type);
      const diff = DIFFICULTY[currentDifficulty];
      const scale = diff.enemyScale;
      let hp = base.hp * scale;
      let gold = base.gold;
      if(type==='normal'){ hp += wave*1.5*scale; gold += Math.floor(wave/3); }
      else if(type==='runner'){ hp += wave*1.2*scale; gold += Math.floor(wave/3); }
      else if(type==='tank'){ hp += wave*5*scale; gold += Math.floor(wave/2); }
      else if(type==='healer'){ hp += wave*1.8*scale; gold += Math.floor(wave/2); }
      else if(type==='boss'){ hp += wave*30*scale; gold += Math.floor(wave*2); }
      else if(type==='flyer'){ hp += wave*2.2*scale; gold += Math.floor(wave/2); }
      return { ...base, hp:Math.floor(hp), gold:Math.floor(gold) };
    }

    // ============================================================
    //  GAME STATE
    // ============================================================
    let enemies=[], towers=[], projectiles=[], particles=[], damageNums=[];
    let wave=1, money=100, health=20, enemiesDefeated=0, totalMoney=0;
    let waveInProgress=false, toSpawn=0, spawnTimer=0, paused=false, autoNext=false, gameOver=false, victory=false;
    let placing=null, selectedTower=null, mouseX=0, mouseY=0;
    let spawnInterval = 1.0;

    function initGame() {
      const diff = DIFFICULTY[currentDifficulty];
      wave=1; money=diff.startMoney; health=diff.health; enemiesDefeated=0; totalMoney=0;
      enemies=[]; towers=[]; projectiles=[]; particles=[]; damageNums=[];
      waveInProgress=false; toSpawn=0; paused=false; gameOver=false; victory=false; placing=null; selectedTower=null;
      spawnInterval = diff.spawnInterval || 1.0;
      buildTileMap();
      const go = document.getElementById('gameOver');
      const vs = document.getElementById('victoryScreen');
      if (go) go.style.display='none';
      if (vs) vs.style.display='none';
      const pb = document.getElementById('pauseBtn');
      if (pb) pb.textContent='⏸️ Pause';
      const swb = document.getElementById('startWaveBtn');
      if (swb) swb.disabled = false;
      updateUI();
    }
    function restartGame(){ initGame(); }

    // ============================================================
    //  DRAWING
    // ============================================================
    function drawTiles() {
      const style = MAP_STYLES[currentMap] || MAP_STYLES.forest;
      ctx.fillStyle = style.bg; ctx.fillRect(0,0,canvas.width,canvas.height);
      for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
        const t=tileMap[y][x], xp=x*TILE, yp=y*TILE;
        if(t.type==='grass'){ const v=t.variant%2; ctx.fillStyle=style.grass[v][(x+y)%3]; }
        else ctx.fillStyle=style.path[(x+y)%4];
        ctx.fillRect(xp,yp,TILE,TILE);
        ctx.fillStyle='rgba(0,0,0,0.06)';
        for(let i=0;i<2;i++){ ctx.fillRect(xp+6+i*12, yp+6+i*12, 4,4); }
        ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=0.5; ctx.strokeRect(xp,yp,TILE,TILE);
      }
      ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1.5;
      [...pathTiles1,...pathTiles2].forEach(t=>{ ctx.strokeRect(t.x*TILE,t.y*TILE,TILE,TILE); });
    }

    function drawPixelEnemy(e) {
      ctx.save(); ctx.translate(e.x,e.y);
      const s=e.size;
      ctx.fillStyle=e.color;
      ctx.fillRect(-s,-s, s*2, s*2);
      ctx.fillStyle='#fff';
      ctx.fillRect(-s+4,-s+4,4,4); ctx.fillRect(s-8,-s+4,4,4);
      ctx.fillStyle='#000';
      ctx.fillRect(-s+5,-s+5,2,2); ctx.fillRect(s-7,-s+5,2,2);
      if(e.type==='boss'){ ctx.fillStyle='#ffd700'; ctx.fillRect(-s,-s-4,s*2,4); }
      if(e.type==='flyer'){ ctx.fillStyle='#dda0dd'; ctx.fillRect(-s-4,-s+2,4,8); ctx.fillRect(s,-s+2,4,8); }
      if(e.type==='healer'){ ctx.fillStyle='#fff'; ctx.fillRect(-2,-s-4,4,8); }
      ctx.restore();
      const bw=32, bh=4, by=e.y-s-10;
      ctx.fillStyle='#000'; ctx.fillRect(e.x-bw/2-1,by-1,bw+2,bh+2);
      const hp=e.hp/e.maxHp;
      ctx.fillStyle=hp>0.5?'#4caf50':hp>0.25?'#ffb300':'#e53935';
      ctx.fillRect(e.x-bw/2,by,bw*hp,bh);
    }

    function drawPixelTower(t) {
      ctx.save(); ctx.translate(t.x,t.y);
      const s=16;
      ctx.fillStyle='#3a2a1a'; ctx.fillRect(-s,-s,s*2,s*2);
      ctx.fillStyle=t.color;
      if(t.type==='basic'){ ctx.fillRect(-10,-12,20,14); ctx.fillStyle='#7a6a4a'; ctx.fillRect(-6,-16,12,6); }
      else if(t.type==='sniper'){ ctx.fillRect(-8,-16,16,14); ctx.fillStyle='#6e7f8d'; ctx.fillRect(-4,-20,8,6); ctx.fillStyle='#2e3a40'; ctx.fillRect(-3,-14,6,4); }
      else if(t.type==='frost'){ ctx.fillStyle='#bfefff'; ctx.fillRect(-8,-14,16,12); ctx.fillStyle='#e6ffff'; ctx.fillRect(-4,-18,8,6); }
      else if(t.type==='bomb'){ ctx.beginPath(); ctx.arc(0,-4,12,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#6a3a1a'; ctx.fillRect(-2,-20,4,12); }
      else if(t.type==='flame'){ ctx.fillRect(-10,-12,20,14); ctx.fillStyle='#ff8c00'; ctx.fillRect(-6,-16,12,8); }
      else if(t.type==='electric'){ ctx.fillRect(-8,-14,16,14); ctx.fillStyle='#4a0082'; ctx.fillRect(-4,-18,8,6); ctx.strokeStyle='#b080d0'; ctx.lineWidth=2; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(-6,-8+i*6); ctx.lineTo(6,-8+i*6); ctx.stroke(); } }
      ctx.restore();
      if(selectedTower===t){ ctx.beginPath(); ctx.strokeStyle='#f7d44a44'; ctx.lineWidth=2; ctx.arc(t.x,t.y,t.range,0,Math.PI*2); ctx.stroke(); }
      ctx.fillStyle='#f7d44a'; ctx.font='bold 10px Inter'; ctx.textAlign='center'; ctx.fillText(`L${t.level+1}`, t.x, t.y+s+14);
    }

    function drawProjectile(p) {
      ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
      ctx.fillRect(p.x-3,p.y-3,6,6);
      ctx.shadowBlur=0;
    }

    // ============================================================
    //  GAME LOGIC
    // ============================================================
    function startWave() {
      if(waveInProgress || gameOver || victory) return;
      let baseCount = 6 + Math.floor(wave * 0.7);
      toSpawn = Math.min(baseCount, 35);
      spawnTimer = 0;
      waveInProgress = true;
      const swb = document.getElementById('startWaveBtn');
      if (swb) swb.disabled = true;
    }

    function spawnEnemy() {
      let type='normal'; 
      const r=Math.random(), w=wave;
      if(w>=20 && r<0.20) type='boss';
      else if(w>=15 && r<0.35) type='flyer';
      else if(w>=12 && r<0.50) type='healer';
      else if(w>=8 && r<0.60) type='tank';
      else if(w>=5 && r<0.75) type='runner';
      
      const pathIdx=Math.random()<0.5?0:1;
      const stats=getEnemyStats(type, wave);
      const e = {
        ...stats, 
        pathIndex:pathIdx, 
        path: pathIdx===0?path1:path2,
        index:0, 
        dead:false, 
        reachedEnd:false, 
        slowEffects:[], 
        _dots:[],
        animation:0, 
        rotation:0, 
        maxHp:stats.hp,
        x: (pathIdx===0?path1:path2)[0].x,
        y: (pathIdx===0?path1:path2)[0].y,
        progressScore(){ 
          const n=this.path[this.index+1]||this.path[this.path.length-1]; 
          return this.index*10000 - Math.hypot(n.x-this.x, n.y-this.y); 
        }
      };
      enemies.push(e);
    }

    function updateEnemy(e, dt) {
      if(e.dead) return;
      e.animation+=dt;
      if(e.type==='healer'){ 
        for(const o of enemies){ 
          if(o===e||o.dead) continue; 
          if(Math.hypot(o.x-e.x,o.y-e.y)<e.healRange){ 
            o.hp=Math.min(o.maxHp,o.hp+e.healAmount*0.05); 
          } 
        } 
      }
      let mult=1;
      for(let i=e.slowEffects.length-1;i>=0;i--){ 
        const s=e.slowEffects[i]; 
        s.time-=dt; 
        if(s.time<=0) e.slowEffects.splice(i,1); 
        else mult*=(1-s.mult); 
      }
      e.speed=e.baseSpeed*mult;
      const next=e.path[e.index+1];
      if(!next){ 
        e.reachedEnd=true; 
        e.dead=true; 
        health=Math.max(0,health-(e.type==='boss'?5:1)); 
        spawnParticles(e.x,e.y,'#ff9e88',8); 
        return; 
      }
      const dx=next.x-e.x, dy=next.y-e.y, dist=Math.hypot(dx,dy);
      e.rotation=Math.atan2(dy,dx);
      if(dist<4){ e.index++; return; }
      e.x += (dx/dist)*e.speed*dt; 
      e.y += (dy/dist)*e.speed*dt;
      for(let i=e._dots.length-1;i>=0;i--){ 
        const d=e._dots[i]; 
        d.tickTimer-=dt; 
        d.time-=dt; 
        if(d.tickTimer<=0){ 
          e.hp-=d.amt; 
          d.tickTimer=d.tickInterval; 
          spawnParticles(e.x,e.y-8,'#ff8f66',2); 
        } 
        if(d.time<=0) e._dots.splice(i,1); 
      }
      if(e.hp<=0){ 
        e.dead=true; 
        spawnParticles(e.x,e.y,'#ffef9e',10); 
        money+=e.gold; 
        totalMoney+=e.gold; 
        enemiesDefeated++; 
      }
    }

    function updateTower(t, dt) {
      t.cooldown=(t.cooldown||0)-dt;
      if(t.cooldown>0) return;
      let best=null, bestScore=-Infinity;
      for(const e of enemies){ 
        if(e.dead||e.reachedEnd) continue; 
        const d=Math.hypot(e.x-t.x,e.y-t.y); 
        if(d<=t.range){ 
          const sc=e.progressScore(); 
          if(sc>bestScore){ bestScore=sc; best=e; } 
        } 
      }
      if(!best) return;
      projectiles.push({ 
        x:t.x,y:t.y, target:best, tower:t, 
        dmg:t.dmg, slow:t.slow, aoe:t.aoe, dot:t.dot, 
        dotDuration:t.dotDuration, chain:t.chain, chainRange:t.chainRange, 
        speed:480, dead:false, 
        color:t.aoe?'#ffd700':t.slow?'#87ceeb':t.dot?'#ff6a3a':t.chain?'#b080d0':'#fff', 
        size:t.aoe?8:t.chain?6:5, trail:[] 
      });
      t.cooldown=1/t.firerate;
    }

    function updateProjectile(p, dt) {
      p.trail.push({x:p.x,y:p.y}); 
      if(p.trail.length>5) p.trail.shift();
      if(p.target.dead||p.target.reachedEnd){ p.dead=true; return; }
      const dx=p.target.x-p.x, dy=p.target.y-p.y, dist=Math.hypot(dx,dy);
      if(dist<10){ hitProjectile(p); p.dead=true; return; }
      p.x += (dx/dist)*p.speed*dt; 
      p.y += (dy/dist)*p.speed*dt;
    }

    function hitProjectile(p) {
      if(p.aoe>0){
        for(const e of enemies){ 
          if(e.dead||e.reachedEnd) continue; 
          if(Math.hypot(e.x-p.x,e.y-p.y)<p.aoe){ 
            e.hp-=p.dmg; 
            if(p.dot) applyDot(e,p.dot,p.dotDuration); 
          } 
        }
        spawnParticles(p.x,p.y,'#ffd700',16);
      } else if(p.chain>0){
        let current=p.target, left=p.chain, chained=new Set([current]);
        while(left>0 && current){
          if(current && !current.dead&&!current.reachedEnd){ current.hp-=p.dmg; }
          let next=null, close=Infinity;
          for(const e of enemies){ 
            if(!chained.has(e)&&!e.dead&&!e.reachedEnd){ 
              const d=current?Math.hypot(e.x-current.x,e.y-current.y):Infinity; 
              if(d<p.chainRange&&d<close){ close=d; next=e; } 
            } 
          }
          if(next){ chained.add(next); current=next; left--; } 
          else break;
        }
        spawnParticles(p.x,p.y,'#b080d0',8);
      } else {
        if(p.target && !p.target.dead&&!p.target.reachedEnd){ 
          p.target.hp-=p.dmg; 
          if(p.slow>0) p.target.slowEffects.push({mult:p.slow,time:1.5}); 
          if(p.dot) applyDot(p.target,p.dot,p.dotDuration); 
          spawnParticles(p.target.x,p.target.y,p.color,6); 
        }
      }
      damageNums.push({
        x:p.x,y:p.y-16,value:p.dmg,life:1.0,
        vel:{x:(Math.random()-0.5)*40,y:-50},
        color:p.dmg>40?'#ff4444':p.dmg>20?'#ffaa44':'#fff'
      });
    }

    function applyDot(e, amt, dur){ e._dots.push({amt, time:dur, tickInterval:0.3, tickTimer:0}); }

    function spawnParticles(x,y,color,count=8){ 
      for(let i=0;i<count;i++){ 
        const a=Math.random()*Math.PI*2, sp=1+Math.random()*5; 
        particles.push({x,y,dx:Math.cos(a)*sp,dy:Math.sin(a)*sp,life:0.3+Math.random()*0.6,color,size:2+Math.random()*4}); 
      } 
    }

    // ============================================================
    //  MAIN LOOP
    // ============================================================
    let lastTime=performance.now();

    function gameLoop(now){
      const dt=Math.min((now-lastTime)/1000,0.033); 
      lastTime=now;
      
      if(!paused && !gameOver && !victory){
        // Spawn enemies
        if(toSpawn>0){ 
          spawnTimer-=dt; 
          if(spawnTimer<=0){ 
            spawnTimer=spawnInterval; 
            spawnEnemy(); 
            toSpawn--; 
          } 
        }
        
        // Update enemies
        for(const e of enemies) updateEnemy(e, dt);
        enemies=enemies.filter(e=>!e.dead&&!e.reachedEnd);
        
        // Update towers
        for(const t of towers){ 
          t.animation=(t.animation||0)+dt; 
          updateTower(t, dt); 
        }
        towers=towers.filter(t=>!t.deleted);
        
        // Update projectiles
        for(const p of projectiles) updateProjectile(p, dt);
        projectiles=projectiles.filter(p=>!p.dead);
        
        // Update particles
        for(const p of particles){ 
          p.x+=p.dx; 
          p.y+=p.dy; 
          p.life-=dt; 
          p.dy+=80*dt; 
        }
        particles=particles.filter(p=>p.life>0);
        
        // Update damage numbers
        for(let i=damageNums.length-1;i>=0;i--){ 
          const n=damageNums[i]; 
          n.x+=n.vel.x*dt; 
          n.y+=n.vel.y*dt; 
          n.life-=dt; 
          n.vel.y+=60*dt; 
          if(n.life<=0) damageNums.splice(i,1); 
        }
        
        // Check wave completion
        if(waveInProgress && enemies.length===0 && toSpawn===0){
          waveInProgress=false;
          const bonus=30+wave*5;
          money+=bonus; 
          totalMoney+=bonus; 
          wave++;
          const swb = document.getElementById('startWaveBtn');
          if (swb) swb.disabled = false;
          damageNums.push({
            x:canvas.width/2,y:canvas.height/2-30,
            value:`+$${bonus}`,
            life:1.8,
            vel:{x:0,y:-30},
            color:'#7ae0c0',
            isBonus:true
          });
          if(autoNext && wave<=65) setTimeout(()=>startWave(),1200);
        }
        
        // Check game over / victory
        if(health<=0 && !gameOver){ 
          gameOver=true; 
          document.getElementById('finalScore').textContent=`Wave ${wave}`; 
          document.getElementById('finalEnemies').textContent=enemiesDefeated; 
          document.getElementById('finalMoney').textContent=totalMoney; 
          document.getElementById('gameOver').style.display='block'; 
        }
        if(wave>65 && !victory){ 
          victory=true; 
          const score=wave*100+enemiesDefeated+totalMoney; 
          document.getElementById('finalScoreVictory').textContent=score; 
          document.getElementById('victoryScreen').style.display='block'; 
        }
      }

      // DRAW
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawTiles();
      for(const t of towers) drawPixelTower(t);
      for(const p of projectiles) drawProjectile(p);
      for(const e of enemies) drawPixelEnemy(e);
      for(const p of particles){ 
        ctx.globalAlpha=p.life; 
        ctx.fillStyle=p.color; 
        ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); 
      } 
      ctx.globalAlpha=1;
      for(const n of damageNums){ 
        ctx.globalAlpha=n.life; 
        ctx.fillStyle=n.color||'#fff'; 
        ctx.font=`bold ${n.isBonus?20:16}px Inter`; 
        ctx.textAlign='center'; 
        ctx.fillText(n.isBonus?n.value:`-${Math.round(n.value)}`, n.x, n.y); 
      } 
      ctx.globalAlpha=1;

      // Placement preview
      if(placing){
        const tx=Math.floor(mouseX/TILE), ty=Math.floor(mouseY/TILE);
        const valid=ty<ROWS&&tx<COLS&&tileMap[ty]?.[tx]?.type==='grass'&&tileMap[ty][tx].walkable;
        ctx.globalAlpha=0.8;
        ctx.fillStyle=valid?'rgba(0,200,80,0.7)':'rgba(200,0,0,0.7)';
        ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);
        ctx.strokeStyle='#000'; 
        ctx.lineWidth=2; 
        ctx.strokeRect(tx*TILE,ty*TILE,TILE,TILE);
        ctx.globalAlpha=1;
      }

      updateUI();
      requestAnimationFrame(gameLoop);
    }

    function updateUI(){
      const wd = document.getElementById('waveDisp');
      const ed = document.getElementById('enemyDisp');
      const md = document.getElementById('moneyDisp');
      const hd = document.getElementById('healthDisp');
      if (wd) wd.textContent=wave;
      if (ed) ed.textContent=`${enemies.length} +${toSpawn}`;
      if (md) md.textContent=`$${money}`;
      if (hd) hd.textContent=health;
    }

    // ============================================================
    //  UI INTERACTIONS
    // ============================================================
    function pickTower(type){
      placing=type;
      selectedTower=null;
      document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('active'));
      const btn=document.querySelector(`.tower-btn[data-tower="${type}"]`);
      if(btn) btn.classList.add('active');
    }

    function togglePause(){ 
      if(gameOver||victory) return; 
      paused=!paused; 
      const pb=document.getElementById('pauseBtn'); 
      if(pb) pb.textContent=paused?'▶ Resume':'⏸️ Pause'; 
    }

    canvas.addEventListener('click', e=>{
      if(gameOver||victory) return;
      const rect=canvas.getBoundingClientRect();
      const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
      const x=(e.clientX-rect.left)*scaleX, y=(e.clientY-rect.top)*scaleY;
      if(placing){ placeTower(x,y); return; }
      for(const t of towers){ 
        if(Math.hypot(x-t.x,y-t.y)<20){ 
          selectedTower=t; 
          placing=null; 
          document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('active')); 
          return; 
        } 
      }
      selectedTower=null;
    });
    
    canvas.addEventListener('mousemove', e=>{
      const rect=canvas.getBoundingClientRect();
      const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
      mouseX=(e.clientX-rect.left)*scaleX; 
      mouseY=(e.clientY-rect.top)*scaleY;
      const tx=Math.floor(mouseX/TILE), ty=Math.floor(mouseY/TILE);
      const sel=selectedTower?` | ${selectedTower.type} L${selectedTower.level+1}`:'';
      const ti=document.getElementById('tileInfo');
      if(ti) ti.textContent=`📍 (${tx},${ty})${sel}`;
    });

    function placeTower(x,y){
      const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
      if(ty<0||tx<0||ty>=ROWS||tx>=COLS){ spawnParticles(x,y,'#ff6666',6); return; }
      const tile=tileMap[ty]?.[tx];
      if(!tile||tile.type!=='grass'||!tile.walkable){ spawnParticles(x,y,'#ff6666',6); return; }
      const stats=getTowerStats(placing);
      if(money<stats.cost){ 
        placing=null; 
        document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('active')); 
        return; 
      }
      const tower={ 
        x:tx*TILE+TILE/2, 
        y:ty*TILE+TILE/2, 
        type:placing, 
        level:0, 
        totalSpent:stats.cost, 
        cooldown:0, 
        deleted:false, 
        animation:0, 
        ...stats 
      };
      towers.push(tower);
      money-=stats.cost;
      tile.walkable=false; 
      tile.type='tower';
      spawnParticles(tower.x,tower.y,'#7ae0c0',12);
      placing=null;
      document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('active'));
    }

    document.addEventListener('keydown', e=>{
      if(e.key==='p'||e.key==='P') togglePause();
      if(e.key==='Escape'){ 
        placing=null; 
        selectedTower=null; 
        document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('active')); 
      }
      const map={1:'basic',2:'sniper',3:'frost',4:'bomb',5:'flame',6:'electric'};
      if(e.key>='1'&&e.key<='6'){ 
        const t=map[e.key]; 
        if(t) pickTower(t); 
      }
    });
    
    const autoEl = document.getElementById('autoNext');
    if (autoEl) autoEl.addEventListener('change', e=>autoNext=e.target.checked);

    game.restart = restartGame;

    // Start the game
    initGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
