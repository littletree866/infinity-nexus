<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Arcane Duel · Reworked</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b0d1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'MedievalSharp', cursive;
            padding: 16px;
            margin: 0;
        }
        .game-wrapper {
            max-width: 1100px;
            width: 100%;
            background: radial-gradient(ellipse at 20% 30%, #1e1f3a, #0f0f1f);
            border-radius: 48px 48px 32px 32px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px #6d5c9e inset, 0 0 20px #4a3f7a;
            border: 1px solid #a391d0;
            transition: all 0.2s;
            backdrop-filter: blur(2px);
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: space-between;
        }
        .panel {
            background: rgba(18, 16, 36, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 20px 22px;
            border: 1px solid #7d6bb0;
            box-shadow: 0 8px 12px rgba(0,0,0,0.5);
            flex: 1 1 260px;
        }
        .panel-title {
            font-size: 1.8rem;
            color: #d6c8ff;
            text-shadow: 0 0 12px #7a5dff;
            letter-spacing: 2px;
            border-bottom: 2px solid #6b58a6;
            padding-bottom: 8px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }
        .stat-label {
            display: flex;
            justify-content: space-between;
            color: #b7a9e0;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }
        .bar-bg {
            height: 18px;
            background: #20203b;
            border-radius: 40px;
            overflow: hidden;
            border: 1px solid #4a3d79;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #b388ff, #7c4dff);
            transition: width 0.2s ease;
            border-radius: 40px;
        }
        .bar-fill.hp { background: linear-gradient(90deg, #f06292, #e5396d); }
        .bar-fill.mana { background: linear-gradient(90deg, #64b5f6, #1e88e5); }
        .bar-fill.xp { background: linear-gradient(90deg, #ffb74d, #f57c00); }
        .badge {
            background: #28244a;
            padding: 4px 14px;
            border-radius: 30px;
            color: #cdbeff;
            font-size: 1rem;
            border: 1px solid #6f5dab;
        }
        .enemy-card {
            background: #251f3d;
            border-radius: 28px;
            padding: 16px 18px;
            border-left: 6px solid #e05080;
            margin-top: 10px;
        }
        .enemy-name {
            font-size: 2rem;
            color: #ffb3c6;
        }
        .battle-stage {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #14122b;
            border-radius: 60px;
            padding: 20px 12px;
            margin: 16px 0;
            border: 1px solid #65529e;
            position: relative;
            min-height: 130px;
        }
        .fighter {
            font-size: 4.4rem;
            filter: drop-shadow(0 0 20px #5f4caf);
            transition: 0.2s;
            line-height: 1;
        }
        .fighter.enemy-fighter {
            filter: drop-shadow(0 0 20px #d43f7a);
        }
        .spell-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 18px 0 12px;
        }
        .spell-btn {
            background: #2d264f;
            border: 2px solid #6a57b0;
            color: #efe6ff;
            font-family: 'MedievalSharp', cursive;
            font-size: 1.2rem;
            padding: 14px 6px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #0e0c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 1px;
        }
        .spell-btn:hover {
            background: #3c326a;
            transform: scale(0.97);
            border-color: #a78eea;
            box-shadow: 0 2px 0 #0e0c1e;
        }
        .spell-btn:active { transform: scale(0.94); }
        .spell-btn.powerful {
            background: #572f6b;
            border-color: #cc7eb6;
            grid-column: span 2;
        }
        .spell-btn:disabled {
            opacity: 0.45;
            filter: grayscale(0.6);
            pointer-events: none;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }
        .action-btn {
            background: #282350;
            border: 1px solid #7c6bb0;
            color: #f0eaff;
            font-family: 'MedievalSharp', cursive;
            padding: 12px 22px;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s;
            flex: 1 1 auto;
            box-shadow: 0 4px 0 #12101f;
        }
        .action-btn:hover {
            background: #3f3470;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #12101f;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #12101f; }
        .log-box {
            background: #0f0d20;
            border-radius: 28px;
            padding: 14px 18px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #4f4085;
            margin-top: 18px;
            color: #cfc3f0;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .log-box p {
            padding: 4px 6px;
            border-left: 4px solid #6d5bb0;
            margin-bottom: 4px;
        }
        .log-box p.enemy { border-left-color: #d45a8a; }
        .log-box p.special { border-left-color: #d4b05a; background: #1e1a35; }
        .map-section {
            background: #12102b;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid #5b4a91;
            margin-top: 20px;
        }
        .map-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            aspect-ratio: 1 / 1;
            max-height: 380px;
            margin: 8px 0;
        }
        .tile {
            background: #1b1a36;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid #3b2f64;
            box-shadow: inset 0 0 0 1px #2d254f;
        }
        .tile:hover { background: #2f2857; transform: scale(0.94); }
        .tile.player-tile { background: #2f3d7a; border-color: #7b9eff; box-shadow: 0 0 18px #3d5fcf; }
        .tile.enemy-tile { background: #5a2f4b; border-color: #d45a8a; animation: pulse-enemy 1.6s infinite; }
        .tile.treasure-tile { background: #3f5530; border-color: #b3d67c; }
        @keyframes pulse-enemy {
            0% { box-shadow: 0 0 4px #d45a8a; }
            50% { box-shadow: 0 0 22px #e06090; }
        }
        .inventory-shop {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 16px 0 6px;
        }
        .inv-box {
            background: #191735;
            border-radius: 28px;
            padding: 14px 18px;
            flex: 1 1 200px;
            border: 1px solid #5e4a96;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px solid #3b2f66;
        }
        .item-row button {
            background: #3d3470;
            border: none;
            color: white;
            border-radius: 30px;
            padding: 4px 18px;
            font-family: 'MedievalSharp', cursive;
            cursor: pointer;
        }
        .item-row button:hover { background: #5b4a96; }
        .flex-center { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .gold-badge { background: #f5b042; color: #1d142b; padding: 4px 18px; border-radius: 60px; font-weight: bold; }
        .hidden { display: none !important; }
        .mt-2 { margin-top: 14px; }
        .mb-1 { margin-bottom: 10px; }
        .text-glow { text-shadow: 0 0 18px #9f8bff; }
        @media (max-width: 700px) {
            .panel { flex: 1 1 100%; }
            .spell-grid { grid-template-columns: 1fr 1fr; }
            .spell-btn.powerful { grid-column: span 1; }
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="app">
    <!-- header -->
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
        <h1 style="color:#cfbeff; font-size:2.8rem; text-shadow:0 0 20px #7f68cf;">⚡ ARCANE DUEL</h1>
        <div><span class="badge">🧙 Lv.<span id="player-level-display">1</span></span> <span class="gold-badge">🪙 <span id="gold-display">0</span></span></div>
    </div>

    <!-- main two panels: player & enemy -->
    <div class="flex-row">
        <!-- player panel -->
        <div class="panel">
            <div class="panel-title">🧙‍♂️ <span>Mage</span></div>
            <div class="stat-block">
                <div class="stat-label"><span>❤️ Health</span> <span><span id="p-hp-text">100</span>/<span id="p-maxhp-text">100</span></span></div>
                <div class="bar-bg"><div class="bar-fill hp" id="p-hp-bar" style="width:100%"></div></div>
            </div>
            <div class="stat-block">
                <div class="stat-label"><span>💧 Mana</span> <span><span id="p-mana-text">100</span>/<span id="p-maxmana-text">100</span></span></div>
                <div class="bar-bg"><div class="bar-fill mana" id="p-mana-bar" style="width:100%"></div></div>
            </div>
            <div class="stat-block">
                <div class="stat-label"><span>⭐ XP</span> <span><span id="p-xp-text">0</span>/<span id="p-xpneed-text">100</span></span></div>
                <div class="bar-bg"><div class="bar-fill xp" id="p-xp-bar" style="width:0%"></div></div>
            </div>
            <div class="flex-center">
                <button class="action-btn" id="save-btn" style="padding:6px 20px;">💾 Save</button>
                <button class="action-btn" id="load-btn" style="padding:6px 20px;">📂 Load</button>
                <span style="margin-left:auto;">🧪 Potions: <span id="potion-count">0</span></span>
            </div>
        </div>

        <!-- enemy panel -->
        <div class="panel">
            <div class="panel-title">👹 <span id="enemy-name-display">Wandering Fiend</span></div>
            <div class="enemy-card">
                <div class="stat-block">
                    <div class="stat-label"><span>❤️ Health</span> <span><span id="e-hp-text">50</span>/<span id="e-maxhp-text">50</span></span></div>
                    <div class="bar-bg"><div class="bar-fill hp" id="e-hp-bar" style="width:100%"></div></div>
                </div>
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:6px;">
                    <span class="badge" id="enemy-status-badge">⚔️ Normal</span>
                    <span class="badge">💀 <span id="enemy-damage-display">8</span> ATK</span>
                </div>
            </div>
        </div>
    </div>

    <!-- battle stage -->
    <div class="battle-stage">
        <div class="fighter" id="player-emoji">🧙‍♂️</div>
        <div style="font-size:2.2rem; color:#6e5aa7;">⚡</div>
        <div class="fighter enemy-fighter" id="enemy-emoji">👹</div>
    </div>

    <!-- spell grid -->
    <div class="spell-grid" id="spell-grid">
        <button class="spell-btn" id="spell-fireball">🔥 Fireball</button>
        <button class="spell-btn" id="spell-frostbolt">❄️ Frostbolt</button>
        <button class="spell-btn" id="spell-lightning">⚡ Lightning</button>
        <button class="spell-btn" id="spell-heal">💚 Heal</button>
        <button class="spell-btn powerful hidden" id="spell-meteor">☄️ Meteor</button>
        <button class="spell-btn powerful hidden" id="spell-blizzard">🌨️ Blizzard</button>
    </div>

    <!-- action bar -->
    <div class="action-bar">
        <button class="action-btn" id="next-enemy-btn">⚔️ Next Enemy</button>
        <button class="action-btn" id="rest-btn">🧘 Meditate</button>
        <button class="action-btn" id="potion-btn">🧪 Health Potion</button>
        <button class="action-btn" id="return-map-btn">🗺️ World Map</button>
    </div>

    <!-- log -->
    <div class="log-box" id="log-box">
        <p class="special">✨ Welcome, Archmage. Explore the map and crush your foes.</p>
    </div>

    <!-- map section -->
    <div class="map-section" id="map-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:1.8rem; color:#bcadf0;">🗺️ Mystic Wilds</span>
            <span class="badge">📍 <span id="map-coords">5,5</span></span>
        </div>
        <div class="map-grid" id="map-grid"></div>
        <div class="inventory-shop">
            <div class="inv-box" id="inventory-box">
                <h3 style="color:#b7a5f0;">🎒 Inventory</h3>
                <div id="inventory-list"><div class="item-row">Health Potions: <span id="inv-potions">0</span></div></div>
            </div>
            <div class="inv-box" id="shop-box">
                <h3 style="color:#b7a5f0;">🏪 Magic Shop</h3>
                <div id="shop-list"></div>
            </div>
        </div>
    </div>
</div>
<script>
    // ----------------------------------------------
    //  COMPLETE REMAKE — advanced combat, new graphics, maps, mechanics
    // ----------------------------------------------
    (function() {
        "use strict";

        // ---------- STATE ----------
        const state = {
            player: {
                name: 'Mage',
                level: 1,
                hp: 100,
                maxHp: 100,
                mana: 100,
                maxMana: 100,
                xp: 0,
                xpNeeded: 100,
                gold: 0,
                potions: 2,  // health potions
                spells: {
                    fireball: { level: 1, cost: 12, damage: 22 },
                    frostbolt: { level: 1, cost: 8, damage: 16, slow: true },
                    lightning: { level: 1, cost: 14, damage: 28 },
                    heal: { level: 1, cost: 18, heal: 32 },
                    meteor: { level: 0, cost: 30, damage: 55, unlocked: false },
                    blizzard: { level: 0, cost: 28, damage: 48, slow: true, frozen: true, unlocked: false }
                }
            },
            enemy: null,
            map: {
                size: 10,
                px: 5, py: 5,
                enemies: [],   // [{x,y}]
                treasures: []  // [{x,y}]
            },
            inBattle: false,
            turnLock: false,
            enemiesDefeated: 0,
            shopItems: [
                { name: 'Health Potion', cost: 25, desc: 'Restore 50 HP', type: 'potion' },
                { name: 'Mana Potion', cost: 30, desc: 'Restore 40 MP', type: 'mana' },
                { name: 'Scroll of Fire', cost: 55, desc: 'Deal 40 fire dmg', type: 'scroll', spell: 'fireball' },
                { name: 'Scroll of Lightning', cost: 65, desc: 'Deal 55 lightning dmg', type: 'scroll', spell: 'lightning' }
            ],
            inventory: { scrolls: [] }
        };

        // enemy templates (scaling with player level)
        function generateEnemy(level) {
            const templates = [
                { name: 'Goblin Scavenger', emoji: '👺', baseHp: 45, baseAtk: 7, xp: 18, gold: 8 },
                { name: 'Skeleton Mage', emoji: '💀', baseHp: 60, baseAtk: 11, xp: 28, gold: 14 },
                { name: 'Shadow Wolf', emoji: '🐺', baseHp: 80, baseAtk: 15, xp: 42, gold: 22 },
                { name: 'Fire Elemental', emoji: '🔥', baseHp: 110, baseAtk: 20, xp: 65, gold: 35 },
                { name: 'Elder Lich', emoji: '🧛', baseHp: 150, baseAtk: 26, xp: 100, gold: 55 },
                { name: 'Dragon Whelp', emoji: '🐲', baseHp: 210, baseAtk: 34, xp: 150, gold: 80 }
            ];
            const idx = Math.min(level - 1, templates.length - 1);
            const t = templates[idx];
            const hpScale = 1 + (level - 1) * 0.12;
            const atkScale = 1 + (level - 1) * 0.10;
            return {
                name: t.name,
                emoji: t.emoji,
                maxHp: Math.floor(t.baseHp * hpScale),
                hp: Math.floor(t.baseHp * hpScale),
                atk: Math.floor(t.baseAtk * atkScale),
                xp: Math.floor(t.xp * (1 + (level-1)*0.08)),
                gold: Math.floor(t.gold * (1 + (level-1)*0.09)),
                slow: false,
                frozen: false
            };
        }

        // DOM refs
        const $ = id => document.getElementById(id);
        const pLevel = $('player-level-display');
        const pGold = $('gold-display');
        const pHpText = $('p-hp-text'), pMaxHp = $('p-maxhp-text'), pHpBar = $('p-hp-bar');
        const pManaText = $('p-mana-text'), pMaxMana = $('p-maxmana-text'), pManaBar = $('p-mana-bar');
        const pXpText = $('p-xp-text'), pXpNeed = $('p-xpneed-text'), pXpBar = $('p-xp-bar');
        const potionCount = $('potion-count');
        const eName = $('enemy-name-display'), eHpText = $('e-hp-text'), eMaxHp = $('e-maxhp-text'), eHpBar = $('e-hp-bar');
        const eStatus = $('enemy-status-badge'), eAtk = $('enemy-damage-display');
        const playerEmoji = $('player-emoji'), enemyEmoji = $('enemy-emoji');
        const logBox = $('log-box');
        const mapGrid = $('map-grid');
        const mapCoords = $('map-coords');
        const invList = $('inventory-list');
        const shopList = $('shop-list');
        const spellBtns = {
            fireball: $('spell-fireball'),
            frostbolt: $('spell-frostbolt'),
            lightning: $('spell-lightning'),
            heal: $('spell-heal'),
            meteor: $('spell-meteor'),
            blizzard: $('spell-blizzard')
        };
        const nextEnemyBtn = $('next-enemy-btn');
        const restBtn = $('rest-btn');
        const potionBtn = $('potion-btn');
        const returnMapBtn = $('return-map-btn');

        // ---------- UI UPDATE ----------
        function updateUI() {
            const p = state.player;
            pLevel.textContent = p.level;
            pGold.textContent = p.gold;
            pHpText.textContent = Math.floor(p.hp);
            pMaxHp.textContent = p.maxHp;
            pHpBar.style.width = (p.hp / p.maxHp * 100) + '%';
            pManaText.textContent = Math.floor(p.mana);
            pMaxMana.textContent = p.maxMana;
            pManaBar.style.width = (p.mana / p.maxMana * 100) + '%';
            pXpText.textContent = p.xp;
            pXpNeed.textContent = p.xpNeeded;
            pXpBar.style.width = (p.xp / p.xpNeeded * 100) + '%';
            potionCount.textContent = p.potions;

            // enemy
            if (state.enemy) {
                const e = state.enemy;
                eName.textContent = e.name;
                eHpText.textContent = Math.floor(e.hp);
                eMaxHp.textContent = e.maxHp;
                eHpBar.style.width = (e.hp / e.maxHp * 100) + '%';
                eAtk.textContent = e.atk;
                let status = '⚔️ Normal';
                if (e.frozen) status = '❄️ Frozen';
                else if (e.slow) status = '🐌 Slowed';
                eStatus.textContent = status;
                enemyEmoji.textContent = e.emoji;
            } else {
                eName.textContent = '---';
                eHpText.textContent = '0';
                eMaxHp.textContent = '0';
                eHpBar.style.width = '0%';
                eStatus.textContent = '💀 Defeated';
                enemyEmoji.textContent = '💀';
            }
            playerEmoji.textContent = p.hp <= 0 ? '💀' : '🧙‍♂️';

            // spell buttons mana costs
            for (const [key, btn] of Object.entries(spellBtns)) {
                if (!btn) continue;
                const sp = p.spells[key];
                if (!sp) continue;
                const label = key.charAt(0).toUpperCase() + key.slice(1);
                const cost = sp.cost || 0;
                const isUnlocked = key === 'meteor' ? p.spells.meteor.unlocked : key === 'blizzard' ? p.spells.blizzard.unlocked : true;
                if (!isUnlocked) { btn.classList.add('hidden'); continue; }
                btn.classList.remove('hidden');
                btn.innerHTML = `${emojiMap[key]} ${label} <span style="font-size:0.8rem;opacity:0.8;">(${cost} MP)</span>`;
                btn.disabled = (p.mana < cost || state.inBattle === false || state.enemy === null || state.enemy.hp <= 0 || p.hp <= 0);
            }
            // potion btn
            potionBtn.disabled = (p.potions <= 0 || p.hp >= p.maxHp || state.inBattle === false);
            // next enemy
            nextEnemyBtn.disabled = (state.inBattle === true && state.enemy && state.enemy.hp > 0);
            restBtn.disabled = (state.inBattle === false || p.hp <= 0);
            // map coords
            mapCoords.textContent = `${state.map.px},${state.map.py}`;
            // inventory
            updateInventoryUI();
            updateShopUI();
        }

        const emojiMap = { fireball: '🔥', frostbolt: '❄️', lightning: '⚡', heal: '💚', meteor: '☄️', blizzard: '🌨️' };

        function addLog(msg, cls = '') {
            const p = document.createElement('p');
            p.textContent = msg;
            if (cls) p.classList.add(cls);
            logBox.appendChild(p);
            if (logBox.children.length > 12) logBox.removeChild(logBox.children[0]);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // ---------- MAP ----------
        function generateMap() {
            const size = state.map.size;
            state.map.enemies = [];
            state.map.treasures = [];
            // place enemies (3-6)
            const enemyCount = 4 + Math.floor(Math.random() * 4);
            for (let i = 0; i < enemyCount; i++) {
                let x, y, ok;
                let attempts = 0;
                do {
                    x = Math.floor(Math.random() * size);
                    y = Math.floor(Math.random() * size);
                    ok = !(x === state.map.px && y === state.map.py) &&
                         !state.map.enemies.some(e => e.x === x && e.y === y) &&
                         !state.map.treasures.some(t => t.x === x && t.y === y);
                    attempts++;
                } while (!ok && attempts < 40);
                if (ok) state.map.enemies.push({x, y});
            }
            // treasures (1-3)
            const treasureCount = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < treasureCount; i++) {
                let x, y, ok;
                let attempts = 0;
                do {
                    x = Math.floor(Math.random() * size);
                    y = Math.floor(Math.random() * size);
                    ok = !(x === state.map.px && y === state.map.py) &&
                         !state.map.enemies.some(e => e.x === x && e.y === y) &&
                         !state.map.treasures.some(t => t.x === x && t.y === y);
                    attempts++;
                } while (!ok && attempts < 40);
                if (ok) state.map.treasures.push({x, y});
            }
            renderMap();
        }

        function renderMap() {
            const size = state.map.size;
            mapGrid.innerHTML = '';
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    const isPlayer = (x === state.map.px && y === state.map.py);
                    const isEnemy = state.map.enemies.some(e => e.x === x && e.y === y);
                    const isTreasure = state.map.treasures.some(t => t.x === x && t.y === y);
                    if (isPlayer) tile.classList.add('player-tile');
                    if (isEnemy) tile.classList.add('enemy-tile');
                    if (isTreasure) tile.classList.add('treasure-tile');
                    if (isPlayer) tile.textContent = '🧙';
                    else if (isEnemy) tile.textContent = '👹';
                    else if (isTreasure) tile.textContent = '💎';
                    tile.dataset.x = x; tile.dataset.y = y;
                    tile.addEventListener('click', () => onTileClick(x, y));
                    mapGrid.appendChild(tile);
                }
            }
        }

        function onTileClick(x, y) {
            if (state.inBattle) { addLog('⚔️ You are in battle! Finish it first.', 'enemy'); return; }
            const dx = Math.abs(x - state.map.px), dy = Math.abs(y - state.map.py);
            if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                // valid move
                state.map.px = x; state.map.py = y;
                // check enemy
                const enemyIdx = state.map.enemies.findIndex(e => e.x === x && e.y === y);
                if (enemyIdx !== -1) {
                    state.map.enemies.splice(enemyIdx, 1);
                    startBattle();
                    renderMap();
                    updateUI();
                    return;
                }
                // check treasure
                const tresIdx = state.map.treasures.findIndex(t => t.x === x && t.y === y);
                if (tresIdx !== -1) {
                    state.map.treasures.splice(tresIdx, 1);
                    const goldFound = 12 + Math.floor(Math.random() * 45);
                    state.player.gold += goldFound;
                    addLog(`💎 Found treasure! +${goldFound} gold.`, 'special');
                }
                renderMap();
                updateUI();
            } else {
                addLog('🚫 You can only move one step (up/down/left/right).', 'enemy');
            }
        }

        // ---------- BATTLE ----------
        function startBattle() {
            if (state.inBattle) return;
            state.inBattle = true;
            state.enemy = generateEnemy(state.player.level);
            state.enemy.slow = false;
            state.enemy.frozen = false;
            addLog(`⚔️ A wild ${state.enemy.name} appears!`, 'enemy');
            updateUI();
        }

        function endBattle() {
            state.inBattle = false;
            state.enemy = null;
            addLog('🏁 Battle ended. Explore the map.', 'special');
            updateUI();
            renderMap();
        }

        function playerCast(spellKey) {
            if (!state.inBattle || !state.enemy || state.enemy.hp <= 0 || state.player.hp <= 0) return;
            if (state.turnLock) return;
            const sp = state.player.spells[spellKey];
            if (!sp) return;
            if (state.player.mana < sp.cost) { addLog('❌ Not enough mana!', 'enemy'); return; }
            if (spellKey === 'meteor' && !sp.unlocked) return;
            if (spellKey === 'blizzard' && !sp.unlocked) return;

            state.turnLock = true;
            state.player.mana -= sp.cost;
            let damage = sp.damage || 0;
            let healAmt = sp.heal || 0;
            let msg = '';

            // effects
            if (spellKey === 'heal') {
                const actual = Math.min(healAmt, state.player.maxHp - state.player.hp);
                state.player.hp += actual;
                msg = `💚 Healed ${actual} HP.`;
                addLog(msg, 'special');
                updateUI();
                state.turnLock = false;
                enemyTurn();
                return;
            }

            // damage spells
            if (damage > 0) {
                // bonuses from level
                const lvBonus = 1 + (sp.level - 1) * 0.18;
                let finalDamage = Math.floor(damage * lvBonus);
                // enemy resist / weakness? just for flavor
                if (state.enemy.frozen) finalDamage = Math.floor(finalDamage * 1.2);
                state.enemy.hp = Math.max(0, state.enemy.hp - finalDamage);
                msg = `💥 ${spellKey} deals ${finalDamage} damage!`;
                if (sp.slow) { state.enemy.slow = true; msg += ' 🐌 Slowed!'; }
                if (sp.frozen) { state.enemy.frozen = true; msg += ' ❄️ Frozen!'; }
                addLog(msg, 'special');
                // visual feedback
                enemyEmoji.style.transform = 'scale(1.2)';
                setTimeout(() => enemyEmoji.style.transform = '', 200);
            }

            updateUI();

            if (state.enemy.hp <= 0) {
                defeatEnemy();
                state.turnLock = false;
                return;
            }
            state.turnLock = false;
            enemyTurn();
        }

        function enemyTurn() {
            if (!state.inBattle || !state.enemy || state.enemy.hp <= 0 || state.player.hp <= 0) {
                state.turnLock = false;
                return;
            }
            state.turnLock = true;
            let atk = state.enemy.atk;
            if (state.enemy.slow) { atk = Math.floor(atk * 0.7); state.enemy.slow = false; }
            if (state.enemy.frozen) { atk = Math.floor(atk * 0.5); state.enemy.frozen = false; }
            state.player.hp = Math.max(0, state.player.hp - atk);
            addLog(`👹 ${state.enemy.name} attacks for ${atk} damage.`, 'enemy');
            updateUI();
            if (state.player.hp <= 0) {
                addLog('💀 You have been defeated! Meditate to recover.', 'enemy');
                state.turnLock = false;
                return;
            }
            state.turnLock = false;
            updateUI();
        }

        function defeatEnemy() {
            const e = state.enemy;
            const xpGain = e.xp || 20;
            const goldGain = e.gold || 10;
            state.player.xp += xpGain;
            state.player.gold += goldGain;
            state.enemiesDefeated++;
            addLog(`🏆 ${e.name} defeated! +${xpGain} XP, +${goldGain} gold.`, 'special');
            // level up?
            while (state.player.xp >= state.player.xpNeeded) {
                state.player.xp -= state.player.xpNeeded;
                state.player.level++;
                state.player.xpNeeded = Math.floor(state.player.xpNeeded * 1.5);
                state.player.maxHp += 18;
                state.player.hp = state.player.maxHp;
                state.player.maxMana += 14;
                state.player.mana = state.player.maxMana;
                // upgrade random spell
                upgradeRandomSpell();
                addLog(`🎉 Level up! Now level ${state.player.level}.`, 'special');
                // unlock meteor & blizzard at lvl 5
                if (state.player.level >= 5) {
                    state.player.spells.meteor.unlocked = true;
                    state.player.spells.blizzard.unlocked = true;
                }
            }
            // extra potion drop
            if (Math.random() < 0.35) {
                state.player.potions++;
                addLog('🧪 You found a health potion!', 'special');
            }
            updateUI();
            state.enemy = null;
            state.inBattle = false;
            renderMap();
            updateUI();
            // if map has no enemies, generate new ones
            if (state.map.enemies.length === 0) {
                addLog('🗺️ The land is clear! New enemies appear...', 'special');
                generateMap();
            }
            state.turnLock = false;
        }

        function upgradeRandomSpell() {
            const available = Object.keys(state.player.spells).filter(k => {
                const s = state.player.spells[k];
                return s.level < 3 && (k !== 'meteor' ? true : s.unlocked) && (k !== 'blizzard' ? true : s.unlocked);
            });
            if (available.length === 0) return;
            const key = available[Math.floor(Math.random() * available.length)];
            const sp = state.player.spells[key];
            sp.level++;
            if (sp.damage) sp.damage = Math.floor(sp.damage * 1.25);
            if (sp.heal) sp.heal = Math.floor(sp.heal * 1.2);
            addLog(`✨ ${key} upgraded to level ${sp.level}!`, 'special');
        }

        // ---------- ACTIONS ----------
        function rest() {
            if (!state.inBattle) { addLog('🧘 You meditate in peace.', 'special'); }
            const hpRec = Math.min(40, state.player.maxHp - state.player.hp);
            const mpRec = Math.min(30, state.player.maxMana - state.player.mana);
            state.player.hp += hpRec;
            state.player.mana += mpRec;
            addLog(`🧘 Recovered ${hpRec} HP and ${mpRec} MP.`, 'special');
            if (state.inBattle && state.enemy && state.enemy.hp > 0 && Math.random() < 0.45) {
                setTimeout(() => { enemyTurn(); }, 400);
            }
            updateUI();
        }

        function usePotion() {
            if (state.player.potions <= 0 || state.player.hp >= state.player.maxHp) return;
            const heal = Math.min(50, state.player.maxHp - state.player.hp);
            state.player.hp += heal;
            state.player.potions--;
            addLog(`🧪 Used potion, +${heal} HP.`, 'special');
            updateUI();
            if (state.inBattle && state.enemy && state.enemy.hp > 0 && Math.random() < 0.3) {
                setTimeout(() => { enemyTurn(); }, 500);
            }
        }

        // ---------- INVENTORY & SHOP ----------
        function updateInventoryUI() {
            invList.innerHTML = `<div class="item-row">🧪 Health Potions: <span>${state.player.potions}</span></div>
                                 <div class="item-row">📜 Scrolls: ${state.inventory.scrolls.length}</div>`;
        }

        function updateShopUI() {
            shopList.innerHTML = '';
            state.shopItems.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `<span>${item.name} <small>(${item.desc})</small></span>
                                 <button data-shopidx="${idx}">${item.cost}🪙</button>`;
                row.querySelector('button').addEventListener('click', () => buyShopItem(idx));
                shopList.appendChild(row);
            });
        }

        function buyShopItem(idx) {
            const item = state.shopItems[idx];
            if (!item) return;
            if (state.player.gold < item.cost) { addLog('❌ Not enough gold.', 'enemy'); return; }
            state.player.gold -= item.cost;
            if (item.type === 'potion') {
                state.player.potions += 1;
                addLog(`🧪 Bought Health Potion.`, 'special');
            } else if (item.type === 'mana') {
                state.player.mana = Math.min(state.player.maxMana, state.player.mana + 40);
                addLog(`💧 Bought Mana Potion. +40 MP.`, 'special');
            } else if (item.type === 'scroll') {
                state.inventory.scrolls.push(item.spell);
                addLog(`📜 Bought ${item.name}.`, 'special');
            }
            updateUI();
        }

        // ---------- SAVE / LOAD ----------
        function saveGame() {
            const data = {
                player: state.player,
                enemiesDefeated: state.enemiesDefeated,
                map: { px: state.map.px, py: state.map.py, enemies: state.map.enemies, treasures: state.map.treasures },
                inventory: state.inventory,
                inBattle: false
            };
            localStorage.setItem('arcane_duel_save', JSON.stringify(data));
            addLog('💾 Game saved.', 'special');
        }

        function loadGame() {
            const raw = localStorage.getItem('arcane_duel_save');
            if (!raw) { addLog('❌ No save found.', 'enemy'); return; }
            try {
                const data = JSON.parse(raw);
                Object.assign(state.player, data.player);
                state.enemiesDefeated = data.enemiesDefeated || 0;
                state.map.px = data.map.px ?? 5;
                state.map.py = data.map.py ?? 5;
                state.map.enemies = data.map.enemies || [];
                state.map.treasures = data.map.treasures || [];
                state.inventory = data.inventory || { scrolls: [] };
                state.inBattle = false;
                state.enemy = null;
                generateMap();
                updateUI();
                addLog('📂 Game loaded.', 'special');
            } catch(e) { addLog('❌ Load failed.', 'enemy'); }
        }

        // ---------- INIT ----------
        function init() {
            // reset map
            state.map.px = 5; state.map.py = 5;
            generateMap();
            state.inBattle = false;
            state.enemy = null;
            // event listeners
            for (const [key, btn] of Object.entries(spellBtns)) {
                if (btn) btn.addEventListener('click', () => playerCast(key));
            }
            nextEnemyBtn.addEventListener('click', () => {
                if (state.inBattle) { addLog('⚔️ Already in battle!', 'enemy'); return; }
                startBattle();
                updateUI();
            });
            restBtn.addEventListener('click', rest);
            potionBtn.addEventListener('click', usePotion);
            returnMapBtn.addEventListener('click', () => {
                if (state.inBattle) { addLog('⚔️ Finish the battle first!', 'enemy'); return; }
                renderMap();
                addLog('🗺️ Back to the map.', 'special');
            });
            $('save-btn').addEventListener('click', saveGame);
            $('load-btn').addEventListener('click', loadGame);

            // start with a battle
            startBattle();
            updateUI();
            addLog('⚡ Arcane Duel reworked: explore, fight, and master spells!', 'special');
        }

        // expose for debugging
        window.__state = state;
        init();
    })();
</script>
</body>
