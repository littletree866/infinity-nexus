<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | Infinite Sun</title>
    <link rel="icon" href="../../../icon.jpg" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111714;
            --panel: #1b2520;
            --panel2: #243129;
            --green: #58c77b;
            --text: #edf5ef;
            --muted: #9aaca0;
            --border: #35443a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
        }

        header {
            background: #19231d;
            padding: 20px 5%;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo { font-size: 25px; font-weight: bold; color: var(--green); }
        .logo span { color: white; }
        header a { color: var(--muted); text-decoration: none; }

        .container { max-width: 1400px; margin: auto; padding: 30px 20px; }
        .page-title { font-size: 30px; margin-bottom: 8px; }
        .subtitle { color: var(--muted); margin-bottom: 25px; }

        .search-area { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }

        input, select {
            background: var(--panel);
            color: white;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 13px;
            font-size: 15px;
            outline: none;
        }

        input { flex: 1; min-width: 200px; }
        input:focus, select:focus { border-color: var(--green); }

        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }

        .filter {
            border: none;
            padding: 8px 13px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: var(--panel2);
            font-weight: bold;
        }

        .filter.active { background: var(--green); color: #102016; }

        .results { color: var(--muted); margin-bottom: 15px; font-size: 14px; }

        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .pokemon-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
            content-visibility: auto;
            contain-intrinsic-size: 220px;
            position: relative;
        }

        .pokemon-card:hover {
            transform: translateY(-4px);
            border-color: var(--green);
            background: var(--panel2);
        }

        .pokemon-card.is-form { border-style: dashed; }
        .pokemon-card.is-form .pokemon-name { font-size: 15px; }

        .pokemon-number { color: var(--muted); font-size: 13px; }

        .pokemon-image {
            width: 125px;
            height: 125px;
            object-fit: contain;
            display: block;
            margin: 5px auto;
        }

        .pokemon-name {
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            text-transform: capitalize;
            margin: 8px 0;
        }

        .types { display: flex; justify-content: center; gap: 5px; flex-wrap: nowrap; }

        .type {
            padding: 5px 10px;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .Normal { background: #929a79; }
        .Fire { background: #e56b36; }
        .Water { background: #4789d5; }
        .Electric { background: #d6b52e; }
        .Grass { background: #59a94f; }
        .Ice { background: #68bfc5; }
        .Fighting { background: #bd4844; }
        .Poison { background: #9653a9; }
        .Ground { background: #b18b49; }
        .Flying { background: #8c83d0; }
        .Psychic { background: #e45c8b; }
        .Bug { background: #8c9d32; }
        .Rock { background: #a18c50; }
        .Ghost { background: #665b9c; }
        .Dragon { background: #6253c7; }
        .Dark { background: #65544c; }
        .Steel { background: #8796a6; }
        .Fairy { background: #d887b5; }

        .detail {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.65);
            padding: 40px 20px;
            overflow-y: auto;
        }

        .detail.open {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .detail-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 1000px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: detail-pop 0.15s ease-out;
        }

        .detail-panel.compare-panel { max-width: 1200px; }

        @keyframes detail-pop {
            from { transform: scale(0.96); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .close {
            background: #35443a;
            border: none;
            color: white;
            padding: 9px 14px;
            cursor: pointer;
            border-radius: 5px;
        }

        .close:hover { background: #465a4c; }

        body.modal-open { overflow: hidden; }

        .detail-main {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .detail-image { width: 100%; max-width: 240px; object-fit: contain; }
        .detail-info h2 { font-size: 22px; text-transform: capitalize; margin: 0 0 10px; }
        .section-title { color: var(--green); font-size: 15px; margin: 25px 0 12px; }

        .stat-row {
            display: grid;
            grid-template-columns: 100px 50px 1fr;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
            font-size: 13px;
        }

        .compare-col .stat-row {
            grid-template-columns: 100px 35px 20px 1fr;
            gap: 4px;
        }

        .stat-val {
            text-align: right;
            white-space: nowrap;
            font-weight: bold;
        }

        .stat-arrow {
            text-align: center;
            font-size: 11px;
            display: none; 
        }
        
        .compare-col .stat-arrow {
            display: block;
        }

        .stat-bar { height: 9px; background: #35443a; border-radius: 10px; overflow: hidden; }
        .stat-fill { height: 100%; background: var(--green); border-radius: 10px; }
        .total { color: var(--green); font-weight: bold; margin-top: 15px; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .info-box { background: var(--panel2); padding: 13px; border-radius: 7px; }
        .info-box small { color: var(--muted); display: block; margin-bottom: 6px; }
        .info-box strong { text-transform: capitalize; }
        .info-box .detail-height, 
        .info-box .detail-weight,
        .info-box [class*="cmp-height-"], 
        .info-box [class*="cmp-weight-"] { 
            text-transform: none; 
        }

        .empty { text-align: center; padding: 60px 10px; color: var(--muted); display: none; }

        .evo-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px;
            background: var(--panel2);
            border-radius: 8px;
        }

        .evo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            border-radius: 6px;
            min-width: 90px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .evo-item:hover { background: rgba(255, 255, 255, 0.05); }

        .evo-current {
            background: rgba(88, 199, 123, 0.15);
            outline: 1px solid var(--green);
        }

        .evo-sprite {
            width: 72px;
            height: 72px;
            object-fit: contain;
            image-rendering: auto;
        }

        .evo-name {
            font-size: 12px;
            color: var(--text);
            text-align: center;
            text-transform: capitalize;
        }

        .evo-arrow {
            font-size: 15px;
            color: var(--muted);
            align-self: center;
        }

        .evo-branch-root { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .evo-branch-column { 
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 24px; 
            width: 100%; 
            margin-top: 10px;
        }
        .evo-branch-item {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px;
            background: var(--panel2); 
            border-radius: 8px; 
            padding: 8px;
            border: 1px solid var(--border);
        }
        .evo-arrow-down { font-size: 15px; color: var(--muted); margin: 4px 0; }

        .detail-actions { margin: 14px 0 4px; }
        .detail-actions .cmp-btn { width: 100%; padding: 10px 0; cursor: pointer; }

        .compare-pick-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 16px;
            margin-bottom: 18px;
            background: var(--panel);
            border: 1px solid var(--green);
            border-radius: 9px;
            flex-wrap: wrap;
        }
        .compare-pick-bar.visible { display: flex; }
        .compare-pick-bar strong { color: var(--green); text-transform: capitalize; }
        .compare-pick-bar .cmp-btn { padding: 8px 14px; }

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 10px;
        }

        .compare-col {
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
        }

        .compare-col .cmp-head {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .compare-col .cmp-head img { width: 130px; height: 130px; object-fit: contain; }
        .compare-col .cmp-head h2 { font-size: 20px; text-transform: capitalize; margin: 0; }
        .compare-col .types { justify-content: center; }
        .compare-col .section-title { margin-top: 18px; }

        .cmp-winner { color: var(--green); font-weight: bold; }
        .cmp-loser  { color: var(--muted); }

        .cmp-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .cmp-btn {
            background: var(--panel2);
            border: 1px solid var(--border);
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .cmp-btn:hover { border-color: var(--green); }
        .cmp-btn.primary { background: var(--green); color: #102016; border-color: var(--green); }

        @media(max-width: 650px) {
            .detail-main { grid-template-columns: 1fr; }
            .detail-image { display: block; margin: auto; }
            header { padding: 18px; }
            .detail { padding: 15px; }
            .detail-panel { max-height: calc(100vh - 30px); padding: 18px; }
            .evo-sprite { width: 56px; height: 56px; }
            .evo-item { min-width: 70px; padding: 6px; }
            .compare-grid { grid-template-columns: 1fr; }
            .compare-col .cmp-head img { width: 100px; height: 100px; }
        }
    </style>
</head>

        "Minior": ["minior-red-meteor", "minior-orange-meteor", "minior-yellow-meteor", "minior-green-meteor", "minior-blue-meteor", "minior-indigo-meteor", "minior-violet-meteor"],
        "Mimikyu": ["mimikyu-disguised", "mimikyu-busted"],

    };


    function isValidForm(baseName, varietyName) {
        if (!varietyName) return false;
        const allowed = ALLOWED_FORMS[baseName];
        if (!allowed) return false;
        return allowed.includes(varietyName.toLowerCase());
    }

    function getFormLabel(baseName, varietyName) {
        const lower = varietyName.toLowerCase();
        if (lower.includes("-mega-x")) return "Mega X";
        if (lower.includes("-mega-y")) return "Mega Y";
        if (lower.includes("-mega")) return "Mega";
        if (lower.includes("-primal")) return "Primal";
        if (lower.includes("-crowned")) return "Crowned";

        // Specific forms FIRST (before generic substring checks)
        if (lower.includes("lycanroc-midnight")) return "Midnight";
        if (lower.includes("lycanroc-dusk")) return "Dusk";

        if (lower.includes("oricorio-baile")) return "Baile";
        if (lower.includes("oricorio-pom-pom")) return "Pom-Pom";
        if (lower.includes("oricorio-pau")) return "Pa'u";
        if (lower.includes("oricorio-sensu")) return "Sensu";

        if (lower.includes("wishiwashi-solo")) return "Solo";
        if (lower.includes("wishiwashi-school")) return "School";

        if (lower.includes("mimikyu-busted")) return "Busted";
        if (lower.includes("mimikyu-disguised")) return "";

        if (lower.includes("toxtricity-amped")) return "Amped";
        if (lower.includes("toxtricity-low-key")) return "Low Key";

        if (lower.includes("eiscue-ice")) return "Ice Face";
        if (lower.includes("eiscue-noice")) return "Noice Face";

        if (lower.includes("indeedee-male")) return "Male";
        if (lower.includes("indeedee-female")) return "Female";

        if (lower.includes("morpeko-full-belly")) return "Full Belly";
        if (lower.includes("morpeko-hangry")) return "Hangry";

        if (lower.includes("urshifu-single-strike")) return "Single Strike";
        if (lower.includes("urshifu-rapid-strike")) return "Rapid Strike";

        if (lower.includes("calyrex-ice")) return "Ice Rider";
        if (lower.includes("calyrex-shadow")) return "Shadow Rider";

        if (lower.includes("darmanitan-galar-standard")) return "Galarian Standard";
        if (lower.includes("darmanitan-galar-zen")) return "Galarian Zen";
        if (lower.includes("darmanitan-zen")) return "Zen";

        // Generic Necrozma checks (after specific ones)
        if (lower.includes("necrozma-dusk")) return "Dusk Mane";
        if (lower.includes("necrozma-dawn")) return "Dawn Wings";
        if (lower.includes("necrozma-ultra")) return "Ultra";

        // Regional forms
        if (lower.includes("-alola")) return "Alolan";
        if (lower.includes("-galar")) return "Galarian";
        if (lower.includes("-hisui")) return "Hisuian";

        return varietyLabel(varietyName, baseName);
    }
    
    function splitCSV(line) {
        const out = [];
        let cur = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
                inQuotes = !inQuotes;
                cur += ch;
            } else if (ch === "," && !inQuotes) {
                out.push(cur.trim());
                cur = "";
            } else {
                cur += ch;
            }
        }

        out.push(cur.trim());
        return out;
    }

    function normalizeTypeName(value) {
        if (!value) return "Unknown";
        const cleaned = value.trim().replace(/^"|"$/g, "").replace(/\s+/g, " ");
        if (!cleaned || cleaned === "-------" || cleaned === "None") return "Unknown";
        return typeMap[cleaned] || cleaned;
    }

    function normalizeName(value) {
        return value
            .trim()
            .replace(/^#+|#+$/g, "")
            .replace(/\\sf/g, "♀")
            .replace(/\\sm/g, "♂")
            .replace(/^"|"$/g, "")
            .trim();
    }

    function parseAbilitySlot(raw) {
        if (!raw) return "None";
        const t = raw.trim().replace(/^"|"$/g, "").trim();
        if (!t || t === "-------" || t === "None" || t === "0") return "None";
        return t;
    }

    function getPokemonSpriteUrl(dexNum) {
        return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${dexNum}.png`;
    }

    function createPokemonPlaceholderSvg(name, types) {
        const initials = (name || "PK")
            .replace(/[^A-Za-z\s]/g, "")
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 2)
            .map(part => part[0]?.toUpperCase() || "")
            .join("") || "PK";

        const primary = types && types[0] ? types[0] : "Normal";
        const palette = {
            Normal: ["#929a79", "#6d7659"], Fire: ["#e56b36", "#b24a1f"],
            Water: ["#4789d5", "#2d5f9d"], Electric: ["#d6b52e", "#a1831b"],
            Grass: ["#59a94f", "#377d31"], Ice: ["#68bfc5", "#3d8f97"],
            Fighting: ["#bd4844", "#8d312f"], Poison: ["#9653a9", "#68367e"],
            Ground: ["#b18b49", "#7f6230"], Flying: ["#8c83d0", "#5e5a9d"],
            Psychic: ["#e45c8b", "#b7345b"], Bug: ["#8c9d32", "#627421"],
            Rock: ["#a18c50", "#7b6733"], Ghost: ["#665b9c", "#483f6a"],
            Dragon: ["#6253c7", "#413590"], Dark: ["#65544c", "#433a36"],
            Steel: ["#8796a6", "#5a6876"], Fairy: ["#d887b5", "#a95d86"]
        };

        const [start, end] = palette[primary] || ["#58c77b", "#2a8d4d"];
        const svg = `
            <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'>
                <defs>
                    <linearGradient id='g' x1='0' x2='1'>
                        <stop offset='0%' stop-color='${start}'/>
                        <stop offset='100%' stop-color='${end}'/>
                    </linearGradient>
                </defs>
                <rect width='120' height='120' rx='20' fill='#17231d'/>
                <circle cx='60' cy='48' r='32' fill='url(#g)' opacity='0.95'/>
                <text x='60' y='69' text-anchor='middle' font-size='29' font-weight='700' fill='white' font-family='Arial, sans-serif'>${initials}</text>
                <text x='60' y='101' text-anchor='middle' font-size='10' fill='#eaf5ef' font-family='Arial, sans-serif'>${primary.toUpperCase()}</text>
            </svg>
        `;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    const VARIETY_CACHE_PREFIX = "pokedex.varieties.v2:";
    const varietyCache = new Map();
    const varietyPending = new Map();

    function getStoredVarieties(speciesName) {
        try {
            const raw = localStorage.getItem(VARIETY_CACHE_PREFIX + speciesName);
            return raw ? JSON.parse(raw) : null;

    function setStoredVarieties(speciesName, varieties) {

    function speciesSlugForName(name) {
        return name
            .toLowerCase()
            .replace(/♀/g, "-f")
            .replace(/♂/g, "-m")
            .replace(/[.':]/g, "")
            .replace(/\s+/g, "-")
            .replace(/é/g, "e");
    }

    async function fetchVarieties(speciesName) {
        if (varietyCache.has(speciesName)) return varietyCache.get(speciesName);
        if (varietyPending.has(speciesName)) return varietyPending.get(speciesName);

        const stored = getStoredVarieties(speciesName);
        if (stored) {
            varietyCache.set(speciesName, stored);
            return stored;
        }

        const promise = (async () => {
            try {
                const slug = speciesSlugForName(speciesName);
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${slug}`);
                if (!res.ok) throw new Error(`species ${slug}: ${res.status}`);
                const data = await res.json();

                const varieties = (data.varieties || []).map(v => {
                    const parts = v.pokemon.url.split("/").filter(Boolean);
                    const id = Number(parts[parts.length - 1]);
                    return { name: v.pokemon.name, id, isDefault: !!v.is_default };
                });

                varietyCache.set(speciesName, varieties);
                setStoredVarieties(speciesName, varieties);
                return varieties;
            } catch (err) {
                console.warn("Failed to load varieties for", speciesName, err);
                varietyCache.set(speciesName, []);
                return [];
            } finally {
                varietyPending.delete(speciesName);
            }
        })();

        varietyPending.set(speciesName, promise);
        return promise;
    }

    function formNumFromKey(formKey) {
        const i = formKey.indexOf("~");
        return i >= 0 ? Number(formKey.slice(i + 1)) : 0;
    }

    const MEGA_ITEMS = new Set([
        "Venusaurite", "CharzarditeX", "CharzarditeY", "Blastoisnite", "Beedrillite",

    let MEGA_POKEMON = new Set();

    async function loadMegaItems() {
        try {
            const res = await fetch("pokedexItems.txt");
            if (!res.ok) return;
            const text = await res.text();
            
            const lines = text.split(/\r?\n/);
            for (const rawLine of lines) {
                const line = rawLine.trim();
                if (!line || line.startsWith("@!")) continue;
                
                const match = line.match(/^\+?"(.+?)"/);
                if (!match) continue;
                
                const itemName = match[1];
                if (MEGA_ITEMS.has(itemName)) {
                    let base = itemName.replace(/(ite|iteX|iteY|nite|ite)$/i, "");
                    base = base.replace(/^Charzard/i, "Charizard")
                               .replace(/^Blastoise$/i, "Blastoise")
                               .replace(/^Kangaskan$/i, "Kangaskhan")
                               .replace(/^Aerodactl$/i, "Aerodactyl")
                               .replace(/^Houndoomn$/i, "Houndoom")
                               .replace(/^Sandacod/i, "Sandaconda")
                               .replace(/^Butterfre/i, "Butterfree")
                               .replace(/^Copperjai/i, "Copperajah")
                               .replace(/^Garbador/i, "Garbodor");
                    MEGA_POKEMON.add(base);
                }
            }
        } catch(e) {
            console.warn("Could not load items for mega matching", e);
        }
    }

    function pickVarietyForForm(varieties, formKey) {
        if (!varieties.length) return null;
        
        const baseName = formKey.split("~")[0];
        const n = formNumFromKey(formKey);

        const allowedSlugs = ALLOWED_FORMS[baseName] || [];
        const allowedVarieties = varieties.filter(v => allowedSlugs.includes(v.name.toLowerCase()));

        if (!allowedVarieties.length) return null;

        if (allowedVarieties.length === 1) return allowedVarieties[0];

        const idx = n - 2;
        if (idx >= 0 && idx < allowedVarieties.length) return allowedVarieties[idx];
        
        return allowedVarieties[0];
    }

    function varietyLabel(varietyName, baseName) {
        if (!varietyName) return "";
        const slugBase = speciesSlugForName(baseName);
        let rest = varietyName;
        if (rest.startsWith(slugBase + "-")) rest = rest.slice(slugBase.length + 1);
        else if (rest.startsWith(slugBase)) rest = rest.slice(slugBase.length);
        
        if (!rest) return ""; 
        
        return rest
            .split("-")
            .map(w => w.charAt(0).toUpperCase() + w.slice(1))
            .join(" ");
    }

    async function resolveFormSprite(baseName, formKey, types) {
        const varieties = await fetchVarieties(baseName);
        const picked = pickVarietyForForm(varieties, formKey);
        
        if (!picked) {
            return {
                image: null,
                spriteId: null,
                label: "", 
                varietyName: null
            };
        }
        
        const label = getFormLabel(baseName, picked.name);

        return {
            image: getPokemonSpriteUrl(picked.id),
            spriteId: picked.id,
            label: label,
            varietyName: picked.name
        };
    }

    const EXTRAS_CACHE_PREFIX = "pokedex.extras.v3:";
    const extrasCache = new Map();
    const extrasPending = new Map();

    function getStoredExtras(dexNum) {

            const raw = localStorage.getItem(EXTRAS_CACHE_PREFIX + dexNum);
            return raw ? JSON.parse(raw) : null;

    async function fetchPokemonExtras(dexNum) {
        if (extrasCache.has(dexNum)) return extrasCache.get(dexNum);
        if (extrasPending.has(dexNum)) return extrasPending.get(dexNum);

        const stored = getStoredExtras(dexNum);
        if (stored) {
            extrasCache.set(dexNum, stored);
            return stored;
        }

        const promise = (async () => {
            try {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${dexNum}`);
                if (!res.ok) throw new Error(`PokeAPI ${dexNum}: ${res.status}`);
                const data = await res.json();

                const extras = {
                    height: data.height != null ? `${(data.height / 10).toFixed(1)} m` : "N/A",
                    weight: data.weight != null ? `${(data.weight / 10).toFixed(1)} kg` : "N/A"
                };

                extrasCache.set(dexNum, extras);
                setStoredExtras(dexNum, extras);
                return extras;
            } catch (err) {
                console.warn("Failed to load extras for", dexNum, err);
                const fallback = { height: "N/A", weight: "N/A" };
                extrasCache.set(dexNum, fallback);
                return fallback;
            } finally {
                extrasPending.delete(dexNum);
            }
        })();

        extrasPending.set(dexNum, promise);
        return promise;
    }

    let DEX_ORDER = {};

    function normalizeOrderName(value) {
        return value
            .trim()
            .replace(/^#+|#+$/g, "")
            .replace(/\\sf/g, "♀")
            .replace(/\\sm/g, "♂")
            .replace(/^"|"$/g, "")
            .replace(/^\+/, "")
            .trim();
    }

    async function loadDexOrder() {
        const res = await fetch("pokedexOrder.txt");
        if (!res.ok) throw new Error(`Failed to load pokedexOrder.txt: ${res.status}`);
        const text = await res.text();

        const map = {};
        const lines = text.split(/\r?\n/);

        for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line || line.startsWith("@!")) continue;

            const match = line.match(/^\+?#(.+?)#\s*,\s*(\d+)\s*$/);
            if (!match) continue;

            const name = normalizeOrderName(match[1]);
            const num = Number(match[2]);
            if (!name || !num) continue;

            if (!(name in map)) map[name] = num;
        }

        DEX_ORDER = map;
    }

    let pokemon = [];
    const formResolveQueue = [];

    function registerFormResolution(entry) {
        formResolveQueue.push(entry);
    }

    function parsePokemonData(text) {
        const lines = text.split(/\r?\n/);
        const parsed = [];

        for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line || !line.includes("#") || line.startsWith("@!")) continue;

            const match = line.match(/^\+?#(.+?)#\s*,\s*(.*)$/);
            if (!match) continue;

            const rawName = match[1];
            if (rawName.includes("?")) continue;

            let baseName, formKey = null, formLabel = null;
            const tilde = rawName.indexOf("~");
            if (tilde >= 0) {
                formKey = rawName;
                baseName = normalizeName(rawName.slice(0, tilde));
            } else {
                baseName = normalizeName(rawName);
            }

            if (!baseName) continue;
            const nationalDex = DEX_NUMBERS[baseName];
            if (!nationalDex) continue;

            const parts = splitCSV(match[2]);
            if (!parts.length || !/^\d+$/.test(parts[0])) continue;

            const hp = Number(parts[0]) || 0;
            const attack = Number(parts[1]) || 0;
            const defense = Number(parts[2]) || 0;
            const speed = Number(parts[3]) || 0;
            const spAttack = Number(parts[4]) || 0;
            const spDefense = Number(parts[5]) || 0;
            if (hp + attack + defense + speed + spAttack + spDefense === 0) continue;

            const stats = { hp, attack, defense, speed, spAttack, spDefense };

            const type1 = normalizeTypeName(parts[6]);
            const type2 = normalizeTypeName(parts[7]);
            const types = [type1];
            if (type2 && type2 !== "Unknown" && type2 !== type1) types.push(type2);

            const abilities = [19, 20, 23].map(i => parseAbilitySlot(parts[i]));

            const gameDex = DEX_ORDER[baseName] || nationalDex;
            const uid = formKey ? formKey : baseName;
            const displayName = formLabel ? `${baseName} (${formLabel})` : baseName;

            const entry = {
                uid,
                id: gameDex,
                spriteId: nationalDex,
                baseDex: nationalDex,
                name: baseName,
                displayName,
                isForm: !!formKey,
                formKey,
                types,
                image: getPokemonSpriteUrl(nationalDex),
                stats,
                abilities,
                formResolved: !formKey
            };

            if (formKey) {
                entry.image = createPokemonPlaceholderSvg(baseName, types);
                registerFormResolution(entry);
            }

            parsed.push(entry);
        }

        parsed.sort((a, b) =>
            a.id - b.id ||
            (a.isForm ? 1 : 0) - (b.isForm ? 1 : 0) ||
            a.uid.localeCompare(b.uid)
        );
        return parsed;
    }

    async function resolveQueuedForms() {
        const queue = formResolveQueue.slice();
        formResolveQueue.length = 0;

        const seenSpriteIds = new Set();
        const toRemove = new Set();

        await Promise.all(queue.map(async entry => {
            const resolved = await resolveFormSprite(entry.name, entry.formKey, entry.types);

            if (!resolved.image || !isValidForm(entry.name, resolved.varietyName)) {
                toRemove.add(entry.uid);
                return;
            }

            // Only dedupe if they share the same exact sprite ID.
            // Regional forms have unique IDs, so this won't clash with base forms.
            if (resolved.spriteId != null && seenSpriteIds.has(resolved.spriteId)) {
                toRemove.add(entry.uid);
                return;
            }

            if (resolved.spriteId != null) {
                seenSpriteIds.add(resolved.spriteId);
            }

            entry.image = resolved.image;
            entry.spriteId = resolved.spriteId != null ? resolved.spriteId : entry.spriteId;
            entry.formLabel = resolved.label;
            entry.varietyName = resolved.varietyName;
            
            if (resolved.label) {
                entry.displayName = `${entry.name} (${resolved.label})`;
            } else {
                entry.displayName = entry.name;
            }
            
            entry.formResolved = true;
        }));

        if (toRemove.size > 0) {
            pokemon = pokemon.filter(p => !toRemove.has(p.uid));
        }

        renderPokemon();
    }
    
    async function loadPokemonData() {
        try {
            await loadMegaItems();

            const response = await fetch("pokedex.txt");
            if (!response.ok) throw new Error(`Failed to load pokedex.txt: ${response.status}`);

            const text = await response.text();

            try {
                await loadDexOrder();
            } catch (e) {
                console.warn("pokedexOrder.txt not loaded, using DEX_NUMBERS", e);
            }

            pokemon = parsePokemonData(text);

            if (!pokemon.length) {
                throw new Error("No valid Pokémon entries were parsed from pokedex.txt");
            }

            renderPokemon();
            resolveQueuedForms();
        } catch (error) {
            console.error(error);
            pokemon = [{
                uid: "Bulbasaur", id: 1, spriteId: 1, baseDex: 1, name: "Bulbasaur",
                displayName: "Bulbasaur", isForm: false,
                types: ["Grass", "Poison"], image: getPokemonSpriteUrl(1),
                stats: { hp: 45, attack: 49, defense: 49, speed: 45, spAttack: 65, spDefense: 65 },
                abilities: ["Overgrow", "None", "Chlorophyll"],
                formResolved: true
            }];
            renderPokemon();
        }
    }

    function getStatColor(value) {
        if (value < 30)  return "#d94a4a";
        if (value < 60)  return "#e07a2f";
        if (value < 90)  return "#d9b32a";
        if (value < 120) return "#7dc25a";

        return "#3a7bd5";
    }

    function evoNodeName(dex) {
        return NAME_BY_DEX[dex] || `#${dex}`;
    }

    function evoNodeHTML(dex, currentSpriteId, extraClass = "") {
        const name = evoNodeName(dex);
        const isCurrent = dex === currentSpriteId;
        const sprite = getPokemonSpriteUrl(dex);
        return `<div class="evo-item${isCurrent ? " evo-current" : ""} ${extraClass}" data-sprite-id="${dex}">
            <img class="evo-sprite" src="${sprite}" alt="${name}" loading="lazy"
                onerror="this.onerror=null; this.src='${createPokemonPlaceholderSvg(name, ["Normal"])}'">
            <div class="evo-name">${name}</div>
        </div>`;
    }

    function renderEvoBranch(node, currentSpriteId) {
        const selfHTML = evoNodeHTML(node.dex, currentSpriteId);
        if (!node.children || !node.children.length) return selfHTML;

        const childCols = node.children.map(child => {
            const childSelf = evoNodeHTML(child.dex, currentSpriteId);
            if (!child.children || !child.children.length) {
                return `<div class="evo-branch-item">${childSelf}</div>`;
            }
            const grandChildren = child.children.map(gc =>
                `<div class="evo-branch-item">${evoNodeHTML(gc.dex, currentSpriteId)}</div>`
            ).join("");
            return `<div class="evo-branch-item">
                ${childSelf}
                <div class="evo-branch-column">${grandChildren}</div>
            </div>`;
        }).join("");

        return `<div class="evo-branch-root">
            ${selfHTML}
            <div class="evo-arrow evo-arrow-down">↓</div>
            <div class="evo-branch-column">${childCols}</div>
        </div>`;
    }

    function buildEvolutionLineHTML(baseDex, currentSpriteId = baseDex) {
        const contains = (node, dex) => node.dex === dex || (node.children || []).some(c => contains(c, dex));

        for (const baseKey of Object.keys(EVO_BRANCHES)) {
            const tree = EVO_BRANCHES[baseKey];
            if (contains(tree, baseDex)) {
                return `<div class="evo-branch-wrap">${renderEvoBranch(tree, currentSpriteId)}</div>`;
            }
        }

        const line = EVOLUTIONS[baseDex];
        if (!line || line.length < 2) return "";

        const items = line.map(dex => evoNodeHTML(dex, currentSpriteId))
            .join('<div class="evo-arrow">→</div>');

        return `<div class="evo-row">${items}</div>`;
    }

    let renderTimer = null;

    function renderPokemon() {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(renderPokemonNow, 60);
    }

    function renderPokemonNow() {
        const search = document.getElementById("search").value.toLowerCase();
        const sort = document.getElementById("sort").value;

        let filtered = pokemon.filter(p => {
            const matchesSearch =
                p.displayName.toLowerCase().includes(search) ||
                p.name.toLowerCase().includes(search) ||
                String(p.id).includes(search);
            const matchesType =
                selectedType === "All" || p.types.includes(selectedType);
            return matchesSearch && matchesType;
        });

        if (sort === "name") filtered.sort((a, b) => a.displayName.localeCompare(b.displayName));
        if (sort === "number") filtered.sort((a, b) => a.id - b.id || (a.isForm ? 1 : 0) - (b.isForm ? 1 : 0));
        if (sort === "bst") filtered.sort((a, b) => getBST(b) - getBST(a));

        const grid = document.getElementById("pokemon-grid");
        document.getElementById("results").textContent = `Showing ${filtered.length} Pokémon`;
        document.getElementById("empty").style.display = filtered.length === 0 ? "block" : "none";

        const parts = [];
        for (const p of filtered) {
            const types = p.types.map(t => `<span class="type ${t}">${t}</span>`).join("");
            parts.push(`<div class="pokemon-card${p.isForm ? " is-form" : ""}" data-uid="${p.uid}">
                <div class="pokemon-number">#${String(p.id).padStart(4, "0")}</div>
                <img class="pokemon-image"
                    src="${p.image}" alt="${p.displayName}"
                    loading="lazy" decoding="async"
                    data-name="${p.name}" data-types="${p.types.join("|")}">
                <div class="pokemon-name">${p.displayName}</div>
                <div class="types">${types}</div>
            </div>`);
        }
        grid.innerHTML = parts.join("");
    }

    document.getElementById("pokemon-grid").addEventListener("click", e => {
        const card = e.target.closest(".pokemon-card");
        if (!card) return;
        const uid = card.dataset.uid;
        if (!uid) return;

        if (awaitingCompareSecond && compareFirstUid) {
            if (uid === compareFirstUid) return;
            const first = getPokemonByUid(compareFirstUid);
            const second = getPokemonByUid(uid);
            if (first && second) {
                cancelComparePick();
                openComparison(first.uid, second.uid);
            }
            return;
        }
        showDetail(uid);
    });

    document.getElementById("pokemon-grid").addEventListener("error", e => {
        const img = e.target;
        if (img.tagName === "IMG" && !img.dataset.fallback) {
            img.dataset.fallback = "1";
            const name = img.dataset.name || "PK";
            const types = (img.dataset.types || "Normal").split("|");
            img.src = createPokemonPlaceholderSvg(name, types);
        }
    }, true);

    document.getElementById("filters").addEventListener("click", e => {
        const btn = e.target.closest(".filter");
        if (btn) setType(btn.dataset.type);
    });

    document.getElementById("search").addEventListener("input", renderPokemon);
    document.getElementById("sort").addEventListener("change", renderPokemon);

    document.getElementById("detail").addEventListener("click", e => {
        if (e.target.id === "detail") closeDetail();
    });

    document.getElementById("detail").addEventListener("click", e => {
        const tile = e.target.closest(".evo-item");
        if (!tile) return;
        const spriteId = Number(tile.dataset.spriteId);
        if (!spriteId) return;
        const target = pokemon.find(x => x.spriteId === spriteId || x.baseDex === spriteId);
        if (target) showDetail(target.uid);
    });

    document.addEventListener("keydown", e => {
        if (e.key !== "Escape") return;
        if (document.getElementById("detail").classList.contains("open")) {
            closeDetail();
        } else if (awaitingCompareSecond) {
            cancelComparePick();
        }
    });

    function getBST(p) {
        return Object.values(p.stats).reduce((a, b) => a + b, 0);
    }

    let currentDetailUid = null;
    let currentCompareUids = null;
    let awaitingCompareSecond = false;
    let compareFirstUid = null;

    function showDetail(uid) {
        const p = getPokemonByUid(uid);
        if (!p) return;

        currentDetailUid = uid;
        currentCompareUids = null;

        const detail = document.getElementById("detail");
        const content = document.getElementById("detail-content");
        const panel = document.getElementById("detail-panel");
        const title = document.getElementById("detail-title");

        panel.classList.remove("compare-panel");
        title.textContent = p.isForm ? "Pokémon Information" : "Pokémon Information";

        detail.classList.add("open");
        document.body.classList.add("modal-open");

        const types = p.types.map(t => `<span class="type ${t}">${t}</span>`).join("");

        const abilityLabels = ["Ability 1", "Ability 2", "Hidden Ability"];
        const abilityBoxes = p.abilities.map((a, i) => `
            <div class="info-box"><small>${abilityLabels[i]}</small><strong>${a}</strong></div>
        `).join("");

        const statNames = {
            hp: "HP", attack: "Attack", defense: "Defense",
            spAttack: "Sp. Attack", spDefense: "Sp. Defense", speed: "Speed"
        };

        let statsHTML = "";
        for (const [key, value] of Object.entries(p.stats)) {
            const color = getStatColor(value);
            statsHTML += `
                <div class="stat-row">
                    <strong>${statNames[key]}</strong>
                    <span class="stat-val" style="color:${color};">${value}</span>
                    <div class="stat-bar">
                        <div class="stat-fill" style="width:${Math.min(value / 180 * 100, 100)}%; background:${color};"></div>
                    </div>
                </div>`;
        }

        const evoHTML = buildEvolutionLineHTML(p.baseDex, p.spriteId);

        content.innerHTML = `
            <div class="detail-main">
                <div>
                    <img class="detail-image" src="${p.image}" alt="${p.displayName}"
                        data-name="${p.name}" data-types="${p.types.join("|")}">
                    <div class="detail-actions">
                        <button class="cmp-btn primary" id="detail-compare-btn">⇄ Compare this Pokémon</button>
                    </div>

                </div>
                <div class="detail-info">
                    <h2>#${String(p.id).padStart(4, "0")} ${p.displayName}</h2>
                    <div class="types">${types}</div>

                    <h3 class="section-title">Base Stats</h3>
                    ${statsHTML}
                    <div class="total">Total: ${getBST(p)}</div>

                    <h3 class="section-title">Pokémon Information</h3>
                    <div class="info-grid">
                        <div class="info-box"><small>Height</small><strong class="detail-height">Loading…</strong></div>
                        <div class="info-box"><small>Weight</small><strong class="detail-weight">Loading…</strong></div>
                    </div>

                    <h3 class="section-title">Abilities</h3>
                    <div class="info-grid">${abilityBoxes}</div>

                    ${evoHTML ? `<h3 class="section-title">Evolution Line</h3>${evoHTML}` : ""}
                </div>
            </div>`;

        const img = content.querySelector(".detail-image");
        if (img) {
            img.addEventListener("error", () => {
                img.onerror = null;
                img.src = createPokemonPlaceholderSvg(p.name, p.types);
            }, { once: true });
        }

        content.querySelector("#detail-compare-btn").addEventListener("click", () => {
            beginComparePick(p.uid);
        });

        fetchPokemonExtras(p.spriteId).then(extras => {
            if (currentDetailUid === p.uid) {
                const hEl = content.querySelector(".detail-height");
                const wEl = content.querySelector(".detail-weight");
                if (hEl) hEl.textContent = extras.height;
                if (wEl) wEl.textContent = extras.weight;
            }
        });

        document.getElementById("detail-panel").scrollTop = 0;
    }

    const comparePickBar = document.getElementById("compare-pick-bar");

    function beginComparePick(uid) {
        compareFirstUid = uid;
        awaitingCompareSecond = true;
        closeDetail();
        updateComparePickBar();
    }

    function cancelComparePick() {
        awaitingCompareSecond = false;
        compareFirstUid = null;
        updateComparePickBar();
    }

    function updateComparePickBar() {
        if (!comparePickBar) return;
        if (awaitingCompareSecond && compareFirstUid) {
            const p = getPokemonByUid(compareFirstUid);
            comparePickBar.classList.add("visible");
            comparePickBar.innerHTML = `
                <span>Comparing <strong>${p ? p.displayName : "?"}</strong> — pick a second Pokémon.</span>
                <button class="cmp-btn" id="compare-pick-cancel">Cancel</button>`;
            comparePickBar.querySelector("#compare-pick-cancel")
                .addEventListener("click", cancelComparePick);
        } else {
            comparePickBar.classList.remove("visible");
            comparePickBar.innerHTML = "";
        }
    }

    function statNamesMap() {
        return {
            hp: "HP", attack: "Attack", defense: "Defense",
            spAttack: "Sp. Attack", spDefense: "Sp. Defense", speed: "Speed"
        };
    }

    function buildCompareColumn(p, other) {
        const statNames = statNamesMap();
        const types = p.types.map(t => `<span class="type ${t}">${t}</span>`).join("");
        const abilityLabels = ["Ability 1", "Ability 2", "Hidden Ability"];
        const abilityBoxes = p.abilities.map((a, i) => `
            <div class="info-box"><small>${abilityLabels[i]}</small><strong>${a}</strong></div>`).join("");

        let statsHTML = "";
        for (const [key, value] of Object.entries(p.stats)) {
            const otherVal = other.stats[key];
            const color = getStatColor(value);

            let arrow = "";
            if (value > otherVal) arrow = "▲";
            else if (value < otherVal) arrow = "▼";

            statsHTML += `
                <div class="stat-row">
                    <strong>${statNames[key]}</strong>
                    <span class="stat-val" style="color:${color};">${value}</span>
                    <span class="stat-arrow" style="color:${color};">${arrow}</span>
                    <div class="stat-bar">
                        <div class="stat-fill" style="width:${Math.min(value / 180 * 100, 100)}%; background:${color};"></div>
                    </div>
                </div>`;
        }

        const bstOwn = getBST(p), bstOther = getBST(other);
        const bstClass = bstOwn > bstOther ? "cmp-winner" : bstOwn < bstOther ? "cmp-loser" : "";
        const bstSuffix = bstOwn > bstOther ? " ▲" : bstOwn < bstOther ? " ▼" : "";
        
        const evoHTML = buildEvolutionLineHTML(p.baseDex, p.spriteId);

        return `
            <div class="compare-col" data-compare-uid="${p.uid}">
                <div class="cmp-head">
                    <img src="${p.image}" alt="${p.displayName}"
                        data-name="${p.name}" data-types="${p.types.join("|")}" class="cmp-sprite">
                    <h2>#${String(p.id).padStart(4, "0")} ${p.displayName}</h2>
                    <div class="types">${types}</div>
                </div>

                <h3 class="section-title">Base Stats</h3>
                ${statsHTML}
                <div class="total ${bstClass}">Total: ${bstOwn}${bstSuffix}</div>

                <h3 class="section-title">Pokémon Information</h3>
                <div class="info-grid">
                    <div class="info-box"><small>Height</small><strong class="cmp-height-${p.uid}">Loading…</strong></div>
                    <div class="info-box"><small>Weight</small><strong class="cmp-weight-${p.uid}">Loading…</strong></div>
                </div>

                <h3 class="section-title">Abilities</h3>
                <div class="info-grid">${abilityBoxes}</div>

                ${evoHTML ? `<h3 class="section-title">Evolution Line</h3>${evoHTML}` : ""}
            </div>`;
    }

    function bindCompareImageFallbacks(scope) {
        scope.querySelectorAll(".cmp-sprite").forEach(img => {
            img.addEventListener("error", () => {
                img.onerror = null;
                img.src = createPokemonPlaceholderSvg(
                    img.dataset.name || "PK",
                    (img.dataset.types || "Normal").split("|")
                );
            }, { once: true });
        });
        scope.querySelectorAll(".evo-sprite").forEach(img => {
            img.addEventListener("error", () => {
                img.onerror = null;
                img.src = createPokemonPlaceholderSvg(img.alt || "PK", ["Normal"]);
            }, { once: true });
        });
    }

    function renderComparisonGrid(uidA, uidB) {
        const a = getPokemonByUid(uidA), b = getPokemonByUid(uidB);
        if (!a || !b) return;
        const grid = document.querySelector("#detail-content .compare-grid");
        if (!grid) return;
        grid.innerHTML = buildCompareColumn(a, b) + buildCompareColumn(b, a);
        bindCompareImageFallbacks(grid);

        [a, b].forEach(p => {
            fetchPokemonExtras(p.spriteId).then(extras => {
                if (currentCompareUids && currentCompareUids.includes(p.uid)) {
                    const hEl = grid.querySelector(`.cmp-height-${p.uid}`);
                    const wEl = grid.querySelector(`.cmp-weight-${p.uid}`);
                    if (hEl) hEl.textContent = extras.height;
                    if (wEl) wEl.textContent = extras.weight;
                }
            });
        });
    }

    function openComparison(uidA, uidB) {
        const a = getPokemonByUid(uidA), b = getPokemonByUid(uidB);
        if (!a || !b) return;

        currentDetailUid = null;
        currentCompareUids = [uidA, uidB];

        const detail = document.getElementById("detail");
        const content = document.getElementById("detail-content");
        const panel = document.getElementById("detail-panel");
        const title = document.getElementById("detail-title");

        title.textContent = "Pokémon Comparison";
        panel.classList.add("compare-panel");
        detail.classList.add("open");
        document.body.classList.add("modal-open");

        content.innerHTML = `
            <div class="compare-grid">
                ${buildCompareColumn(a, b)}
                ${buildCompareColumn(b, a)}
            </div>
            <div class="cmp-actions">
                <button class="cmp-btn primary" id="cmp-swap">Swap Sides</button>
                <button class="cmp-btn" id="cmp-change">Change Selection</button>
                <button class="cmp-btn" id="cmp-close">Close</button>
            </div>`;

        const grid = content.querySelector(".compare-grid");
        bindCompareImageFallbacks(grid);

        content.querySelector("#cmp-swap").addEventListener("click", () => {
            renderComparisonGrid(currentCompareUids[1], currentCompareUids[0]);
        });
        content.querySelector("#cmp-change").addEventListener("click", () => {
            const keep = currentCompareUids[0];
            closeDetail();
            beginComparePick(keep);
        });
        content.querySelector("#cmp-close").addEventListener("click", closeDetail);

        [a, b].forEach(p => {
            fetchPokemonExtras(p.spriteId).then(extras => {
                if (currentCompareUids && currentCompareUids.includes(p.uid)) {
                    const hEl = content.querySelector(`.cmp-height-${p.uid}`);
                    const wEl = content.querySelector(`.cmp-weight-${p.uid}`);
                    if (hEl) hEl.textContent = extras.height;
                    if (wEl) wEl.textContent = extras.weight;
                }
            });
        });

        document.getElementById("detail-panel").scrollTop = 0;
    }

    function closeDetail() {
        currentDetailUid = null;
        currentCompareUids = null;
        document.getElementById("detail").classList.remove("open");
        document.body.classList.remove("modal-open");
    }

    updateComparePickBar();
    loadPokemonData();

</script>
</body>
</html>
