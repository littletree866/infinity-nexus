<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../icon.jpg" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
    <title>Infinite Sun Documentation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            width: 100%;
            background: #f9fafc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .sheet-container {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            transition: box-shadow 0.2s ease;
        }

        .sheet-container:hover {
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            font-family: "IBM Plex Sans", sans-serif;
        }

        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            .sheet-container { height: 85vh; border-radius: 12px; }
        }
    </style>
</head>
<body>
    <div class="sheet-container">
        <iframe
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSSbA1KDitZtFqVvZAghWUFgM72Wz4g8dF8AmhvdP9temHwp90Ibmh7DbLRyM8Nm5z0N4TnRVUOecia/pubhtml?widget=true&headers=false"
            title="Infinite Sun Documentation"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
