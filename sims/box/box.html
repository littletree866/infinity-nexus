<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Box</title>
    <link rel="icon" href="../../icon.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="box.css" />
</head>

<body>

    <div id="homeScreen">
        <div>
            <h2>The Box</h2>
            <div class="subtitle">An Escape</div>
            <div class="divider"></div>
            <p>
                You wake in a cold stone chamber with no memory of how you arrived.<br>
                The only object of note is an ornate box upon a wooden table.<br>
                <span class="intro-accent">Find your way out.</span>
            </p>
            <button id="begin-box-game" type="button">Begin</button>
        </div>
    </div>

    <div id="app">
        <header>
            <h1>The Box <span id="level-indicator">Level 1: The Chamber</span></h1>
            <div id="game-info">
                <div id="timer">Time: 15:00</div>
                <div id="level">Level 1 of 5</div>
            </div>
        </header>

        <div id="game-container" class="fade-in">
            <div id="text-display"></div>
            <div id="options-container"></div>
            <div id="inventory-display" class="hidden">
                <strong>Inventory</strong>
                <span id="inventory-items"></span>
            </div>
        </div>
    </div>

    <button id="hint-button" title="Request a clue">Clue</button>
    <script src="box.js" defer></script>
</body>

</html>
