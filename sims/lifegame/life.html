<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon City Empire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../../icon.jpg" type="image/x-icon">
  <style>
    :root {
      --bg-1: #0d1021;
      --bg-2: #111827;
      --panel: rgba(17, 24, 39, 0.85);
      --panel-strong: rgba(15, 23, 42, 0.92);
      --glass: rgba(255,255,255,0.08);
      --line: rgba(148, 163, 184, 0.18);
      --text: #e5eefb;
      --muted: #96a3ba;
      --gold: #fbbf24;
      --green: #34d399;
      --cyan: #38bdf8;
      --purple: #a78bfa;
      --red: #fb7185;
      --orange: #f59e0b;
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.5);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(167, 139, 250, 0.25), transparent 25%),
        radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    body {
      padding: 22px;
      overflow-x: hidden;
    }

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      z-index: 50;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    .back-button:hover {
      background: rgba(30, 41, 59, 0.9);
      transform: translateY(-1px);
    }

    .app {
      max-width: 1500px;
      margin: 50px auto 0;
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr) 330px;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .sidebar {
      padding: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand h1 {
      font-size: 1.6rem;
      margin: 0;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .day-chip {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--green);
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 10px;
    }

    .stat-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text);
    }

    .cash { color: var(--green); }
    .rep { color: var(--gold); }
    .energy { color: var(--cyan); }
    .vibe { color: var(--purple); }

    .action-list {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .action-btn, .build-card button, .mini-btn {
      border: 0;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .action-btn {
      width: 100%;
      padding: 13px 14px;
      color: white;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(167, 139, 250, 0.22));
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .action-btn:hover, .build-card button:hover, .mini-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
    }

    .action-btn.success {
      background: linear-gradient(135deg, #059669, #10b981);
    }

    .action-btn.warn {
      background: linear-gradient(135deg, #d97706, #f59e0b);
    }

    .action-btn.rose {
      background: linear-gradient(135deg, #be123c, #fb7185);
    }

    .mission-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 12px;
      margin-bottom: 18px;
    }

    .mission-card h3 {
      margin: 0 0 8px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mission-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--gold);
    }

    .mission-bar {
      height: 9px;
      width: 100%;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 12px;
    }

    .mission-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      border-radius: inherit;
      transition: width .25s ease;
    }

    .inventory-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
    }

    .inventory-box h3 {
      margin: 0 0 8px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .inventory-list {
      display: grid;
      gap: 8px;
    }

    .inventory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 0.9rem;
      color: var(--text);
    }

    .main-panel {
      padding: 18px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 4px 8px 0;
    }

    .header-row h2 {
      margin: 0;
      font-size: clamp(1.6rem, 2vw, 2.4rem);
      letter-spacing: 0.04em;
    }

    .status-pill {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: var(--cyan);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .city-card, .mini-game-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
    }

    .city-card h3, .mini-game-card h3, .right-panel h3 {
      margin: 0 0 12px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .city-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      min-height: 360px;
    }

    .tile {
      position: relative;
      min-height: 110px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(30,41,59,0.85));
      padding: 10px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .tile:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 8px 18px rgba(59,130,246,0.16);
    }

    .tile.empty::before {
      content: "+";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: rgba(148, 163, 184, 0.4);
      font-weight: 700;
    }

    .tile.occupied {
      border-color: rgba(52, 211, 153, 0.4);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .tile-inner {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 100%;
      background: rgba(15, 23, 42, 0.22);
      border-radius: 12px;
      padding: 8px 6px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .tile-icon {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 4px;
    }

    .tile-name {
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      color: var(--text);
    }

    .tile-lvl {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .mini-game-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 210px;
    }

    .mini-game {
      position: relative;
      flex: 1;
      min-height: 160px;
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(15,23,42,0.4), rgba(30,41,59,0.72)),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.02),
          rgba(255,255,255,0.02) 12px,
          transparent 12px,
          transparent 24px
        );
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .target {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fef3c7, #f59e0b 45%, #b45309 100%);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.9);
      border: 2px solid rgba(255,255,255,0.8);
      cursor: pointer;
      animation: pulse 0.8s ease-in-out infinite alternate;
      transition: transform .1s ease;
    }

    @keyframes pulse {
      from { transform: scale(0.92); }
      to { transform: scale(1.12); }
    }

    .mini-btn {
      background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
      color: white;
      padding: 12px 16px;
      width: 100%;
    }

    .log-box {
      margin-top: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      min-height: 90px;
    }

    .log-box h3 {
      margin: 0 0 8px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
    }

    .log-item {
      border-left: 2px solid rgba(56, 189, 248, 0.5);
      padding-left: 10px;
      color: var(--muted);
    }

    .log-item.success { color: var(--green); border-left-color: var(--green); }
    .log-item.warning { color: var(--gold); border-left-color: var(--gold); }
    .log-item.error { color: var(--red); border-left-color: var(--red); }

    .right-panel {
      padding: 18px;
    }

    .build-list {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .build-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .build-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .build-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .build-card button {
      padding: 8px 12px;
      min-width: 92px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(52, 211, 153, 0.22));
      color: var(--text);
      border: 1px solid rgba(56, 189, 248, 0.18);
    }

    .build-card.selected {
      border-color: rgba(167, 139, 250, 0.7);
      box-shadow: 0 0 0 1px rgba(167, 139, 250, 0.28);
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 1fr;
      }
      .main-panel, .sidebar, .right-panel { order: unset; }
    }

    @media (max-width: 620px) {
      body { padding: 16px; }
      .header-row { flex-direction: column; align-items: flex-start; }
      .city-board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .top-grid { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <a class="back-button" href="../../index.html">← Back</a>

  <div class="app">
    <aside class="panel sidebar">
      <div class="brand">
        <h1>NEON CITY</h1>
        <span class="day-chip" id="dayChip">Day 1</span>
      </div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-label">Cash</div>
          <div class="stat-value cash" id="cashStat">$150</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Reputation</div>
          <div class="stat-value rep" id="repStat">1</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Energy</div>
          <div class="stat-value energy" id="energyStat">100%</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Vibe</div>
          <div class="stat-value vibe" id="vibeStat">0</div>
        </div>
      </div>

      <div class="action-list">
        <button class="action-btn primary" id="workBtn">Work Shift</button>
        <button class="action-btn success" id="tradeBtn">Trade Goods</button>
        <button class="action-btn warn" id="upgradeBtn">Upgrade District</button>
        <button class="action-btn rose" id="restBtn">Rest & Recover</button>
      </div>

      <div class="mission-card">
        <h3>Objective</h3>
        <div class="mission-title" id="missionTitle">Open 2 businesses</div>
        <div class="mission-bar"><div class="mission-fill" id="missionFill"></div></div>
        <div id="missionText">0 / 2</div>
      </div>

      <div class="inventory-box">
        <h3>Inventory</h3>
        <div class="inventory-list" id="inventoryList"></div>
      </div>
    </aside>

    <main class="panel main-panel">
      <div class="header-row">
        <h2>City Growth</h2>
        <div class="status-pill" id="incomePill">+$0 / sec</div>
      </div>

      <div class="top-grid">
        <div class="city-card">
          <h3>District map</h3>
          <div id="cityBoard" class="city-board" aria-label="City map"></div>
        </div>

        <div class="mini-game-card">
          <h3>Quick click rush</h3>
          <div id="miniGame" class="mini-game" aria-label="Quick click game area"></div>
          <button class="mini-btn" id="spawnTargetBtn">Spawn target</button>
        </div>
      </div>

      <div class="log-box">
        <h3>City log</h3>
        <div class="log-list" id="logList"></div>
      </div>
    </main>

    <aside class="panel right-panel">
      <h3>Build menu</h3>
      <div id="buildList" class="build-list"></div>
    </aside>
  </div>

  <script>
    const catalog = [
      { id: 'cafe', name: 'Cafe', icon: '☕', cost: 80, income: 8, output: 'coffee', color: '#fbbf24', desc: 'Coffee rush' },
      { id: 'market', name: 'Market', icon: '🛒', cost: 110, income: 12, output: 'food', color: '#34d399', desc: 'Fresh produce' },
      { id: 'studio', name: 'Studio', icon: '🎨', cost: 140, income: 15, output: 'design', color: '#60a5fa', desc: 'Creative work' },
      { id: 'lab', name: 'Lab', icon: '🔬', cost: 200, income: 20, output: 'tech', color: '#a78bfa', desc: 'R&D' },
      { id: 'yard', name: 'Workshop', icon: '🛠️', cost: 180, income: 18, output: 'goods', color: '#fb7185', desc: 'Repairs & builds' },
      { id: 'club', name: 'Club', icon: '🎵', cost: 250, income: 26, output: 'vibe', color: '#f472b6', desc: 'Nightlife buzz' }
    ];

    const state = {
      cash: 150,
      reputation: 1,
      energy: 100,
      vibe: 0,
      day: 1,
      totalIncome: 0,
      selectedBuild: 'cafe',
      mission: {
        title: 'Open 2 businesses',
        progress: 0,
        target: 2,
        done: false
      },
      board: Array.from({ length: 16 }, () => ({ building: null, level: 0 })),
      inventory: {
        coffee: 0,
        food: 0,
        design: 0,
        tech: 0,
        goods: 0,
        vibe: 0
      },
      log: [
        { text: 'Your first plot is ready for a fresh start.', tone: 'success' }
      ]
    };

    const moneyStat = document.getElementById('cashStat');
    const repStat = document.getElementById('repStat');
    const energyStat = document.getElementById('energyStat');
    const vibeStat = document.getElementById('vibeStat');
    const cityBoardEl = document.getElementById('cityBoard');
    const inventoryList = document.getElementById('inventoryList');
    const buildList = document.getElementById('buildList');
    const missionTitleEl = document.getElementById('missionTitle');
    const missionFillEl = document.getElementById('missionFill');
    const missionTextEl = document.getElementById('missionText');
    const incomePill = document.getElementById('incomePill');
    const logList = document.getElementById('logList');
    const miniGameEl = document.getElementById('miniGame');
    const targetBtn = document.getElementById('spawnTargetBtn');
    const dayChip = document.getElementById('dayChip');

    function currency(value) {
      if (value >= 1000) return '$' + (value / 1000).toFixed(1) + 'k';
      return '$' + Math.floor(value);
    }

    function addLog(text, tone = 'success') {
      state.log.unshift({ text, tone });
      state.log = state.log.slice(0, 5);
      renderLog();
    }

    function renderLog() {
      logList.innerHTML = state.log.map(item =>
        `<div class="log-item ${item.tone}">${item.text}</div>`
      ).join('');
    }

    function getSelectedBuild() {
      return catalog.find(item => item.id === state.selectedBuild);
    }

    function calcIncome() {
      let total = 0;
      for (const tile of state.board) {
        if (!tile.building) continue;
        const build = catalog.find(item => item.id === tile.building);
        total += build.income * tile.level * (1 + state.reputation * 0.12);
      }
      return total;
    }

    function updateMission() {
      const opened = state.board.filter(tile => tile.building).length;
      state.mission.progress = opened;
      const percent = Math.min(100, (opened / state.mission.target) * 100);
      missionTitleEl.textContent = state.mission.title;
      missionFillEl.style.width = percent + '%';
      missionTextEl.textContent = `${opened} / ${state.mission.target}`;

      if (opened >= state.mission.target && !state.mission.done) {
        state.mission.done = true;
        state.reputation += 1;
        state.vibe += 10;
        addLog('Objective cleared: the district is buzzing.', 'warning');
      }
    }

    function renderInventory() {
      inventoryList.innerHTML = Object.entries(state.inventory)
        .map(([key, val]) => `<div class="inventory-item"><span>${key}</span><strong>${val}</strong></div>`)
        .join('');
    }

    function renderBuildMenu() {
      buildList.innerHTML = catalog.map(build => `
        <div class="build-card ${state.selectedBuild === build.id ? 'selected' : ''}">
          <div>
            <div class="build-name"><span>${build.icon}</span><span>${build.name}</span></div>
            <div class="build-meta">${build.desc} • ${currency(build.cost)}</div>
          </div>
          <button data-build="${build.id}">Build</button>
        </div>
      `).join('');

      Array.from(document.querySelectorAll('[data-build]')).forEach(button => {
        button.addEventListener('click', () => {
          state.selectedBuild = button.dataset.build;
          renderBuildMenu();
        });
      });
    }

    function renderBoard() {
      cityBoardEl.innerHTML = state.board.map((tile, index) => {
        if (!tile.building) {
          return `<div class="tile empty" data-index="${index}" title="Open tile"></div>`;
        }

        const build = catalog.find(item => item.id === tile.building);
        return `
          <div class="tile occupied" data-index="${index}" style="background: linear-gradient(180deg, rgba(15,23,42,0.9), ${build.color}33);">
            <div class="tile-inner">
              <span class="tile-icon">${build.icon}</span>
              <span class="tile-name">${build.name}</span>
              <span class="tile-lvl">Lvl ${tile.level}</span>
            </div>
          </div>
        `;
      }).join('');

      cityBoardEl.querySelectorAll('.tile').forEach(tile => {
        tile.addEventListener('click', () => handleTileClick(Number(tile.dataset.index)));
      });
    }

    function handleTileClick(index) {
      const tile = state.board[index];
      const selected = getSelectedBuild();

      if (!tile.building) {
        if (state.cash < selected.cost) {
          addLog('Not enough cash for that build.', 'error');
          return;
        }
        state.cash -= selected.cost;
        tile.building = selected.id;
        tile.level = 1;
        state.inventory[selected.output] += 2;
        addLog(`${selected.name} opened on the block.`, 'success');
      } else {
        const build = catalog.find(item => item.id === tile.building);
        const cost = Math.round(build.cost * 0.7 * tile.level);
        if (state.cash < cost) {
          addLog('This block still needs more money to upgrade.', 'error');
          return;
        }
        state.cash -= cost;
        tile.level += 1;
        state.vibe += 2;
        addLog(`${build.name} upgraded to level ${tile.level}.`, 'warning');
      }

      updateMission();
      updateUI();
    }

    function spawnTarget() {
      const target = document.createElement('button');
      target.className = 'target';

      const gameW = miniGameEl.clientWidth;
      const gameH = miniGameEl.clientHeight;
      const x = Math.max(10, Math.random() * (gameW - 54));
      const y = Math.max(10, Math.random() * (gameH - 54));

      target.style.left = x + 'px';
      target.style.top = y + 'px';
      target.type = 'button';
      target.setAttribute('aria-label', 'Hit target');

      target.addEventListener('click', () => {
        const bonus = 12 + Math.floor(Math.random() * 18);
        state.cash += bonus;
        state.energy = Math.min(100, state.energy + 4);
        state.vibe += 1;
        addLog(`Target hit! +${currency(bonus)} earned.`, 'success');
        target.remove();
        updateUI();
      });

      miniGameEl.innerHTML = '';
      miniGameEl.appendChild(target);
    }

    function updateUI() {
      const income = calcIncome();
      state.totalIncome = income;

      moneyStat.textContent = currency(state.cash);
      repStat.textContent = state.reputation;
      energyStat.textContent = Math.round(state.energy) + '%';
      vibeStat.textContent = state.vibe;
      incomePill.textContent = `+$${income.toFixed(1)} / sec`;
      dayChip.textContent = `Day ${state.day}`;

      renderBoard();
      renderBuildMenu();
      renderInventory();
      updateMission();
    }

    document.getElementById('workBtn').addEventListener('click', () => {
      if (state.energy < 15) {
        addLog('You are too drained to work right now.', 'error');
        return;
      }

      const reward = 18 + state.reputation * 9 + Math.random() * 12;
      state.cash += reward;
      state.energy = Math.max(0, state.energy - 15);
      state.vibe += 3;
      addLog(`Shift complete. +${currency(reward)} earned.`, 'success');
      updateUI();
    });

    document.getElementById('tradeBtn').addEventListener('click', () => {
      const goods = Object.values(state.inventory).reduce((sum, val) => sum + val, 0);
      if (goods <= 0) {
        addLog('No goods to move today.', 'error');
        return;
      }

      const payout = goods * 2.5 + state.reputation * 5;
      state.cash += payout;
      state.inventory.coffee = 0;
      state.inventory.food = 0;
      state.inventory.design = 0;
      state.inventory.tech = 0;
      state.inventory.goods = 0;
      state.inventory.vibe = 0;
      addLog(`Market trade landed. +${currency(payout)} earned.`, 'warning');
      updateUI();
    });

    document.getElementById('upgradeBtn').addEventListener('click', () => {
      const populated = state.board.filter(tile => tile.building).length;
      if (populated === 0) {
        addLog('You need to open a business before upgrading the district.', 'error');
        return;
      }
      const cost = 50 + populated * 20;
      if (state.cash < cost) {
        addLog('The block needs more capital to improve.', 'error');
        return;
      }
      state.cash -= cost;
      state.reputation += 1;
      state.vibe += 4;
      addLog('District upgrade complete. Everything looks sharper.', 'success');
      updateUI();
    });

    document.getElementById('restBtn').addEventListener('click', () => {
      state.energy = Math.min(100, state.energy + 30);
      state.cash = Math.max(0, state.cash - 5);
      addLog('You took a breather and recovered energy.', 'warning');
      updateUI();
    });

    targetBtn.addEventListener('click', spawnTarget);

    setInterval(() => {
      const income = calcIncome();
      state.cash += income;
      state.energy = Math.max(0, state.energy - 0.8);
      state.vibe = Math.min(100, state.vibe + (income > 0 ? 0.2 : 0));

      for (const tile of state.board) {
        if (!tile.building) continue;
        const build = catalog.find(item => item.id === tile.building);
        if (build && build.output) {
          state.inventory[build.output] = (state.inventory[build.output] || 0) + tile.level;
        }
      }

      state.day += 0.25;
      if (state.day >= 30) {
        state.reputation += 1;
        state.day = 1;
        addLog('A new day begins. Your city has momentum.', 'warning');
      }

      updateUI();
    }, 1000);

    renderBuildMenu();
    renderInventory();
    renderBoard();
    updateUI();
    addLog('Welcome to Neon City. Build your first business.', 'success');
    spawnTarget();
  </script>
</body>
</html>
