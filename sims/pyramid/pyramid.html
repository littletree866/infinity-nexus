<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramid · Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="../../icon.jpg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0b0a0f;
      background-image: radial-gradient(circle at 20% 30%, #1e1a2b 0%, #0b0a0f 80%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    .game-wrapper {
      max-width: 820px;
      width: 100%;
      background: rgba(18,16,28,0.9);
      backdrop-filter: blur(4px);
      border: 1px solid #b89b6b;
      border-radius: 36px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,215,140,0.2);
    }
    .pyramid-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid #5a4a3a;
      padding-bottom: 18px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-group h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2.4rem;
      letter-spacing: 4px;
      color: #ecd6b0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      line-height: 1;
    }
    .title-group .ankh { font-size: 2.2rem; color: #d4af37; opacity: 0.7; }
    .stats {
      display: flex;
      gap: 28px;
      background: #1d1825;
      padding: 10px 20px;
      border-radius: 60px;
      border: 1px solid #4d3e30;
      font-size: 0.9rem;
      font-weight: 500;
      color: #cbb59b;
    }
    .stats span { display: flex; align-items: center; gap: 8px; }
    .stats .num { color: #ecd6b0; font-weight: 600; font-feature-settings: "tnum"; }
    .stats .highlight { color: #e2b87a; }
    .story-panel {
      background: #13101b;
      border-radius: 28px;
      padding: 24px 26px;
      border: 1px solid #3b3126;
      box-shadow: inset 0 8px 20px rgba(0,0,0,0.6);
      min-height: 280px;
      max-height: 440px;
      overflow-y: auto;
      margin-bottom: 24px;
      scroll-behavior: smooth;
    }
    .story-panel::-webkit-scrollbar { width: 4px; }
    .story-panel::-webkit-scrollbar-track { background: #1d1825; }
    .story-panel::-webkit-scrollbar-thumb { background: #b89b6b; border-radius: 12px; }
    .story-text { font-size: 1.05rem; line-height: 1.6; color: #e2d7c8; white-space: pre-wrap; }
    .story-text .location {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: #e5cba0;
      border-left: 4px solid #b89b6b;
      padding-left: 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .story-text p { margin-bottom: 14px; }
    .story-text .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #5a4a3a, transparent);
      margin: 20px 0;
    }
    .story-text .gold { color: #e2b87a; font-weight: 500; }
    .story-text .danger { color: #d4786a; font-weight: 500; }
    .story-text .success { color: #8bcb9e; font-weight: 500; }
    .story-text .italic { font-style: italic; opacity: 0.8; }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .action-btn {
      background: #1e1929;
      border: 1px solid #3f3429;
      border-radius: 40px;
      padding: 14px 18px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      color: #d6c8b8;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .action-btn:hover:not(:disabled) {
      background: #2f263b;
      border-color: #b89b6b;
      color: #f0e2d0;
      transform: scale(1.01);
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    .action-btn:disabled {
      opacity: 0.35;
      filter: grayscale(0.6);
      cursor: not-allowed;
      transform: none;
    }
    .action-btn .icon { font-size: 1.3rem; width: 28px; text-align: center; }
    .action-btn .label { flex: 1; }
    .inventory-box {
      background: #12101b;
      border: 1px solid #3b3126;
      border-radius: 60px;
      padding: 12px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 10px;
      margin-top: 6px;
      min-height: 56px;
    }
    .inventory-box .inv-label { color: #a28f7a; font-size: 0.85rem; font-weight: 500; letter-spacing: 1px; }
    .inventory-item {
      background: #241f2e;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      color: #d6c8b8;
      border: 1px solid #4d3e30;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .inventory-item.important { border-color: #b89b6b; background: #2f263b; color: #ecd6b0; }
    .empty-inv { color: #5a4a3a; font-style: italic; font-size: 0.9rem; }
    .puzzle-overlay {
      margin-top: 20px;
      background: #16131f;
      border-radius: 32px;
      padding: 24px 22px;
      border: 1px solid #4d3e30;
      display: none;
    }
    .puzzle-overlay.open { display: block; }
    .puzzle-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #e5cba0; margin-bottom: 8px; }
    .puzzle-desc { color: #b8a692; font-size: 0.95rem; margin-bottom: 18px; }
    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .puzzle-tile {
      background: #241f2e;
      border: 2px solid #3f3429;
      border-radius: 16px;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
      transition: 0.1s ease;
      box-shadow: 0 4px 0 #0b0a0f;
    }
    .puzzle-tile.selected { border-color: #e2b87a; background: #2f263b; transform: scale(0.96); box-shadow: 0 0 18px #b89b6b55; }
    .puzzle-tile:hover { border-color: #b89b6b; }
    .puzzle-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .puzzle-btn {
      background: #1e1929;
      border: 1px solid #3f3429;
      border-radius: 40px;
      padding: 10px 24px;
      color: #d6c8b8;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .puzzle-btn:hover { background: #2f263b; border-color: #b89b6b; }
    .puzzle-btn.primary { background: #b89b6b; border-color: #b89b6b; color: #0b0a0f; font-weight: 600; }
    .puzzle-btn.primary:hover { background: #d4af37; border-color: #d4af37; }
    .puzzle-hint {
      margin-top: 16px;
      color: #b89b6b;
      font-size: 0.9rem;
      padding: 8px 16px;
      border-left: 3px solid #b89b6b;
      background: #1d1825;
      border-radius: 0 20px 20px 0;
    }
    @media (max-width: 640px) {
      .game-wrapper { padding: 20px 16px; }
      .actions-grid { grid-template-columns: 1fr; }
      .stats { gap: 14px; font-size: 0.8rem; padding: 8px 16px; }
      .title-group h1 { font-size: 1.8rem; }
      .puzzle-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="pyramid-header">
    <div class="title-group"><span class="ankh">𓋹</span><h1>PYRAMID</h1></div>
    <div class="stats">
      <span>⚡ <span class="num" id="hpDisplay">100</span>%</span>
      <span>⌛ <span class="num" id="timeDisplay">12:00</span></span>
      <span>📍 <span class="num" id="levelDisplay">1</span>/5</span>
    </div>
  </div>

  <div class="story-panel" id="storyPanel"><div class="story-text" id="storyText"></div></div>

  <div class="actions-grid" id="actionsContainer"></div>

  <div class="inventory-box">
    <span class="inv-label">𓍝 INVENTORY</span>
    <span id="inventoryList"><span class="empty-inv">empty</span></span>
  </div>

  <div class="puzzle-overlay" id="puzzleOverlay">
    <div class="puzzle-title" id="puzzleTitle">Symbol alignment</div>
    <div class="puzzle-desc" id="puzzleDesc">Swap adjacent symbols to match the order.</div>
    <div class="puzzle-grid" id="puzzleGrid"></div>
    <div class="puzzle-actions">
      <button class="puzzle-btn" id="shufflePuzzleBtn">⟳ Shuffle</button>
      <button class="puzzle-btn primary" id="submitPuzzleBtn">✓ Submit</button>
      <button class="puzzle-btn" id="closePuzzleBtn">✕ Close</button>
    </div>
    <div class="puzzle-hint" id="puzzleHint">💡 Look for matching pairs first.</div>
  </div>
</div>

<script>
(function() {
  const state = {
    level: 1, maxLevel: 5, health: 100, time: 720,
    inventory: [], hasTorch: false, hasKey: false,
    puzzleSolved: false, trapCount: 0, hintsUsed: 0,
    puzzleActive: false, puzzleLevel: null,
    puzzlePieces: [], puzzleSolution: [],
    puzzleAttempts: 0, maxAttempts: 10,
    selectedIndex: null, timerInterval: null, gameOver: false
  };

  const levels = {
    1: {
      name: "Entrance Hall",
      desc: `The air is dry and heavy. Sand crunches underfoot. Faint hieroglyphs flicker in the torchlight. A massive stone door looms ahead, sealed with a scarab symbol.\n\nYou sense that the pyramid hides both treasure and peril.`,
      actions: [
        { id: 'examine', label: 'Examine hieroglyphs', icon: '𓋴', action: () => handleExamine() },
        { id: 'search', label: 'Search the floor', icon: '𓍝', action: () => handleSearch() },
        { id: 'torch', label: 'Light torch', icon: '🔥', action: () => handleTorch(), condition: () => state.hasTorch },
        { id: 'door', label: 'Try the stone door', icon: '🚪', action: () => handleDoor() }
      ]
    },
    2: {
      name: "Antechamber of Echoes",
      desc: `The corridor opens into a circular room. Three statues — Anubis, Horus, and Thoth — watch silently. The echoes of your steps seem to answer from the walls. A puzzle door blocks the way forward.`,
      actions: [
        { id: 'statues', label: 'Examine the statues', icon: '🗿', action: () => handleStatues() },
        { id: 'echoes', label: 'Listen to echoes', icon: '👂', action: () => handleEchoes() },
        { id: 'searchCorridor', label: 'Search corridor', icon: '🔍', action: () => handleSearchCorridor() },
        { id: 'puzzleDoor', label: 'Approach puzzle door', icon: '🚪', action: () => handlePuzzleDoor() }
      ]
    },
    3: {
      name: "Sun Chamber",
      desc: `Slivers of light pierce the ceiling, illuminating a complex mechanism. Equations and star charts cover the walls. A door with a glowing sun symbol challenges you.`,
      actions: [
        { id: 'studyWalls', label: 'Study wall equations', icon: '🧮', action: () => handleStudyWalls() },
        { id: 'devices', label: 'Investigate devices', icon: '⚙️', action: () => handleDevices() },
        { id: 'searchChamber', label: 'Search chamber', icon: '🔍', action: () => handleSearchChamber() },
        { id: 'sunPuzzle', label: 'Examine sun puzzle', icon: '🧩', action: () => handleSunPuzzle() }
      ]
    },
    4: {
      name: "Pharaoh's Passage",
      desc: `Golden sarcophagi line the hall. The air is thick with incense. A massive door bearing a scarab seal requires a golden key. The final challenge is close.`,
      actions: [
        { id: 'sarcophagi', label: 'Examine sarcophagi', icon: '⚰️', action: () => handleSarcophagi() },
        { id: 'findKey', label: 'Search for scarab key', icon: '🔑', action: () => handleFindKey() },
        { id: 'studyFinal', label: 'Study final hints', icon: '📜', action: () => handleStudyFinal() },
        { id: 'sunDoor', label: 'Approach sun door', icon: '🚪', action: () => handleSunDoor() }
      ]
    },
    5: {
      name: "Inner Sanctum",
      desc: `The treasure chamber gleams with gold and jewels. But a final guardian puzzle protects the Pharaoh's greatest secret. An escape passage is visible behind a tapestry.`,
      actions: [
        { id: 'treasure', label: 'Examine treasure', icon: '💎', action: () => handleTreasure() },
        { id: 'finalChallenge', label: 'Approach final challenge', icon: '🧩', action: () => handleFinalChallenge() },
        { id: 'gather', label: 'Gather treasure', icon: '💰', action: () => handleGather() },
        { id: 'escape', label: 'Study escape route', icon: '🚪', action: () => handleEscape() }
      ]
    }
  };

  const puzzleDefs = {
    3: {
      name: "Symbol Alignment",
      desc: "Arrange the symbols so matching pairs are adjacent (pair order: Ankh, Eye, Bird, Snake, Jackal, God). Swap two adjacent tiles.",
      solution: ["☥","☥","𓂀","𓂀","🦅","🦅","🐍","🐍","𓃒","𓃒","𓊹","𓊹"],
      pieces: ["☥","𓂀","🦅","🐍","𓃒","𓊹","☥","𓂀","🦅","🐍","𓃒","𓊹"],
      maxAttempts: 8,
      hints: ["Match the pairs: ☥, 𓂀, 🦅, 🐍, 𓃒, 𓊹", "Work from left to right, top to bottom."]
    },
    5: {
      name: "Divine Ascension",
      desc: "Place the gods in order: Ra (𓂀), Anubis (𓃒), Horus (🦅), then the protective symbols: ☥, 🐍, 𓊹. Each appears twice.",
      solution: ["𓂀","𓂀","𓃒","𓃒","🦅","🦅","☥","☥","🐍","🐍","𓊹","𓊹"],
      pieces: ["𓂀","𓃒","🦅","☥","🐍","𓊹","𓂀","𓃒","🦅","☥","🐍","𓊹"],
      maxAttempts: 7,
      hints: ["Order: Ra, Anubis, Horus, Ankh, Snake, God", "Each symbol appears twice."]
    }
  };

  const storyText = document.getElementById('storyText');
  const actionsContainer = document.getElementById('actionsContainer');
  const inventoryList = document.getElementById('inventoryList');
  const hpDisplay = document.getElementById('hpDisplay');
  const timeDisplay = document.getElementById('timeDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const puzzleOverlay = document.getElementById('puzzleOverlay');
  const puzzleTitle = document.getElementById('puzzleTitle');
  const puzzleDesc = document.getElementById('puzzleDesc');
  const puzzleGrid = document.getElementById('puzzleGrid');
  const puzzleHint = document.getElementById('puzzleHint');
  const shuffleBtn = document.getElementById('shufflePuzzleBtn');
  const submitBtn = document.getElementById('submitPuzzleBtn');
  const closePuzzleBtn = document.getElementById('closePuzzleBtn');

  function addStory(text, cls = '') {
    const p = document.createElement('p');
    p.innerHTML = text;
    if (cls) p.className = cls;
    storyText.appendChild(p);
    document.getElementById('storyPanel').scrollTop = document.getElementById('storyPanel').scrollHeight;
  }

  function clearStory() { storyText.innerHTML = ''; }

  function renderLevel() {
    clearStory();
    const lvl = levels[state.level];
    if (!lvl) return;
    const loc = document.createElement('div');
    loc.className = 'location';
    loc.innerHTML = `𓋹 ${lvl.name}`;
    storyText.appendChild(loc);
    addStory(lvl.desc);
    const div = document.createElement('div');
    div.className = 'divider';
    storyText.appendChild(div);
    if (state.health < 30) addStory('⚠️ <span class="danger">You are badly wounded.</span>');
    if (state.time < 120) addStory('⏳ <span class="danger">The sands of time are running out!</span>');
    renderActions(lvl);
    updateUI();
  }

  function renderActions(lvl) {
    actionsContainer.innerHTML = '';
    lvl.actions.forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'action-btn';
      const cond = a.condition ? a.condition() : true;
      btn.disabled = !cond || state.gameOver;
      btn.innerHTML = `<span class="icon">${a.icon}</span><span class="label">${a.label}</span>`;
      btn.addEventListener('click', () => { if (!state.gameOver) a.action(); });
      actionsContainer.appendChild(btn);
    });
  }

  function updateUI() {
    hpDisplay.textContent = Math.max(0, state.health);
    const mins = Math.floor(state.time / 60);
    const secs = state.time % 60;
    timeDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    levelDisplay.textContent = state.level;
    if (state.inventory.length === 0) {
      inventoryList.innerHTML = '<span class="empty-inv">empty</span>';
    } else {
      inventoryList.innerHTML = state.inventory.map(item =>
        `<span class="inventory-item ${item.includes('Key') || item.includes('Torch') ? 'important' : ''}">${item}</span>`
      ).join('');
    }
  }

  function triggerTrap(level) {
    const trapChance = 0.2 + (level * 0.04);
    if (Math.random() < trapChance) {
      const dmg = 10 + Math.floor(Math.random() * 18);
      state.health = Math.max(0, state.health - dmg);
      state.trapCount++;
      addStory(`<span class="danger">⚠️ TRAP! You take ${dmg} damage.</span>`);
      updateUI();
      if (state.health <= 0) endGame(false, 'You have succumbed to the pyramid\'s traps.');
      return true;
    }
    return false;
  }

  function handleExamine() {
    if (triggerTrap(state.level)) return;
    const foundKey = !state.hasKey && Math.random() < 0.35;
    addStory(`The hieroglyphs tell of Pharaoh Amenhotep III. You notice a sequence: 𓂀 → 𓃒 → 𓊹 → 🐍 → 🦅 → ☥. ${foundKey ? '<span class="success">You find an ancient bronze key behind a loose stone!</span>' : ''}`);
    if (foundKey) { state.hasKey = true; state.inventory.push('Bronze Key'); updateUI(); }
  }

  function handleSearch() {
    if (triggerTrap(state.level)) return;
    if (!state.hasTorch && Math.random() < 0.5) {
      state.hasTorch = true;
      state.inventory.push('Oil Torch');
      addStory('<span class="success">🔥 You find an oil torch and flint!</span>');
      updateUI();
    } else {
      addStory('You find nothing but dust and a few scarab shells.');
    }
    
    renderLevel();
  }

  function handleTorch() {
    if (state.hasTorch) {
      addStory('You light the torch. The chamber brightens, revealing hidden carvings. The darkness retreats.');
    } else {
      addStory('You have no torch to light.');
    }
  }

  function handleDoor() {
    if (state.level === 1) {
      if (state.hasKey) {
        addStory('<span class="success">The bronze key fits! The stone door grinds open.</span>');
        setTimeout(() => advanceLevel(), 800);
      } else {
        addStory('<span class="danger">The door is sealed. You need a key.</span>');
      }
    }
  }

  function handleStatues() {
    if (triggerTrap(state.level)) return;
    addStory('The statues represent Anubis, Horus, and Thoth. They seem to point toward the puzzle door. A faint inscription: "Order of the gods."');
  }

  function handleEchoes() {
    if (triggerTrap(state.level)) return;
    addStory('The echoes form a pattern: 3-1-4. You feel this might be important.');
    if (!state.inventory.includes('Echo Stone') && Math.random() < 0.3) {
      state.inventory.push('Echo Stone');
      addStory('<span class="success">You find a resonant stone that amplifies sound.</span>');
      updateUI();
    }
  }

  function handleSearchCorridor() {
    if (triggerTrap(state.level)) return;
    const items = ['Papyrus Scroll', 'Gold Bead', 'Ceramic Shard'];
    if (Math.random() < 0.4 && state.inventory.length < 8) {
      const item = items[Math.floor(Math.random() * items.length)];
      state.inventory.push(item);
      addStory(`<span class="success">You found ${item}.</span>`);
      updateUI();
    } else {
      addStory('The corridor is bare.');
    }
  }

  function handlePuzzleDoor() {
    if (state.level === 2) {
      addStory('The puzzle door requires a sequence of symbols. You notice the symbols match the ones from the entrance hall.');
    }
  }

  function handleStudyWalls() {
    if (triggerTrap(state.level)) return;
    addStory('Equations describe celestial movements. A phrase: "Patterns repeat in pairs."');
  }

  function handleDevices() {
    if (triggerTrap(state.level)) return;
    addStory('The brass mechanisms are intricate. You find a bronze gear.');
    if (!state.inventory.includes('Bronze Gear')) {
      state.inventory.push('Bronze Gear');
      updateUI();
    }
  }

  function handleSearchChamber() {
    if (triggerTrap(state.level)) return;
    addStory('You find an inscription: "Match what belongs together. Order matters."');
  }

  function handleSunPuzzle() {
    if (state.level === 3) openPuzzle(3);
  }

  function handleSarcophagi() {
    if (triggerTrap(state.level)) return;
    addStory('The sarcophagi are covered in gold leaf. One has a hidden compartment.');
    if (!state.hasKey && Math.random() < 0.4) {
      state.hasKey = true;
      state.inventory.push('Golden Scarab Key');
      addStory('<span class="success">You find a Golden Scarab Key!</span>');
      updateUI();
    }
  }

  function handleFindKey() {
    if (state.hasKey) { addStory('You already have the key.'); return; }
    if (triggerTrap(state.level)) return;
    if (Math.random() < 0.5) {
      state.hasKey = true;
      state.inventory.push('Golden Scarab Key');
      addStory('<span class="success">You discover the Golden Scarab Key under a sarcophagus.</span>');
      updateUI();
    } else {
      addStory('You search but find no key.');
    }
  }

  function handleStudyFinal() {
    addStory('The final puzzle order: Ra (𓂀), Anubis (𓃒), Horus (🦅), then Ankh, Snake, God. Remember the sequence.');
  }

  function handleSunDoor() {
    if (state.level === 4) {
      if (state.hasKey && state.inventory.includes('Golden Scarab Key')) {
        addStory('<span class="success">The Scarab Key fits! The door opens to the Inner Sanctum.</span>');
        setTimeout(() => advanceLevel(), 800);
      } else {
        addStory('<span class="danger">The sun door requires the Golden Scarab Key.</span>');
      }
    }
  }

  function handleTreasure() {
    addStory('The treasure is breathtaking: golden statues, jeweled crowns, and ancient artifacts. But the final puzzle protects them.');
  }

  function handleFinalChallenge() {
    if (state.level === 5) openPuzzle(5);
  }

  function handleGather() {
    if (state.puzzleSolved) {
      const treasures = ['Gold Coin', 'Silver Bracelet', 'Lapis Gem', 'Ivory Figurine'];
      const t = treasures[Math.floor(Math.random() * treasures.length)];
      state.inventory.push(t);
      addStory(`<span class="success">You gather ${t}.</span>`);
      updateUI();
    } else {
      addStory('<span class="danger">The treasure is magically sealed until you solve the final puzzle.</span>');
    }
  }

  function handleEscape() {
    addStory('You spot a hidden passage behind the tapestry. It leads to the outside.');
    if (state.puzzleSolved) {
      endGame(true);
    } else {
      addStory('But the passage is blocked by a magical barrier. Solve the final puzzle to escape.');
    }
  }

  function openPuzzle(level) {
    if (state.gameOver) return;
    const def = puzzleDefs[level];
    if (!def) return;
    state.puzzleActive = true;
    state.puzzleLevel = level;
    state.puzzleAttempts = 0;
    state.selectedIndex = null;
    state.puzzleSolution = [...def.solution];
    state.puzzlePieces = [...def.pieces];
    state.maxAttempts = def.maxAttempts || 8;
    puzzleOverlay.classList.add('open');
    puzzleTitle.textContent = def.name;
    puzzleDesc.textContent = def.desc;
    puzzleHint.textContent = '💡 ' + def.hints[0];
    renderPuzzleGrid();
  }

  function renderPuzzleGrid() {
    puzzleGrid.innerHTML = '';
    state.puzzlePieces.forEach((sym, idx) => {
      const tile = document.createElement('div');
      tile.className = 'puzzle-tile';
      tile.textContent = sym;
      tile.dataset.index = idx;
      tile.addEventListener('click', () => onTileClick(idx));
      if (state.selectedIndex === idx) tile.classList.add('selected');
      puzzleGrid.appendChild(tile);
    });
  }

  function onTileClick(idx) {
    if (state.gameOver || !state.puzzleActive) return;
    const tiles = puzzleGrid.querySelectorAll('.puzzle-tile');
    if (state.selectedIndex === null) {
      state.selectedIndex = idx;
      tiles.forEach((t, i) => t.classList.toggle('selected', i === idx));
      return;
    }
    const prev = state.selectedIndex;
    if (prev === idx) {
      state.selectedIndex = null;
      tiles.forEach(t => t.classList.remove('selected'));
      return;
    }
    if (!areAdjacent(prev, idx)) {
      addStory('<span class="danger">You can only swap adjacent symbols.</span>');
      state.selectedIndex = null;
      tiles.forEach(t => t.classList.remove('selected'));
      return;
    }
    [state.puzzlePieces[prev], state.puzzlePieces[idx]] = [state.puzzlePieces[idx], state.puzzlePieces[prev]];
    state.selectedIndex = null;
    renderPuzzleGrid();
    state.puzzleAttempts++;
    if (state.puzzleAttempts > state.maxAttempts) {
      addStory('<span class="danger">Too many attempts! The puzzle resets.</span>');
      state.health = Math.max(0, state.health - 15);
      updateUI();
      shufflePuzzle();
    }
    const solved = state.puzzlePieces.every((v, i) => v === state.puzzleSolution[i]);
    if (solved) {
      state.puzzleSolved = true;
      addStory('<span class="success">✦ PUZZLE SOLVED! ✦ The way is open.</span>');
      puzzleOverlay.classList.remove('open');
      if (state.level === 5) endGame(true);
      else setTimeout(() => advanceLevel(), 600);
    } else {
      if (state.puzzleAttempts === 3 && puzzleDefs[state.puzzleLevel]) {
        const hints = puzzleDefs[state.puzzleLevel].hints;
        if (hints.length > 1) puzzleHint.textContent = '💡 ' + hints[1];
      }
    }
  }

  function areAdjacent(i1, i2) {
    const cols = 4;
    const r1 = Math.floor(i1 / cols), c1 = i1 % cols;
    const r2 = Math.floor(i2 / cols), c2 = i2 % cols;
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
  }

  function shufflePuzzle() {
    const def = puzzleDefs[state.puzzleLevel];
    if (!def) return;
    state.puzzlePieces = [...def.pieces].sort(() => Math.random() - 0.5);
    state.selectedIndex = null;
    renderPuzzleGrid();
    addStory('The symbols have been shuffled.');
  }

  function closePuzzle() {
    puzzleOverlay.classList.remove('open');
    state.puzzleActive = false;
    state.selectedIndex = null;
  }

  function advanceLevel() {
    if (state.level < state.maxLevel) {
      state.level++;
      state.puzzleSolved = false;
      renderLevel();
      updateUI();
    }
  }

  function endGame(success, msg = '') {
    if (state.gameOver) return;
    state.gameOver = true;
    clearInterval(state.timerInterval);
    puzzleOverlay.classList.remove('open');
    actionsContainer.innerHTML = '';
    if (success) {
      const treasureCount = state.inventory.filter(i => !['Oil Torch','Bronze Key','Golden Scarab Key','Echo Stone','Bronze Gear'].includes(i)).length;
      const score = Math.floor(treasureCount * 1200 + state.time * 8 + state.health * 30 - state.trapCount * 150);
      addStory(`<span class="success">🏆 VICTORY! You escape the pyramid with treasures! Score: ${score}</span>`);
      addStory(`💰 Treasures: ${treasureCount} items · Health: ${state.health}% · Time left: ${Math.floor(state.time/60)}:${String(state.time%60).padStart(2,'0')}`);
      addStory('The sun rises over the desert. You are free.');
    } else {
      addStory(`<span class="danger">☠️ GAME OVER</span> ${msg || 'The pyramid has claimed you.'}`);
    }
    updateUI();
    const restartBtn = document.createElement('button');
    restartBtn.className = 'action-btn';
    restartBtn.style.gridColumn = '1 / -1';
    restartBtn.style.justifyContent = 'center';
    restartBtn.innerHTML = '<span class="icon">↻</span><span class="label">Play again</span>';
    restartBtn.addEventListener('click', () => location.reload());
    actionsContainer.appendChild(restartBtn);
  }

  function startTimer() {
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      if (state.gameOver) return;
      state.time = Math.max(0, state.time - 1);
      updateUI();
      if (state.time === 0) endGame(false, 'Time has run out. The pyramid consumes you.');
      if (state.time < 60 && state.time % 10 === 0) {
        addStory('<span class="danger">⏳ The sands are nearly gone.</span>');
      }
    }, 1000);
  }

  function init() {
    renderLevel();
    updateUI();
    startTimer();
    shuffleBtn.addEventListener('click', shufflePuzzle);
    submitBtn.addEventListener('click', () => {
      const solved = state.puzzlePieces.every((v, i) => v === state.puzzleSolution[i]);
      if (solved) {
        state.puzzleSolved = true;
        addStory('<span class="success">✦ PUZZLE SOLVED! ✦</span>');
        puzzleOverlay.classList.remove('open');
        if (state.level === 5) endGame(true);
        else setTimeout(() => advanceLevel(), 600);
      } else {
        addStory('<span class="danger">Not yet. Keep swapping.</span>');
        state.puzzleAttempts++;
        if (state.puzzleAttempts > state.maxAttempts) {
          addStory('<span class="danger">Too many attempts! Reshuffling.</span>');
          state.health = Math.max(0, state.health - 15);
          updateUI();
          shufflePuzzle();
        }
      }
    });
    closePuzzleBtn.addEventListener('click', closePuzzle);
  }

  init();
})();
</script>
</body>
</html>
